<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SANTE Member Login</title><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{
  --navy:#082f61;
  --navy2:#0b4f88;
  --yellow:#ffc321;
  --line:#dce7f2;
  --muted:#7488a1;
  --bg:#f8fbfe;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Prompt",sans-serif;color:var(--navy);background:#fff}
body{min-height:100vh}
.page{min-height:100vh;display:grid;grid-template-columns:52% 48%}
.hero{position:relative;min-height:100vh;overflow:hidden;background:#eef7ff}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block}
.login-side{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px;background:linear-gradient(135deg,#fff 0%,#f7fbfe 100%)}
.login-card{width:min(100%,690px);background:#fff;border:1px solid #d9e5ef;border-radius:24px;padding:44px 48px 38px;box-shadow:0 22px 60px rgba(16,49,83,.08)}
.login-eyebrow{font-size:13px;font-weight:700;color:#d79300;margin-bottom:9px}
.login-title{font-size:37px;line-height:1.15;margin:0;color:#0a2f60;letter-spacing:-.4px}
.login-description{margin:14px 0 0;color:#71849b;font-size:15px;line-height:1.55}
.login-form{margin-top:28px}
.form-group{margin-bottom:18px}
.form-label{display:block;margin-bottom:8px;font-size:14px;font-weight:600;color:#0c2f5d}
.required{color:#d64045}
.input-box{height:60px;border:1.5px solid #d8e4ef;border-radius:13px;display:flex;align-items:center;background:#fff;overflow:hidden}
.input-box:focus-within{border-color:#8cbce2;box-shadow:0 0 0 3px rgba(50,133,199,.08)}
.input-icon{width:54px;display:grid;place-items:center;color:#6f89a8;flex:0 0 54px}
.input-icon svg{width:22px;height:22px}
.input-box input{border:0!important;outline:0!important;box-shadow:none!important;flex:1;height:100%;font:400 15px Prompt;background:transparent;color:#163451;padding:0 6px}
.input-box input::placeholder{color:#9aaabc}
.password-toggle{height:100%;border:0;background:transparent;padding:0 18px;color:#44617f;font:500 13px Prompt;display:flex;gap:7px;align-items:center;cursor:pointer}
.password-toggle svg{width:20px;height:20px}
.form-options{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:2px 0 20px}
.remember{display:flex;align-items:center;gap:8px;color:#6e8198;font-size:13px}
.remember input{width:18px;height:18px;accent-color:#f1b400}
.forgot{border:0;background:transparent;color:#1670d1;font:600 13px Prompt;cursor:pointer}
.message{display:none;border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:12px;background:#fff0f1;color:#a52a35}
.message.show{display:block}.message.success{background:#edf9f1;color:#28794b}
.login-button{height:62px;width:100%;border:0;border-radius:13px;background:linear-gradient(90deg,#ffbd13,#ffc935);color:#082f61;font:700 15px Prompt;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:0 10px 25px rgba(255,190,20,.22)}
.login-button svg{width:22px;height:22px}
.login-button:disabled{opacity:.65;cursor:wait}
.other-divider{display:flex;align-items:center;gap:14px;margin:24px 0 19px;color:#8496aa;font-size:13px}
.other-divider:before,.other-divider:after{content:"";height:1px;background:#dce6ef;flex:1}
.secondary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.secondary-button{min-height:68px;border:1.5px solid #d6e4f0;border-radius:13px;text-decoration:none;color:#0d3f75;display:flex;align-items:center;gap:11px;padding:12px 16px;font-size:13px;font-weight:600;background:#fff}
.secondary-button .sec-icon{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:#eef6ff;font-size:19px}
.secondary-button small{display:block;color:#8193a6;font-weight:400;font-size:11px;margin-top:2px}
.security-note{margin-top:22px;padding:14px 16px;background:#eef7ff;border-radius:12px;color:#6f839b;font-size:11px;line-height:1.5;display:flex;gap:10px;align-items:flex-start}
@media(max-width:1000px){.page{grid-template-columns:46% 54%}.login-side{padding:28px}.login-card{padding:34px 30px}.login-title{font-size:32px}}
@media(max-width:767px){.page{display:block}.hero{min-height:310px;height:310px}.hero img{object-fit:cover;object-position:center}.login-side{min-height:auto;padding:0 12px 30px;background:#f6faff}.login-card{margin-top:-18px;position:relative;z-index:3;border-radius:22px;padding:28px 20px 24px}.login-title{font-size:28px}.login-description{font-size:11px}.secondary-grid{grid-template-columns:1fr}.input-box{height:54px}}
</style></head>
<body><main class="page"><section class="hero"><img src="sante-member-login-hero.png" alt="SANTE Member"></section><section class="login-side">
    <div class="login-card">
      <div class="login-eyebrow">SANTE MEMBER</div>
      <h1 class="login-title">เข้าสู่ระบบสมาชิก</h1>
      <p class="login-description">เข้าสู่ระบบเพื่อใช้งานสมัครอบรม งานตรวจวัด งานบริการ และงานที่ปรึกษาของ SANTE พร้อมติดตามการชำระเงิน เอกสาร และสถานะงานของคุณในที่เดียว</p>
      <form id="loginForm" class="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">อีเมล <span class="required">*</span></label>
          <div class="input-box">
            <span class="input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></span>
            <input id="email" type="email" autocomplete="email" placeholder="กรอกอีเมล" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">รหัสผ่าน <span class="required">*</span></label>
          <div class="input-box">
            <span class="input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 018 0v3"></path></svg></span>
            <input id="password" type="password" autocomplete="current-password" placeholder="กรอกรหัสผ่าน" required>
            <button id="passwordToggle" class="password-toggle" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path><circle cx="12" cy="12" r="2.5"></circle></svg><span id="passwordToggleText">แสดง</span></button>
          </div>
        </div>
        <div class="form-options">
          <label class="remember"><input id="rememberMe" type="checkbox" checked> จดจำการเข้าสู่ระบบ</label>
          <button id="forgotButton" class="forgot" type="button">ลืมรหัสผ่าน?</button>
        </div>
        <div id="message" class="message" role="alert"></div>
        <button id="loginButton" class="login-button" type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path><path d="M14 3h5a2 2 0 012 2v14a2 2 0 01-2 2h-5"></path></svg>
          <span id="loginButtonText">เข้าสู่ระบบ</span>
        </button>
      </form>
      <div class="other-divider"><span>ยังไม่มีบัญชีสมาชิก SANTE?</span></div>
      
      <div class="secondary-grid" style="grid-template-columns:1fr">
        <a href="member-register.html" class="secondary-button"><span class="sec-icon">👤</span><span>สมัครสมาชิก<small>สร้างบัญชี SANTE Member</small></span></a>
      </div>
      <div style="text-align:center;margin-top:24px"><a href="index.html" style="color:#778da5;text-decoration:none;font-size:12px">← กลับหน้าหลัก SANTE</a></div>
    
    </div></section></main>

<script>
const SUPABASE_URL="https://cyegjwerxlxhczrfiurz.supabase.co";
const SUPABASE_KEY="sb_publishable_Hhr1LDrJqvzdEcHR4cScwA_YA9b9eYF";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{storageKey:"sante-member-auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});
const loginForm=document.getElementById("loginForm");
const emailInput=document.getElementById("email");
const passwordInput=document.getElementById("password");
const passwordToggle=document.getElementById("passwordToggle");
const passwordToggleText=document.getElementById("passwordToggleText");
const forgotButton=document.getElementById("forgotButton");
const loginButton=document.getElementById("loginButton");
const loginButtonText=document.getElementById("loginButtonText");
const message=document.getElementById("message");

function showMessage(text,success=false){message.className="message show"+(success?" success":"");message.textContent=text}
function clearMessage(){message.className="message";message.textContent=""}
function setLoading(v){loginButton.disabled=v;loginButtonText.textContent=v?"กำลังเข้าสู่ระบบ...":"เข้าสู่ระบบ"}

passwordToggle.addEventListener("click",()=>{
  const hidden=passwordInput.type==="password";
  passwordInput.type=hidden?"text":"password";
  passwordToggleText.textContent=hidden?"ซ่อน":"แสดง";
});

forgotButton.addEventListener("click",async()=>{
  clearMessage();
  const email=emailInput.value.trim();
  if(!email){showMessage("กรุณากรอกอีเมลก่อนเลือก “ลืมรหัสผ่าน?”");emailInput.focus();return}
  forgotButton.disabled=true;
  try{
    const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/member-login.html"});
    if(error)throw error;
    showMessage("ส่งลิงก์ตั้งรหัสผ่านใหม่ไปยังอีเมลแล้ว",true);
  }catch(e){showMessage(e.message||"ไม่สามารถส่งอีเมลรีเซ็ตรหัสผ่านได้")}
  finally{forgotButton.disabled=false}
});

loginForm.addEventListener("submit",async e=>{
  e.preventDefault();clearMessage();
  const email=emailInput.value.trim(),password=passwordInput.value;
  if(!email||!password){showMessage("กรุณากรอกอีเมลและรหัสผ่านให้ครบ");return}
  setLoading(true);
  try{
    const {data,error}=await db.auth.signInWithPassword({email,password});
    if(error)throw error;
    const user=data.user;
    const {data:profile,error:profileError}=await db.from("profiles").select("id,account_status,email").eq("id",user.id).maybeSingle();
    if(profileError)throw profileError;
    if(profile && String(profile.account_status||"ACTIVE").toUpperCase()!=="ACTIVE"){
      await db.auth.signOut();
      throw new Error("บัญชีสมาชิกนี้ยังไม่พร้อมใช้งาน กรุณาติดต่อ SANTE");
    }
    showMessage("เข้าสู่ระบบสำเร็จ กำลังเปิดหน้าสมาชิก...",true);
    setTimeout(()=>location.replace("member-home.html"),250);
  }catch(e){
    showMessage(e.message==="Invalid login credentials"?"อีเมลหรือรหัสผ่านไม่ถูกต้อง":(e.message||"เข้าสู่ระบบไม่สำเร็จ"));
    setLoading(false);
  }
});

(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(session?.user) location.replace("member-home.html");
})();
</script>
</body></html>
