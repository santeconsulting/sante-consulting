<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SANTE Member Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

:root{
  --navy:#082f61;
  --yellow:#ffc321;
  --line:#d9e5f0;
  --text:#173654;
  --muted:#71849b;
  --bg:#f7fbff;
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;min-height:100%;font-family:"Prompt",sans-serif;color:var(--text);background:var(--bg)}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
a{color:inherit}
button,input{font-family:inherit}

/* Desktop: both halves share the same viewport and therefore scale together. */
.page{
  width:100%;
  min-height:100vh;
  min-height:100dvh;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  background:#fff;
}
.hero{
  position:relative;
  min-width:0;
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
  background:#eef7ff;
}
.hero-media{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center center;
}
.login-side{
  min-width:0;
  min-height:100vh;
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:clamp(14px,2.2vh,30px) clamp(18px,2.8vw,48px);
  background:linear-gradient(135deg,#f9fcff 0%,#fff 58%,#f8fbff 100%);
}
.login-card{
  width:min(100%,660px);
  background:rgba(255,255,255,.98);
  border:1px solid #dbe6f0;
  border-radius:clamp(18px,2.4vh,26px);
  padding:clamp(18px,2.7vh,34px) clamp(22px,2.7vw,40px);
  box-shadow:0 20px 55px rgba(8,47,97,.08);
}
.login-eyebrow{margin:0 0 clamp(5px,.8vh,9px);color:#c98e00;font-size:clamp(11px,1.45vh,14px);font-weight:700;letter-spacing:.02em}
.login-title{margin:0;color:var(--navy);font-size:clamp(28px,4.2vh,46px);line-height:1.08;letter-spacing:-.025em;font-weight:700}
.login-description{margin:clamp(7px,1.2vh,12px) 0 0;color:var(--muted);font-size:clamp(11px,1.55vh,15px);line-height:1.55}
.login-form{margin-top:clamp(13px,2.1vh,22px)}
.form-group{margin-bottom:clamp(9px,1.45vh,15px)}
.form-label{display:block;margin-bottom:clamp(4px,.7vh,7px);font-size:clamp(11px,1.45vh,13px);font-weight:600;color:#0c2f5d}
.required{color:#d64045}
.input-box{height:clamp(46px,6.1vh,56px);border:1.5px solid #d8e4ef;border-radius:clamp(10px,1.4vh,13px);display:flex;align-items:center;background:#fff;overflow:hidden;transition:border-color .2s ease,box-shadow .2s ease}
.input-box:focus-within{border-color:#85b7df;box-shadow:0 0 0 3px rgba(50,133,199,.08)}
.input-icon{width:clamp(44px,5.5vh,50px);display:grid;place-items:center;color:#6f89a8;flex:0 0 clamp(44px,5.5vh,50px)}
.input-icon svg{width:clamp(18px,2.3vh,20px);height:clamp(18px,2.3vh,20px)}
.input-box input{min-width:0;border:0!important;outline:0!important;box-shadow:none!important;flex:1;height:100%;font-size:clamp(12px,1.55vh,14px);background:transparent;color:#163451;padding:0 8px}
.input-box input::placeholder{color:#9aaabc}
.password-toggle{height:100%;border:0;background:transparent;padding:0 clamp(10px,1.5vw,14px);color:#44617f;font-size:clamp(10px,1.35vh,12px);font-weight:500;display:flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
.password-toggle svg{width:clamp(16px,2vh,18px);height:clamp(16px,2vh,18px)}
.form-options{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 clamp(10px,1.55vh,16px)}
.remember{display:flex;align-items:center;gap:7px;color:#6e8198;font-size:clamp(10px,1.35vh,12px)}
.remember input{width:clamp(14px,1.8vh,16px);height:clamp(14px,1.8vh,16px);accent-color:#f1b400}
.forgot{border:0;background:transparent;color:#1670d1;font-size:clamp(10px,1.35vh,12px);font-weight:600;cursor:pointer;padding:0}
.message{display:none;border-radius:10px;padding:9px 11px;margin:0 0 10px;font-size:11px;background:#fff0f1;color:#a52a35}
.message.show{display:block}.message.success{background:#edf9f1;color:#28794b}.message.info{background:#edf5ff;color:#245c9c}
.login-button{height:clamp(46px,6.2vh,56px);width:100%;border:0;border-radius:clamp(10px,1.4vh,13px);background:linear-gradient(90deg,#ffbd13,#ffc935);color:#082f61;font-size:clamp(13px,1.7vh,15px);font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;box-shadow:0 10px 25px rgba(255,190,20,.22)}
.login-button svg{width:clamp(18px,2.3vh,20px);height:clamp(18px,2.3vh,20px)}.login-button:disabled{opacity:.65;cursor:wait}
.other-divider{display:flex;align-items:center;gap:12px;margin:clamp(10px,1.65vh,17px) 0 clamp(8px,1.3vh,14px);color:#8496aa;font-size:clamp(10px,1.35vh,12px);text-align:center}
.other-divider:before,.other-divider:after{content:"";height:1px;background:#dce6ef;flex:1}
.secondary-grid{display:grid;gap:9px}
.secondary-button{min-height:clamp(52px,7vh,62px);border:1.5px solid #d6e4f0;border-radius:clamp(11px,1.5vh,14px);text-decoration:none;color:#0d3f75;display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:clamp(11px,1.45vh,13px);font-weight:600;background:#fff;transition:.2s ease box-shadow,.2s ease transform}
.secondary-button:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(11,79,136,.08)}
.secondary-button .sec-icon{width:clamp(32px,4.4vh,38px);height:clamp(32px,4.4vh,38px);border-radius:50%;display:grid;place-items:center;background:#eef6ff;font-size:clamp(14px,1.9vh,16px);flex:0 0 clamp(32px,4.4vh,38px)}
.secondary-button small{display:block;color:#8193a6;font-weight:400;font-size:clamp(9px,1.1vh,10px);margin-top:2px;line-height:1.35}
.back-home{text-align:center;margin-top:clamp(10px,1.55vh,16px)}.back-home a{text-decoration:none;color:#778da5;font-size:clamp(9px,1.2vh,11px)}
.security-note{margin-top:clamp(9px,1.45vh,15px);padding:clamp(8px,1.1vh,11px) 12px;background:#eef7ff;border-radius:11px;color:#6f839b;font-size:clamp(9px,1.05vh,10px);line-height:1.4;display:flex;gap:9px;align-items:flex-start}
.security-note span:first-child{font-size:14px;line-height:1}

/* Admin has two shortcut cards; member has one. */
.admin-page .secondary-grid{grid-template-columns:1fr 1fr}
.member-page .secondary-grid{grid-template-columns:1fr}

/* True desktop fit: viewport itself is the frame, so no vertical page scrollbar at 100%. */
@media (min-width:901px){
  html,body{width:100%;height:100%;overflow:hidden}
  .page{height:100vh;height:100dvh;min-height:0;overflow:hidden}
  .hero,.login-side{height:100vh;height:100dvh;min-height:0}
  .login-card{max-height:calc(100dvh - 24px)}
}

/* Slight width rebalance on smaller desktop while both sides still move together. */
@media (min-width:901px) and (max-width:1250px){
  .page{grid-template-columns:minmax(0,48%) minmax(0,52%)}
  .login-side{padding-left:20px;padding-right:20px}
}

/* Tablet / mobile becomes stacked and scrollable by design. */
@media (max-width:900px){
  html,body{height:auto;overflow-x:hidden;overflow-y:auto}
  .page{display:block;min-height:100dvh;background:#f7fbff}
  .hero{min-height:0;height:auto;overflow:visible;background:#eef7ff}
  .hero-media{position:relative;inset:auto;width:100%;height:auto;object-fit:contain;object-position:center top}
  .login-side{min-height:auto;height:auto;padding:18px 16px 28px;background:#f7fbff}
  .login-card{width:100%;max-width:680px;max-height:none;border-radius:24px;padding:28px 24px;box-shadow:0 16px 38px rgba(8,47,97,.07)}
  .login-title{font-size:clamp(28px,6vw,40px)}
  .login-description{font-size:13px}
  .input-box input{font-size:16px}
}
@media (max-width:600px){
  .login-side{padding:14px 12px calc(22px + env(safe-area-inset-bottom))}
  .login-card{border-radius:20px;padding:24px 18px 20px}
  .login-eyebrow{font-size:12px;margin-bottom:8px}
  .login-title{font-size:clamp(28px,8.6vw,36px)}
  .login-description{font-size:12px;line-height:1.6}
  .login-form{margin-top:22px}
  .form-group{margin-bottom:15px}
  .input-box{height:54px;border-radius:12px}
  .input-icon{width:46px;flex-basis:46px}.input-icon svg{width:20px;height:20px}
  .password-toggle{padding:0 12px;font-size:12px}
  .form-options{align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .remember,.forgot{font-size:12px}
  .login-button{height:56px;border-radius:12px}
  .other-divider{margin:21px 0 16px;font-size:12px;gap:10px}
  .secondary-button{min-height:66px;border-radius:14px;padding:10px 13px;font-size:13px}
  .secondary-button .sec-icon{width:38px;height:38px;flex-basis:38px}
  .admin-page .secondary-grid{grid-template-columns:1fr}
  .security-note{margin-top:18px;font-size:10px}
}

</style>
</head>
<body>
<main class="page member-page">
  <section class="hero" aria-label="SANTE Member Hero">
    <img class="hero-media" src="sante-member-login-hero.png" alt="SANTE Member">
  </section>

  <section class="login-side">
    <div class="login-card">
      <div class="login-eyebrow">SANTE MEMBER</div>
      <h1 class="login-title">เข้าสู่ระบบสมาชิก</h1>
      <p class="login-description">เข้าสู่ระบบเพื่อใช้งานสมัครอบรม งานตรวจวัด งานบริการ และงานที่ปรึกษาของ SANTE พร้อมติดตามการชำระเงิน เอกสาร และสถานะงานของคุณในที่เดียว</p>
      <form id="loginForm" class="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">อีเมล <span class="required">*</span></label>
          <div class="input-box">
            <span class="input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></span>
            <input id="email" type="email" autocomplete="email" placeholder="กรอกอีเมล" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">รหัสผ่าน <span class="required">*</span></label>
          <div class="input-box">
            <span class="input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 018 0v3"></path></svg></span>
            <input id="password" type="password" autocomplete="current-password" placeholder="กรอกรหัสผ่าน" required>
            <button id="passwordToggle" class="password-toggle" type="button" aria-label="toggle password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path><circle cx="12" cy="12" r="2.5"></circle></svg><span id="passwordToggleText">แสดง</span></button>
          </div>
        </div>
        <div class="form-options">
          <label class="remember"><input id="rememberMe" type="checkbox" checked> จดจำการเข้าสู่ระบบ</label>
          <button id="forgotButton" class="forgot" type="button">ลืมรหัสผ่าน?</button>
        </div>
        <div id="message" class="message" role="alert"></div>
        <button id="loginButton" class="login-button" type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path><path d="M14 3h5a2 2 0 012 2v14a2 2 0 01-2 2h-5"></path></svg>
          <span id="loginButtonText">เข้าสู่ระบบ</span>
        </button>
      </form>
      <div class="other-divider"><span>ยังไม่มีบัญชีสมาชิก SANTE?</span></div>
      <div class="secondary-grid">
        <a href="member-register.html" class="secondary-button"><span class="sec-icon">👤</span><span>สมัครสมาชิก<small>สร้างบัญชี SANTE Member</small></span></a>
      </div>
      <div class="back-home"><a href="index.html">← กลับหน้าหลัก SANTE</a></div>
    </div>
  </section>
</main>
<script>
const SUPABASE_URL="https://cyegjwerxlxhczrfiurz.supabase.co";
const SUPABASE_KEY="sb_publishable_Hhr1LDrJqvzdEcHR4cScwA_YA9b9eYF";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:"sante-member-auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const loginForm=document.getElementById("loginForm");
const emailInput=document.getElementById("email");
const passwordInput=document.getElementById("password");
const passwordToggle=document.getElementById("passwordToggle");
const passwordToggleText=document.getElementById("passwordToggleText");
const forgotButton=document.getElementById("forgotButton");
const loginButton=document.getElementById("loginButton");
const loginButtonText=document.getElementById("loginButtonText");
const message=document.getElementById("message");
function showMessage(text,success=false){message.className="message show"+(success?" success":"");message.textContent=text}
function clearMessage(){message.className="message";message.textContent=""}
function setLoading(v){loginButton.disabled=v;loginButtonText.textContent=v?"กำลังเข้าสู่ระบบ...":"เข้าสู่ระบบ"}
passwordToggle.addEventListener("click",()=>{const hidden=passwordInput.type==="password";passwordInput.type=hidden?"text":"password";passwordToggleText.textContent=hidden?"ซ่อน":"แสดง";});
forgotButton.addEventListener("click",async()=>{
  clearMessage();
  const email=emailInput.value.trim();
  if(!email){showMessage("กรุณากรอกอีเมลก่อนเลือก “ลืมรหัสผ่าน?”");emailInput.focus();return}
  forgotButton.disabled=true;
  try{
    const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/member-login.html"});
    if(error)throw error;
    showMessage("ส่งลิงก์ตั้งรหัสผ่านใหม่ไปยังอีเมลแล้ว",true);
  }catch(e){showMessage(e.message||"ไม่สามารถส่งอีเมลรีเซ็ตรหัสผ่านได้")}
  finally{forgotButton.disabled=false}
});
loginForm.addEventListener("submit",async e=>{
  e.preventDefault();clearMessage();
  const email=emailInput.value.trim(),password=passwordInput.value;
  if(!email||!password){showMessage("กรุณากรอกอีเมลและรหัสผ่านให้ครบ");return}
  setLoading(true);
  try{
    const {data,error}=await db.auth.signInWithPassword({email,password});
    if(error)throw error;
    const user=data.user;
    const {data:profile,error:profileError}=await db.from("profiles").select("id,account_status,email").eq("id",user.id).maybeSingle();
    if(profileError)throw profileError;
    if(profile && String(profile.account_status||"ACTIVE").toUpperCase()!=="ACTIVE"){
      await db.auth.signOut();
      throw new Error("บัญชีสมาชิกนี้ยังไม่พร้อมใช้งาน กรุณาติดต่อ SANTE");
    }
    showMessage("เข้าสู่ระบบสำเร็จ กำลังเปิดหน้าสมาชิก...",true);
    setTimeout(()=>location.replace("member-home.html"),250);
  }catch(e){
    showMessage(e.message==="Invalid login credentials"?"อีเมลหรือรหัสผ่านไม่ถูกต้อง":(e.message||"เข้าสู่ระบบไม่สำเร็จ"));
    setLoading(false);
  }
});
(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(session?.user) location.replace("member-home.html");
})();
</script>
</body>
</html>
