<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ตรวจสอบวุฒิบัตร - SANTE Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f9fd;color:#112443;font-family:Prompt,sans-serif}.head{height:72px;background:#fff;border-bottom:1px solid #e5edf5;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100% - 1440px)/2))}.head img{width:105px;height:48px;object-fit:contain}.head a{color:#0b447f;text-decoration:none;font-size:12px;font-weight:600}.wrap{width:min(1320px,calc(100% - 28px));margin:28px auto 60px}.status{display:flex;align-items:center;gap:12px;padding:18px 20px;border:1px solid #cfe9dc;background:#effaf4;border-radius:17px;margin-bottom:18px}.status.bad{background:#fff1f2;border-color:#f2c9ce}.dot{width:14px;height:14px;border-radius:50%;background:#19a86b}.bad .dot{background:#d94b59}.status strong{display:block;font-size:18px}.status span{font-size:12px;color:#6f8199}.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.card{background:#fff;border:1px solid #dbe5ef;border-radius:20px;padding:18px;box-shadow:0 12px 34px rgba(20,48,83,.06)}.cert-stage-wrap{overflow:auto;background:#eef4fa;border-radius:16px;padding:12px}.cert-stage{position:relative;width:960px;height:664px;margin:auto;background:#fff;overflow:hidden}.cert-bg{position:absolute;inset:0;width:100%;height:100%}.item{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:pre-wrap;line-height:1.28;color:#172848;max-width:86%}.no{text-align:right;transform:translate(-100%,-50%)}.meta h2{margin:0 0 14px}.meta dl{margin:0}.meta dt{font-size:10px;color:#8090a5;margin-top:13px}.meta dd{margin:3px 0 0;font-size:13px;font-weight:600}.loading{text-align:center;padding:90px 20px;color:#71839b}.error{padding:30px;text-align:center;color:#c33}.footer{text-align:center;color:#8795a8;font-size:10px;margin-top:22px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.cert-stage{transform:scale(.66);transform-origin:top left;margin-bottom:-225px}.meta{order:-1}}
@media(max-width:520px){.head{padding:0 14px}.wrap{width:calc(100% - 18px);margin-top:14px}.cert-stage{transform:scale(.39);margin-bottom:-405px}.status{padding:14px}.status strong{font-size:16px}}
</style>
</head>
<body>
<header class="head"><img src="SANTE-logo.png" alt="SANTE"><a href="/">SANTE Consulting</a></header>
<main class="wrap">
 <div id="loading" class="card loading">กำลังตรวจสอบวุฒิบัตร...</div>
 <div id="app" style="display:none">
  <div id="status" class="status"><div class="dot"></div><div><strong id="statusTitle">เอกสารนี้ออกโดย SANTE Consulting</strong><span id="statusSub">ตรวจสอบจากระบบ SANTE</span></div></div>
  <div class="grid">
   <section class="card">
    <div class="cert-stage-wrap"><div class="cert-stage" id="stage">
      <img class="cert-bg" id="bg">
      <div class="item no" id="no"></div><div class="item" id="name"></div><div class="item" id="bodyTitle"></div><div class="item" id="course"></div><div class="item" id="body"></div><div class="item" id="duration"></div><div class="item" id="delivery"></div><div class="item" id="date"></div>
    </div></div>
   </section>
   <aside class="card meta"><h2>ข้อมูลวุฒิบัตร</h2><dl>
    <dt>เลขวุฒิบัตร</dt><dd id="mNo">-</dd><dt>ผู้รับ</dt><dd id="mName">-</dd><dt>องค์กร</dt><dd id="mOrg">-</dd><dt>หลักสูตร / งานบริการ</dt><dd id="mCourse">-</dd><dt>วันที่ออก</dt><dd id="mDate">-</dd><dt>สถานะ</dt><dd id="mStatus">-</dd>
   </dl></aside>
  </div>
  <div class="footer">© 2026 SANTE Consulting Co., Ltd. · Trust in Safety. Trust in SANTE.</div>
 </div>
</main>
<script>
const db=window.supabase.createClient("https://cyegjwerxlxhczrfiurz.supabase.co","sb_publishable_Hhr1LDrJqvzdEcHR4cScwA_YA9b9eYF");
const defaultLayouts={
 FREE_TRAINING:{bg:"cert-template-free.png",fields:{number:{x:95,y:2.8,size:14},name:{x:50,y:40,size:37},bodyTitle:{x:50,y:49,size:21},course:{x:50,y:56,size:25},body:{x:50,y:63,size:16},duration:{x:50,y:69,size:19},delivery:{x:50,y:74,size:18},date:{x:50,y:82,size:18}}},
 PAID_TRAINING:{bg:"cert-template-paid.png",fields:{number:{x:95,y:2.8,size:14},name:{x:50,y:42,size:42},bodyTitle:{x:50,y:53,size:22},course:{x:50,y:59,size:27},body:{x:50,y:65,size:16},duration:{x:50,y:70,size:19},delivery:{x:50,y:75,size:18},date:{x:50,y:82,size:18}}},
 SERVICE:{bg:"cert-template-service.png",fields:{number:{x:95,y:3,size:13},name:{x:50,y:34,size:29},bodyTitle:{x:50,y:43,size:18},course:{x:50,y:49,size:22},body:{x:50,y:56,size:17},duration:{x:50,y:64,size:16},delivery:{x:50,y:69,size:16},date:{x:50,y:75,size:17}}}
};
function thaiDate(v){if(!v)return"-";return new Intl.DateTimeFormat("th-TH",{day:"numeric",month:"long",year:"numeric"}).format(new Date(v+"T00:00:00"))}
function set(id,text,c){const e=document.getElementById(id);e.textContent=text||"";e.style.left=c.x+"%";e.style.top=c.y+"%";e.style.fontSize=c.size+"px";if(id==="name"||id==="course")e.style.fontWeight="700"}
async function init(){
 const token=new URLSearchParams(location.search).get("token");
 if(!token){document.getElementById("loading").innerHTML='<div class="error">ไม่พบรหัสตรวจสอบวุฒิบัตร</div>';return}
 const {data,error}=await db.rpc("get_certificate_public",{p_token:token});
 if(error||!data||!data.length){document.getElementById("loading").innerHTML='<div class="error">ไม่พบวุฒิบัตร หรือ QR นี้ไม่ถูกต้อง</div>';return}
 const c=data[0], type=c.template_code||"FREE_TRAINING", base=defaultLayouts[type]||defaultLayouts.FREE_TRAINING, d=c.design_json?.fields||base.fields;
 document.getElementById("bg").src=base.bg;
 set("no",c.certificate_no,d.number||base.fields.number);set("name",c.recipient_name,d.name||base.fields.name);set("bodyTitle",c.body_title,d.bodyTitle||base.fields.bodyTitle);set("course",c.course_name,d.course||base.fields.course);set("body",c.body_text,d.body||base.fields.body);set("duration",c.duration_text,d.duration||base.fields.duration);set("delivery",c.delivery_text,d.delivery||base.fields.delivery);set("date",c.issue_date?"ให้ไว้ ณ วันที่ "+thaiDate(c.issue_date):"",d.date||base.fields.date);
 document.getElementById("mNo").textContent=c.certificate_no;document.getElementById("mName").textContent=c.recipient_name||"-";document.getElementById("mOrg").textContent=c.recipient_organization||"-";document.getElementById("mCourse").textContent=c.course_name||"-";document.getElementById("mDate").textContent=thaiDate(c.issue_date);document.getElementById("mStatus").textContent=c.certificate_status;
 if(c.certificate_status!=="ISSUED"){document.getElementById("status").classList.add("bad");document.getElementById("statusTitle").textContent="เอกสารนี้ไม่อยู่ในสถานะใช้งาน";document.getElementById("statusSub").textContent="กรุณาติดต่อ SANTE Consulting เพื่อตรวจสอบ"}
 document.getElementById("loading").style.display="none";document.getElementById("app").style.display="block"
}
init();
</script>
</body></html>
