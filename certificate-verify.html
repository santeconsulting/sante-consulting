<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ตรวจสอบวุฒิบัตร | SANTE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Prompt,sans-serif;background:#f3f7fb;color:#102442}
header{height:82px;background:#fff;border-bottom:1px solid #dfe7ef;display:flex;align-items:center;justify-content:space-between;padding:0 6vw}
header img{width:76px;height:56px;object-fit:contain}.wrap{max-width:1420px;margin:28px auto;padding:0 22px}
.card{background:#fff;border:1px solid #dae5ef;border-radius:22px;padding:20px;box-shadow:0 14px 40px rgba(17,51,85,.06)}
.status{padding:14px 18px;border-radius:14px;margin-bottom:18px;background:#ecfaf2;color:#146c43}.status.bad{background:#fff0f1;color:#9e2a34}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}.stage-wrap{overflow:auto;background:#eef4fa;border-radius:16px;padding:14px}
.stage{position:relative;width:1200px;aspect-ratio:1200/848;margin:auto;background:#fff;overflow:hidden}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.item{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;white-space:pre-wrap;overflow:hidden;z-index:5}
.issuer-logo{position:absolute;transform:translate(-50%,-50%);z-index:7;object-fit:contain}
.sig{position:absolute;transform:translate(-50%,-50%);z-index:8;text-align:center;color:#172848;width:34%}.sig img{height:60px;max-width:55%;object-fit:contain}.sig .n{font-weight:600;font-size:18px}.sig .p,.sig .o{font-size:14px;white-space:pre-line}
.qr{position:absolute;transform:translate(-50%,-50%);z-index:9;background:white;padding:4px}.qr-label{position:absolute;transform:translate(-50%,-50%);z-index:9;background:#0b447f;color:#fff;border-radius:999px;font-size:8px;padding:3px 7px}
.info h2{margin-top:0}.info dl{display:grid;grid-template-columns:1fr;gap:4px}.info dt{font-size:11px;color:#7d8fa5;margin-top:10px}.info dd{margin:0;font-weight:600}
.revoked-stage .bg,.revoked-stage .item,.revoked-stage .issuer-logo,.revoked-stage .sig,.revoked-stage .qr,.revoked-stage .qr-label{filter:grayscale(1);opacity:.36}
.watermark{display:none;position:absolute;inset:0;z-index:99;align-items:center;justify-content:center;pointer-events:none}.watermark.show{display:flex}.watermark span{transform:rotate(-22deg);padding:20px 42px;border:8px solid rgba(158,42,52,.62);background:rgba(255,255,255,.9);border-radius:14px;color:rgba(158,42,52,.78);font-size:46px;font-weight:800}
.deleted{padding:70px 25px;text-align:center}.deleted h2{color:#9e2a34}
@media(max-width:950px){.grid{grid-template-columns:1fr}.stage{width:100%;min-width:760px}}
</style>
</head>
<body>
<header><img src="SANTE-logo.png" alt="SANTE"><strong>SANTE Consulting</strong></header>
<div class="wrap">
  <div class="card" id="loading">กำลังตรวจสอบวุฒิบัตร...</div>
  <div id="app" style="display:none">
    <div class="status" id="status"><strong id="statusTitle"></strong><div id="statusSub"></div></div>
    <div class="grid">
      <div class="stage-wrap"><div class="stage" id="stage">
        <img class="bg" id="bg">
        <img class="issuer-logo" id="issuerLogo">
        <div class="item" id="issuer"></div><div class="item" id="no"></div><div class="item" id="name"></div>
        <div class="item" id="bodyTitle"></div><div class="item" id="course"></div><div class="item" id="body"></div>
        <div class="item" id="trainingFor"></div><div class="item" id="trainingHeld"></div><div class="item" id="trainingExtra"></div>
        <div class="item" id="duration"></div><div class="item" id="delivery"></div><div class="item" id="date"></div>
        <div class="sig" id="sig1"><img id="sigImg1"><div class="n" id="sigName1"></div><div class="p" id="sigPos1"></div><div class="o" id="sigOrg1"></div></div>
        <div class="sig" id="sig2"><img id="sigImg2"><div class="n" id="sigName2"></div><div class="p" id="sigPos2"></div><div class="o" id="sigOrg2"></div></div>
        <div class="qr" id="verifyQr"></div><div class="qr-label" id="verifyQrLabel">SCAN TO VERIFY</div>
        <div class="watermark" id="watermark"><span>วุฒิบัตรนี้ถูกยกเลิกแล้ว</span></div>
      </div></div>
      <aside class="info"><h2>ข้อมูลวุฒิบัตร</h2><dl>
        <dt>เลขวุฒิบัตร</dt><dd id="mNo">-</dd><dt>ผู้รับ</dt><dd id="mName">-</dd>
        <dt>องค์กร</dt><dd id="mOrg">-</dd><dt>หลักสูตร / งานบริการ</dt><dd id="mCourse">-</dd>
        <dt>วันที่อบรม / ให้บริการ</dt><dd id="mTrainingDate">-</dd><dt>วันที่ออก</dt><dd id="mIssueDate">-</dd>
        <dt>ผู้ออกวุฒิบัตร</dt><dd id="mIssuer">-</dd><dt>สถานะ</dt><dd id="mStatus">-</dd>
        <dt id="reasonLabel" style="display:none">เหตุผลการยกเลิก</dt><dd id="mReason" style="display:none">-</dd>
      </dl></aside>
    </div>
  </div>
</div>
<script>
const SUPABASE_URL="https://cyegjwerxlxhczrfiurz.supabase.co";
const SUPABASE_KEY="sb_publishable_Hhr1LDrJqvzdEcHR4cScwA_YA9b9eYF";
const defaults={
 FREE_TRAINING:{bg:"certificate-free.png",fields:{
 issuer:{x:50,y:21,size:26,color:"#172848",width:70,height:8,align:"center"},
 number:{x:94,y:3,size:13,color:"#172848",width:24,height:5,align:"right"},
 name:{x:50,y:40,size:34,color:"#172848",width:72,height:9,align:"center"},
 bodyTitle:{x:50,y:51,size:18,color:"#172848",width:70,height:6,align:"center"},
 course:{x:50,y:58,size:23,color:"#172848",width:82,height:15,align:"center"},
 body:{x:50,y:62,size:14,color:"#172848",width:86,height:10,align:"center"},
 trainingFor:{x:50,y:66,size:14,color:"#172848",width:86,height:5,align:"center"},
 trainingHeld:{x:50,y:70,size:14,color:"#172848",width:86,height:5,align:"center"},
 trainingExtra:{x:50,y:74,size:14,color:"#172848",width:80,height:5,align:"center"},
 duration:{x:50,y:70,size:16,color:"#172848",width:72,height:6,align:"center"},
 delivery:{x:50,y:75,size:16,color:"#172848",width:66,height:5,align:"center"},
 date:{x:50,y:79,size:16,color:"#172848",width:68,height:6,align:"center"}},qr:{x:91,y:16}},
 PAID_TRAINING:{bg:"certificate-pay.png",fields:{}},
 SERVICE:{bg:"certificate-service.png",fields:{}}
};
defaults.PAID_TRAINING.fields=JSON.parse(JSON.stringify(defaults.FREE_TRAINING.fields));
defaults.SERVICE.fields=JSON.parse(JSON.stringify(defaults.FREE_TRAINING.fields));
function thaiDate(v){if(!v)return"-";try{return new Intl.DateTimeFormat("th-TH",{day:"numeric",month:"long",year:"numeric"}).format(new Date(v+"T00:00:00"))}catch{return v}}
function setField(id,text,cfg){
 const e=document.getElementById(id);if(!e)return;
 cfg=cfg||{};e.textContent=text||"";e.style.left=(cfg.x??50)+"%";e.style.top=(cfg.y??50)+"%";
 e.style.width=(cfg.width??70)+"%";e.style.height=(cfg.height??6)+"%";e.style.fontSize=(cfg.size??16)+"px";
 e.style.color=cfg.color||"#172848";e.style.textAlign=cfg.align||"center";
 e.style.justifyContent=(cfg.align==="left"?"flex-start":cfg.align==="right"?"flex-end":"center");
 e.style.lineHeight=String(cfg.lineHeight||1.2)
}
function renderSignatory(i,state,count,type){
 const w=document.getElementById("sig"+i);if(!w)return;
 if(i>count){w.style.display="none";return} w.style.display="block";
 w.style.left=(count===1?50:(i===1?34:66))+"%";w.style.top=(type==="SERVICE"?82:86)+"%";
 const img=document.getElementById("sigImg"+i);img.style.display=state?.image?"inline-block":"none";if(state?.image)img.src=state.image;
 document.getElementById("sigName"+i).textContent=state?.name||"";
 document.getElementById("sigPos"+i).textContent=state?.position||"";
 const org=document.getElementById("sigOrg"+i);org.textContent=state?.organization||"";org.style.display=state?.showOrganization===false?"none":"block";
}
async function init(){
 const token=new URLSearchParams(location.search).get("token");
 if(!token){document.getElementById("loading").innerHTML='<div class="deleted"><h2>ไม่พบรหัสตรวจสอบวุฒิบัตร</h2></div>';return}
 let c=null;
 try{
  const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),10000);
  const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/get_certificate_public_v2",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY},body:JSON.stringify({p_token:token}),signal:ctl.signal});
  clearTimeout(timer);if(!r.ok)throw new Error(await r.text());c=await r.json();
 }catch(e){document.getElementById("loading").innerHTML='<div class="deleted"><h2>ไม่สามารถตรวจสอบวุฒิบัตรได้</h2><p>'+e.message+'</p></div>';return}
 if(!c){document.getElementById("loading").innerHTML='<div class="deleted"><h2>ไม่พบข้อมูลวุฒิบัตร</h2></div>';return}
 if(c.certificate_status==="DELETED"){
   document.getElementById("loading").innerHTML='<div class="deleted"><h2>วุฒิบัตรนี้ถูกลบออกจากระบบแล้ว</h2><p>เลขวุฒิบัตร '+(c.certificate_no||"-")+'</p></div>';return;
 }
 const type=c.template_code||"FREE_TRAINING",base=defaults[type]||defaults.FREE_TRAINING,j=c.design_json||{},fields=j.fields||base.fields;
 document.getElementById("bg").src=j.backgroundUrl||j.backgroundTemplate||base.bg;
 const logo=document.getElementById("issuerLogo"),lp=j.issuerLogo||{x:50,y:7.5,w:11};
 logo.style.display=j.showIssuerLogo===false||!j.issuerLogoData?"none":"block";if(j.issuerLogoData)logo.src=j.issuerLogoData;
 logo.style.left=(lp.x??50)+"%";logo.style.top=(lp.y??7.5)+"%";logo.style.width=(lp.w??11)+"%";
 setField("issuer",j.showIssuerName===false?"":(j.issuerName||""),fields.issuer);
 setField("no",c.certificate_no,fields.number);setField("name",c.recipient_name,fields.name);
 setField("bodyTitle",c.body_title,fields.bodyTitle);setField("course",c.course_name,fields.course);setField("body",c.body_text,fields.body);
 setField("trainingFor",j.trainingForText?("ฝึกอบรมให้กับ "+j.trainingForText):"",fields.trainingFor);
 setField("trainingHeld",j.trainingHeldText?("จัดฝึกอบรมวันที่ "+j.trainingHeldText):"",fields.trainingHeld);
 setField("trainingExtra",j.trainingExtraText||"",fields.trainingExtra);
 setField("duration",c.duration_text,fields.duration);setField("delivery",c.delivery_text,fields.delivery);
 setField("date",c.training_date?("ให้ไว้ ณ วันที่ "+c.training_date):(c.issue_date?("ให้ไว้ ณ วันที่ "+thaiDate(c.issue_date)):""),fields.date);
 const count=Number(j.signatureCount||0);renderSignatory(1,j.signatory1,count,type);renderSignatory(2,j.signatory2,count,type);
 const qp=j.qr||base.qr||{x:91,y:16},q=document.getElementById("verifyQr"),ql=document.getElementById("verifyQrLabel");
 q.style.left=qp.x+"%";q.style.top=qp.y+"%";ql.style.left=qp.x+"%";ql.style.top=(qp.y+6.3)+"%";
 new QRCode(q,{text:location.href,width:72,height:72,correctLevel:QRCode.CorrectLevel.M});
 document.getElementById("mNo").textContent=c.certificate_no||"-";document.getElementById("mName").textContent=c.recipient_name||"-";
 document.getElementById("mOrg").textContent=c.recipient_organization||"-";document.getElementById("mCourse").textContent=c.course_name||"-";
 document.getElementById("mTrainingDate").textContent=c.training_date||"-";document.getElementById("mIssueDate").textContent=thaiDate(c.issue_date);
 document.getElementById("mIssuer").textContent=j.issuerName||"-";document.getElementById("mStatus").textContent=c.certificate_status||"-";
 if(c.certificate_status==="REVOKED"){
   document.getElementById("stage").classList.add("revoked-stage");document.getElementById("watermark").classList.add("show");
   document.getElementById("status").classList.add("bad");document.getElementById("statusTitle").textContent="วุฒิบัตรฉบับนี้ถูกยกเลิกแล้ว";
   document.getElementById("statusSub").textContent=c.revoked_reason||"กรุณาติดต่อ SANTE Consulting เพื่อตรวจสอบ";
   document.getElementById("reasonLabel").style.display="block";document.getElementById("mReason").style.display="block";document.getElementById("mReason").textContent=c.revoked_reason||"-";
 }else{
   document.getElementById("statusTitle").textContent="วุฒิบัตรนี้ใช้งานได้";
   document.getElementById("statusSub").textContent="ข้อมูลตรงกับระบบ SANTE";
 }
 document.getElementById("loading").style.display="none";document.getElementById("app").style.display="block";
}
init();
</script>
</body></html>
