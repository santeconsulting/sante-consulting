<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>การชำระเงินและเอกสาร | SANTE Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;min-height:100%;overflow-x:hidden}
:root{--navy:#082d69;--yellow:#ffbf19;--blue:#087df0;--green:#188d49;--text:#082d69;--muted:#7084a4;--line:#d8e5f1;--bg:#eef7fc;--white:#fff}
body{font-family:"Prompt",sans-serif;color:var(--text);background:linear-gradient(180deg,#fff 0%,#f6fbff 45%,#eef7fc 100%);min-height:100vh}
button{font-family:"Prompt",sans-serif}a{text-decoration:none;color:inherit}
.topbar{width:100%;height:82px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:30px;padding:0 max(28px,calc((100vw - 1520px)/2));background:rgba(255,255,255,.97);border-bottom:1px solid #e7eef6;box-shadow:0 3px 16px rgba(11,45,103,.04)}
.brand{min-width:0;display:flex;align-items:center}.brand-logo{width:220px;height:68px;object-fit:contain;object-position:left center}
.member-area{display:flex;align-items:center;gap:18px}.member-copy{text-align:right}.member-name{max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px;font-weight:600}.member-email{max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#7184a3;font-size:13px}
.logout-button{min-height:44px;padding:0 18px;border:1px solid #d5e1ef;border-radius:11px;background:#fff;color:var(--navy);font-size:14px;font-weight:600;cursor:pointer}
.page{width:min(1520px,calc(100% - 80px));margin:0 auto;padding:34px 0 60px}
.desktop-hero{width:100%;overflow:hidden;border-radius:28px;background:#fff;box-shadow:0 8px 25px rgba(11,45,103,.07);padding:12px}
.desktop-hero img{display:block;width:100%;height:auto;border-radius:23px}
.mobile-hero{display:none}
.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:34px 8px 20px}
.heading-left{display:flex;align-items:center;gap:16px}.section-icon{width:54px;height:54px;border-radius:18px;background:#e5f2ff;color:#087df0;display:grid;place-items:center;font-size:25px}
.heading h1{font-size:30px;line-height:1.3}.heading p{margin-top:4px;color:var(--muted);font-size:14px}
.home-link{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border:1px solid #d5e1ef;border-radius:11px;background:#fff;font-size:13px;font-weight:600}
.list{display:grid;gap:14px}.payment-card{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:24px 28px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 25px rgba(11,45,103,.045)}
.payment-no{font-size:13px;color:var(--muted)}.payment-title{margin-top:5px;font-size:20px;font-weight:700}.payment-session{margin-top:3px;color:var(--muted);font-size:13px}
.payment-meta{display:flex;align-items:center;justify-content:flex-end;gap:18px}.amount{font-size:24px;font-weight:700;white-space:nowrap}.status{padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}.pending{background:#fff3cd;color:#896100}.verified{background:#e7f7ed;color:#147440}.failed{background:#ffeded;color:#a52d2d}
.detail-btn{min-height:42px;padding:0 15px;border:1px solid #d5e1ef;border-radius:11px;background:#fff;color:var(--navy);font-weight:600;cursor:pointer;white-space:nowrap}
.empty{padding:50px 25px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:20px;color:var(--muted)}
.loading{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:1024px){.page{width:calc(100% - 36px);padding-top:18px}.brand-logo{width:180px;height:62px}.payment-card{grid-template-columns:1fr}.payment-meta{justify-content:flex-start;flex-wrap:wrap}}
@media(max-width:767px){
.topbar{height:auto;min-height:64px;gap:8px;padding:7px 12px}.brand{flex:1 1 auto}.brand-logo{width:118px;height:50px}.member-area{flex:0 1 auto;gap:7px}.member-copy{display:none}.logout-button{min-height:38px;padding:0 10px;font-size:11px}
.page{width:100%;padding:10px 12px 35px}.desktop-hero{display:none}.mobile-hero{display:block;overflow:hidden;padding:23px 20px;border-radius:20px;background:linear-gradient(145deg,#eaf7ff 0%,#fff 58%,#fff4c9 100%);box-shadow:0 8px 25px rgba(11,45,103,.07)}
.mobile-hero .badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:#fff;color:#087df0;font-size:10px;font-weight:700}.mobile-hero h2{margin-top:12px;font-size:26px;line-height:1.3}.mobile-hero p{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.65}
.heading{margin:24px 4px 14px;align-items:flex-end}.section-icon{width:44px;height:44px;border-radius:14px}.heading h1{font-size:21px}.heading p{font-size:11px}.home-link{font-size:11px;padding:0 10px}
.payment-card{padding:18px;border-radius:17px}.payment-title{font-size:17px}.payment-meta{gap:10px}.amount{font-size:20px}.detail-btn{width:100%}
}
</style>
</head>
<body>
<header class="topbar">
 <a class="brand" href="member-home.html"><img src="sante%20(en)-logo.png" class="brand-logo" alt="SANTE Consulting"></a>
 <div class="member-area"><div class="member-copy"><div id="memberName" class="member-name">สมาชิก SANTE</div><div id="memberEmail" class="member-email"></div></div><button id="logoutButton" class="logout-button">ออกจากระบบ</button></div>
</header>
<main class="page">
 <section class="desktop-hero"><img src="sante-member-hero.png" alt="Trust in Safety. Trust in SANTE."></section>
 <section class="mobile-hero"><span class="badge">SANTE MEMBER</span><h2>การชำระเงิน<br>และเอกสารของคุณ</h2><p>ติดตามสถานะการชำระเงิน และกลับไปดำเนินการรายการที่ยังไม่เสร็จได้จากหน้านี้</p></section>
 <div class="heading">
  <div class="heading-left"><div class="section-icon">▣</div><div><h1>การชำระเงินและเอกสาร</h1><p>รายการชำระเงินทั้งหมดของบัญชีคุณ</p></div></div>
  <a class="home-link" href="member-home.html">← หน้าหลักสมาชิก</a>
 </div>
 <section id="paymentList" class="list"><div class="loading">กำลังโหลดรายการชำระเงิน...</div></section>
</main>
<script>
const SUPABASE_URL="https://cyegjwerxlxhczrfiurz.supabase.co";
const SUPABASE_KEY="sb_publishable_Hhr1LDrJqvzdEcHR4cScwA_YA9b9eYF";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:"sante-member-auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const list=document.getElementById("paymentList"),memberName=document.getElementById("memberName"),memberEmail=document.getElementById("memberEmail");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const money=v=>new Intl.NumberFormat("th-TH",{style:"currency",currency:"THB",minimumFractionDigits:2}).format(Number(v||0));
function statusInfo(v){const s=String(v||"PENDING").toUpperCase();if(s==="VERIFIED")return["verified","ชำระเงินแล้ว"];if(s==="FAILED")return["failed","ไม่สำเร็จ"];return["pending","รอชำระเงิน/ตรวจสอบ"]}
async function init(){
 const {data:{session}}=await db.auth.getSession();if(!session?.user){location.replace("member-login.html");return}
 const user=session.user;memberEmail.textContent=user.email||"";
 const {data:p}=await db.from("profiles").select("title_th,firstname_th,lastname_th,email").eq("id",user.id).maybeSingle();
 if(p){memberName.textContent=[p.title_th,p.firstname_th,p.lastname_th].filter(Boolean).join(" ")||"สมาชิก SANTE";memberEmail.textContent=p.email||user.email||""}
 const {data,error}=await db.rpc("get_my_payments");
 if(error){list.innerHTML='<div class="empty">ไม่สามารถโหลดรายการชำระเงินได้<br>'+esc(error.message)+'</div>';return}
 if(!data?.length){list.innerHTML='<div class="empty">ยังไม่มีรายการชำระเงินในบัญชีนี้</div>';return}
 list.innerHTML=data.map(x=>{const [cls,label]=statusInfo(x.payment_status);return `<article class="payment-card"><div><div class="payment-no">${esc(x.payment_no||"-")}</div><div class="payment-title">${esc(x.course_name_th||"รายการชำระเงิน")}</div><div class="payment-session">${esc(x.session_name||"")}</div></div><div class="payment-meta"><div class="amount">${money(x.amount)}</div><span class="status ${cls}">${label}</span><button class="detail-btn" onclick="openPayment('${esc(x.payment_id)}')">${String(x.payment_status||"").toUpperCase()==="VERIFIED"?"ดูรายละเอียด":"ดูรายละเอียด / ชำระเงิน"}</button></div></article>`}).join("");
}
function openPayment(id){sessionStorage.setItem("sante-pending-payment-id",id);location.href="payment.html?payment="+encodeURIComponent(id)}
document.getElementById("logoutButton").addEventListener("click",async()=>{await db.auth.signOut();location.replace("member-login.html")});
init();
</script>
</body>
</html>
