<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SANTE Member | ใบเสนอราคา</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Prompt,sans-serif;color:#082d69;background:linear-gradient(180deg,#fff,#f2f8fc)}
a{text-decoration:none;color:inherit}button,input,select,textarea{font-family:Prompt,sans-serif}
.topbar{height:82px;position:sticky;top:0;z-index:90;display:flex;align-items:center;justify-content:space-between;padding:0 max(28px,calc((100vw - 1480px)/2));background:rgba(255,255,255,.97);border-bottom:1px solid #e7eef6}
.brand-logo{width:220px;height:68px;object-fit:contain;object-position:left center}.member-area{display:flex;align-items:center;gap:16px}.member-copy{text-align:right}.member-name{font-weight:600}.member-email{font-size:12px;color:#7184a3}.logout{height:42px;padding:0 16px;border:1px solid #d5e1ef;border-radius:11px;background:#fff;color:#082d69;font-weight:600;cursor:pointer}

.section-title{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:18px;font-weight:700}.step{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ffbf19;color:#082d69;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}
label{display:block;font-size:11px;font-weight:600;margin:0 0 5px}.req{color:#c33232}
.input,.select,textarea{width:100%;border:1px solid #d5e1ec;border-radius:11px;padding:11px 12px;background:#fff;color:#082d69;font-size:13px;outline:none}.input:focus,.select:focus,textarea:focus{border-color:#77b7eb;box-shadow:0 0 0 3px rgba(8,125,240,.07)}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.type-card{border:2px solid #e0e9f2;border-radius:16px;padding:17px;background:#fff;cursor:pointer}.type-card.active{border-color:#ffbf19;background:#fff9e8}.type-card strong{display:block;font-size:16px}.type-card span{display:block;margin-top:4px;color:#7184a3;font-size:11px}
.dynamic{display:none}.dynamic.show{display:block}.hint{font-size:10px;color:#72869b;line-height:1.55}.checkrow{display:grid;grid-template-columns:minmax(220px,1fr) 150px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed #e3ebf2}.checkrow:last-child{border-bottom:0}.checkname{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
.area-list{grid-column:1/-1;padding-left:26px}.area-row{display:grid;grid-template-columns:150px 1fr;gap:10px;margin-top:8px;align-items:center}.filebox{border:1px dashed #abc7de;border-radius:14px;padding:16px;background:#f8fbfe}
.actions{display:flex;justify-content:flex-end;gap:10px}.btn{min-height:44px;border:0;border-radius:11px;padding:0 18px;font-size:13px;font-weight:600;cursor:pointer}.primary{background:#0b4f88;color:#fff}.yellow{background:#ffbf19;color:#082d69}.light{background:#fff;border:1px solid #d5e1ec;color:#082d69}
.notice{padding:12px 14px;border-radius:11px;background:#eef8f1;color:#237447;font-size:12px;display:none}.error{background:#fff0f0;color:#a52d2d}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;z-index:999;color:#082d69}
@media(max-width:800px){.topbar{height:64px;padding:6px 12px}.brand-logo{width:120px;height:48px}.member-copy{display:none}.page{width:100%;padding:12px 12px 40px}.grid,.grid3,.type-grid{grid-template-columns:1fr}.page-title h1{font-size:23px}.panel{padding:16px;border-radius:16px}.checkrow{grid-template-columns:1fr}.area-row{grid-template-columns:1fr}.actions{flex-direction:column}.btn{width:100%}}

.paper{background:#fff;border:1px solid #dce7f2;border-radius:20px;padding:25px}.headrow{display:flex;justify-content:space-between;border-bottom:2px solid #8c80ee;padding-bottom:15px}.doc-title{font-size:30px;color:#796de8;font-weight:700}.party{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0}.box{background:#f8fbfe;border-radius:12px;padding:14px}table{width:100%;border-collapse:collapse}th{background:#efedff;text-align:left;padding:10px;font-size:11px}td{padding:10px;border-bottom:1px solid #e7edf3;font-size:11px}.sum{width:min(430px,100%);margin:18px 0 0 auto}.sumrow{display:flex;justify-content:space-between;padding:5px}.grand{font-weight:700;font-size:15px;background:#efedff;border-radius:10px;padding:10px}.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center;border-top:1px solid #ddd;margin-top:20px;padding-top:18px}.sign img{height:70px;max-width:140px;object-fit:contain}@media(max-width:800px){.party,.sign{grid-template-columns:1fr}.paper{padding:15px;overflow:auto}table{min-width:720px}}@media print{.topbar,.actions,.crumbs,.page-title{display:none}.page{width:100%;padding:0}.paper{border:0;box-shadow:none;border-radius:0}}

/* R4 canonical member shell */
.member-shell-hero{width:min(1480px,calc(100% - 48px));margin:22px auto 0;overflow:hidden;border-radius:28px;background:#fff;box-shadow:0 10px 30px rgba(11,45,103,.07)}
.member-shell-hero img{display:block;width:100%;height:auto}
@media(max-width:767px){.member-shell-hero{width:calc(100% - 24px);margin-top:10px;border-radius:18px}}
/* R4 readable typography */
.page{font-size:16px}.page-title h1{font-size:34px}.page-title p{font-size:15px}
label{font-size:14px}.input,.select,textarea{font-size:15px;padding:13px 14px}.hint{font-size:12px}.type-card strong{font-size:19px}.type-card span{font-size:13px}.section-title{font-size:21px}.btn{font-size:14px}
@media(max-width:767px){.page{font-size:15px}.page-title h1{font-size:26px}.page-title p{font-size:13px}label{font-size:13px}.input,.select,textarea{font-size:14px}.section-title{font-size:18px}.btn{font-size:13px}}
</style></head><body><div id="loading" class="loading">กำลังโหลดใบเสนอราคา...</div>
<header class="topbar"><a href="member-home.html"><img class="brand-logo" src="sante%20(en)-logo.png"></a><div class="member-area"><button class="logout" onclick="location='member-service-requests.html'">คำขอของฉัน</button><button id="logout" class="logout">ออกจากระบบ</button></div></header><section class="member-shell-hero"><img src="sante-member-hero.png" alt="Trust in Safety. Trust in SANTE."></section>
<main class="page"><div class="crumbs"><a href="member-home.html">หน้าหลักสมาชิก</a> › <a href="member-service-requests.html">คำขอของฉัน</a> › ใบเสนอราคา</div><div class="page-title"><h1>ใบเสนอราคา</h1><p>ตรวจสอบรายละเอียดก่อนอนุมัติราคา</p></div>
<div id="paper" class="paper"></div><div id="msg" class="notice"></div><div class="actions" style="margin-top:15px"><button class="btn light" onclick="print()">พิมพ์ / PDF</button><button id="approveBtn" class="btn yellow" onclick="approve()">อนุมัติใบเสนอราคา</button></div></main>
<script>
const db=window.supabase.createClient("https://cyegjwerxlxhczrfiurz.supabase.co","sb_publishable_Hhr1LDrJqvzdEcHR4cScwA_YA9b9eYF",{auth:{storageKey:"sante-member-auth",persistSession:true,autoRefreshToken:true}});const id=new URLSearchParams(location.search).get("id");let q=null;const money=v=>Number(v||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function init(){const s=await db.auth.getSession();if(!s.data.session){location="member-login.html";return}if(!id){alert("ไม่พบใบเสนอราคา");return}const [qr,ir]=await Promise.all([db.from("quotations").select("*").eq("id",id).single(),db.from("quotation_items").select("*").eq("quotation_id",id).order("sort_order")]);if(qr.error){alert(qr.error.message);return}q=qr.data;paper.innerHTML=`<div class="headrow"><div><img src="SANTE-logo-primary.png" style="width:120px"><div style="font-size:11px">บริษัท ซานเต้ คอนซัลติ้ง จำกัด (สำนักงานใหญ่)<br>49 ถนนทางหลวงสาย 3191 ตำบลมาบข่า อำเภอนิคมพัฒนา จังหวัดระยอง 21180<br>เลขประจำตัวผู้เสียภาษี 0215566009041 · 083 4874542</div></div><div style="text-align:right"><div class="doc-title">ใบเสนอราคา</div><b>${esc(q.quotation_no)}</b><div>วันที่ออก: ${q.issue_date||"-"}</div><div>ใช้ได้ถึง: ${q.valid_until||"-"}</div><div>Rev.${q.revision_no||0}</div></div></div><div class="party"><div class="box"><b>ลูกค้า</b><div>${esc(q.organization_name||q.customer_name||"-")}</div><div>${esc(q.billing_address||"")}</div><div>เลขที่ภาษี: ${esc(q.customer_tax_id||"-")} ${esc(q.customer_branch||"")}</div></div><div class="box"><b>ติดต่อกลับที่</b><div>${esc(q.customer_name||"-")}</div><div>${esc(q.phone||"-")}</div><div>${esc(q.email||"-")}</div></div></div><table><thead><tr><th>รายการ</th><th>จำนวน</th><th>หน่วย</th><th>ราคา/หน่วย</th><th>ส่วนลด</th><th>รวม</th></tr></thead><tbody>${(ir.data||[]).map((x,i)=>`<tr><td>${i+1}. ${esc(x.description).replaceAll("\n","<br>")}</td><td>${money(x.quantity)}</td><td>${esc(x.unit||"")}</td><td>${money(x.unit_price)}</td><td>${money(x.discount_amount)}</td><td>${money(x.line_total)}</td></tr>`).join("")}</tbody></table><div class="sum"><div class="sumrow"><span>มูลค่าหลังส่วนลด</span><span>${money(q.subtotal)} บาท</span></div><div class="sumrow"><span>VAT ${q.vat_rate||7}%</span><span>${money(q.vat_amount)} บาท</span></div><div class="sumrow grand"><span>ยอดรวมทั้งสิ้น</span><span>${money(q.grand_total)} บาท</span></div><div class="sumrow"><span>หัก ณ ที่จ่าย ${q.wht_rate||0}%</span><span>${money(q.wht_amount)} บาท</span></div><div class="sumrow"><b>ยอดชำระสุทธิ</b><b>${money(q.net_receivable)} บาท</b></div></div><div class="box" style="margin-top:18px"><b>เงื่อนไข</b><div>${esc(q.terms||"ใบเสนอราคามีอายุ 60 วัน และเครดิตเทอม 30 วัน หลังการให้บริการ")}</div><div style="margin-top:6px"><b>ชำระเงิน:</b> ธนาคารกสิกรไทย บจก.ซานเต้ คอนซัลติ้ง เลขบัญชี 165-8-69303-0</div></div><div class="sign"><div><img src="sante-signature-director.png"><div><b>วลีภรณ์ หาญนภาชีวิน</b><br>ผู้ออกเอกสาร (ผู้ขาย)</div></div><div><img src="sante-signature-director.png"><div><b>วลีภรณ์ หาญนภาชีวิน</b><br>ผู้อนุมัติเอกสาร (ผู้ขาย)</div></div><div><img src="sante-company-stamp.png"><div>ตราประทับ (ผู้ขาย)</div></div></div>`;approveBtn.style.display=q.status==="SENT"?"inline-block":"none";loading.style.display="none"}
async function approve(){if(!confirm("ยืนยันอนุมัติใบเสนอราคานี้?"))return;const r=await db.rpc("member_approve_quotation",{p_quotation_id:id});if(r.error){alert(r.error.message);return}msg.style.display="block";msg.textContent="อนุมัติใบเสนอราคาเรียบร้อยแล้ว";approveBtn.style.display="none"}
logout.onclick=async()=>{await db.auth.signOut();location="member-login.html"};init();
</script></body></html>
