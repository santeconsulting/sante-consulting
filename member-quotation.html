<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SANTE | ใบเสนอราคา</title><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Prompt,sans-serif;background:#f3f7fb;color:#102442}.top{height:76px;background:#fff;border-bottom:1px solid #dce6f0;display:flex;align-items:center;justify-content:space-between;padding:0 6vw}.top img{width:78px}.wrap{max-width:960px;margin:28px auto;padding:0 18px}.paper{background:#fff;border:1px solid #dce6f0;border-radius:20px;padding:28px;box-shadow:0 12px 30px rgba(8,45,105,.06)}.head{display:flex;justify-content:space-between;gap:18px;border-bottom:2px solid #082d69;padding-bottom:18px}.head h1{margin:0;color:#082d69}.muted{color:#72869b;font-size:11px}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:#eaf4ff;color:#0b568e;font-size:10px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}.box{background:#f8fbfe;border-radius:12px;padding:14px}.table{width:100%;border-collapse:collapse;margin-top:16px}.table th{background:#082d69;color:#fff;text-align:left;padding:10px;font-size:11px}.table td{padding:10px;border-bottom:1px solid #e5edf4;font-size:11px}.sum{width:min(420px,100%);margin:18px 0 0 auto}.row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px}.grand{font-size:16px;font-weight:700;color:#082d69;border-top:1px solid #dce6f0;margin-top:6px;padding-top:10px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.btn{border:0;border-radius:11px;padding:12px 18px;font:600 12px Prompt;cursor:pointer}.primary{background:#0b4f88;color:#fff}.yellow{background:#ffc83d;color:#102442}.light{background:#fff;border:1px solid #dce6f0}.msg{margin-top:16px;padding:12px;border-radius:10px;background:#edf9f1;color:#28794b;display:none}@media(max-width:700px){.head,.grid{grid-template-columns:1fr;display:grid}.paper{padding:18px}.actions{flex-direction:column}.btn{width:100%}}@media print{.top,.actions{display:none}.wrap{margin:0;max-width:none;padding:0}.paper{border:0;box-shadow:none;border-radius:0}}</style></head><body><header class="top"><img src="SANTE-logo.png"><a href="member-home.html">กลับหน้าสมาชิก</a></header><main class="wrap"><div class="paper" id="paper"><div class="head"><div><div class="muted">SANTE CONSULTING CO., LTD.</div><h1>ใบเสนอราคา</h1><div id="qno"></div></div><div><span id="status" class="badge"></span></div></div><div class="grid"><div class="box"><strong>ลูกค้า</strong><div id="customer"></div><div id="org" class="muted"></div><div id="contact" class="muted"></div></div><div class="box"><strong>ข้อมูลเอกสาร</strong><div>วันที่ออก: <span id="issue"></span></div><div>ใช้ได้ถึง: <span id="valid"></span></div></div></div><table class="table"><thead><tr><th>รายการ</th><th>จำนวน</th><th>หน่วย</th><th>ราคา/หน่วย</th><th>รวม</th></tr></thead><tbody id="items"></tbody></table><div class="sum"><div class="row"><span>รวมก่อน VAT</span><span id="subtotal"></span></div><div class="row"><span>VAT</span><span id="vat"></span></div><div class="row grand"><span>ยอดรวม</span><span id="grand"></span></div><div class="row"><span>หัก ณ ที่จ่าย</span><span id="wht"></span></div><div class="row grand"><span>ยอดรับสุทธิ</span><span id="net"></span></div></div><div class="box" style="margin-top:18px"><strong>หมายเหตุ / เงื่อนไข</strong><div id="note" class="muted" style="white-space:pre-wrap"></div><div id="terms" class="muted" style="white-space:pre-wrap;margin-top:8px"></div></div><div id="msg" class="msg"></div><div class="actions"><button class="btn light" onclick="print()">พิมพ์ / PDF</button><button id="approveBtn" class="btn yellow" onclick="approve()">อนุมัติใบเสนอราคา</button></div></div></main><script>const db=window.supabase.createClient('https://cyegjwerxlxhczrfiurz.supabase.co','sb_publishable_Hhr1LDrJqvzdEcHR4cScwA_YA9b9eYF',{auth:{storageKey:'sante-member-auth',persistSession:true,autoRefreshToken:true}});let id=new URLSearchParams(location.search).get('id'),q=null;const $=x=>document.getElementById(x),money=v=>Number(v||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location='member-login.html';return}if(!id){alert('ไม่พบเลขอ้างอิงใบเสนอราคา');return}const qr=await db.from('quotations').select('*').eq('id',id).single();if(qr.error){alert(qr.error.message);return}q=qr.data;const ir=await db.from('quotation_items').select('*').eq('quotation_id',id).order('sort_order');qno.textContent=q.quotation_no+' · Rev.'+(q.revision_no||0);status.textContent=q.status;customer.textContent=q.customer_name||'-';org.textContent=q.organization_name||'';contact.textContent=[q.email,q.phone].filter(Boolean).join(' · ');issue.textContent=q.issue_date||'-';valid.textContent=q.valid_until||'-';items.innerHTML=(ir.data||[]).map(x=>`<tr><td>${x.description}</td><td>${x.quantity}</td><td>${x.unit||''}</td><td>${money(x.unit_price)}</td><td>${money(x.line_total)}</td></tr>`).join('');subtotal.textContent=money(q.subtotal);vat.textContent=money(q.vat_amount);grand.textContent=money(q.grand_total);wht.textContent=money(q.wht_amount);net.textContent=money(q.net_receivable);note.textContent=q.note||'';terms.textContent=q.terms||'';approveBtn.style.display=q.status==='SENT'?'inline-block':'none'}async function approve(){if(!confirm('ยืนยันอนุมัติใบเสนอราคานี้?'))return;const {error}=await db.rpc('member_approve_quotation',{p_quotation_id:id});if(error){alert(error.message);return}msg.style.display='block';msg.textContent='อนุมัติใบเสนอราคาเรียบร้อยแล้ว';approveBtn.style.display='none';status.textContent='APPROVED'}init();</script></body></html>
