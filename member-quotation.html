/* =========================================================

:root{

}

async function init(){
  try{
    const s=await db.auth.getSession();
    if(!s.data.session){location="member-login.html";return}
    const u=s.data.session.user;
    memberEmail.textContent=u.email||"";
    const pr=await db.from("profiles").select("title_th,firstname_th,lastname_th,email").eq("id",u.id).maybeSingle();
    if(pr.data){
      memberName.textContent=[pr.data.title_th,pr.data.firstname_th,pr.data.lastname_th].filter(Boolean).join(" ")||"สมาชิก SANTE";
      memberEmail.textContent=pr.data.email||u.email||"";
    }
    if(!id){alert("ไม่พบใบเสนอราคา");location="member-quotations.html";return}
    const [qr,ir]=await Promise.all([
      db.from("quotations").select("*").eq("id",id).eq("member_id",u.id).single(),
      db.from("quotation_items").select("*").eq("quotation_id",id).order("sort_order")
    ]);
    if(qr.error)throw qr.error;
    q=qr.data; items=ir.data||[];

    // Admin quotation displays the human-readable service request number,
    // never the internal UUID.
    requestNo="-";
    if(q.service_request_id){
      const rr=await db
        .from("service_requests")
        .select("request_no")
        .eq("id",q.service_request_id)
        .maybeSingle();
      if(!rr.error && rr.data?.request_no)requestNo=rr.data.request_no;
    }

    renderPaper();
    approveBtn.style.display=q.status==="SENT"?"inline-flex":"none";
    if(q.status==="APPROVED"){
      msg.style.display="block";
      msg.textContent="ใบเสนอราคานี้ได้รับการอนุมัติแล้ว";
    }
  }catch(e){
    console.error(e);
    alert("ไม่สามารถโหลดใบเสนอราคาได้: "+(e.message||e));
  }finally{
    loading.style.display="none";
  }
}
async function approve(){
  if(!q||q.status!=="SENT")return;
  if(!confirm("ยืนยันอนุมัติใบเสนอราคานี้?\nเมื่ออนุมัติแล้ว ระบบจะเตรียมใบแจ้งหนี้ให้อัตโนมัติ"))return;

  approveBtn.disabled=true;
  const originalText=approveBtn.textContent;
  approveBtn.textContent="กำลังอนุมัติ...";

  try{
    const r=await db.rpc("member_approve_quotation_and_create_invoice",{
      p_quotation_id:id
    });
    if(r.error)throw r.error;

    const result=Array.isArray(r.data)?r.data[0]:r.data;
    q.status="APPROVED";

    msg.style.display="block";
    msg.classList.remove("error");

    if(result?.invoice_no){
      msg.innerHTML=
        `อนุมัติใบเสนอราคาเรียบร้อยแล้ว<br>`+
        `ระบบเตรียมใบแจ้งหนี้ <b>${esc(result.invoice_no)}</b> แล้ว `+
        `(สถานะ ${esc(result.invoice_status||"READY_TO_ISSUE")})`;
    }else if(result?.warning){
      msg.textContent="อนุมัติใบเสนอราคาแล้ว แต่ยังไม่ได้สร้างใบแจ้งหนี้: "+result.warning;
    }else{
      msg.textContent="อนุมัติใบเสนอราคาเรียบร้อยแล้ว";
    }

    approveBtn.style.display="none";
  }catch(e){
    console.error(e);
    msg.style.display="block";
    msg.classList.add("error");
    msg.textContent="ไม่สามารถอนุมัติใบเสนอราคาได้: "+(e.message||e);
  }finally{
    approveBtn.disabled=false;
    approveBtn.textContent=originalText;
  }
}
function safeQuotationFilename(v){return String(v||"QUOTATION").trim().replace(/[^A-Za-z0-9_-]/g,"_")||"QUOTATION"}
async function printQuotation(){
  const source=document.getElementById("paper");
  if(!source)return alert("ไม่พบเอกสาร");
  const iframe=document.createElement("iframe");
  iframe.setAttribute("aria-hidden","true");
  Object.assign(iframe.style,{position:"fixed",right:"0",bottom:"0",width:"0",height:"0",border:"0"});
  document.body.appendChild(iframe);
  const doc=iframe.contentDocument||iframe.contentWindow.document;
  const styleMarkup=[...document.querySelectorAll("style")].map(s=>s.outerHTML).join("\n");
  const fontLinks=[...document.querySelectorAll('link[rel="stylesheet"]')].map(l=>l.outerHTML).join("\n");
  doc.open();
  const quotationCode=safeQuotationFilename(q?.quotation_no||"QUOTATION");
  doc.write(`<!doctype html><html lang="th"><head><meta charset="utf-8"><title>${quotationCode}</title>${fontLinks}${styleMarkup}
  <style>
    html,body{margin:0!important;padding:0!important;width:210mm!important;height:297mm!important;background:#fff!important;overflow:hidden!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
    #paper{display:block!important;margin:0!important;box-shadow:none!important;border:0!important;width:210mm!important;height:297mm!important;min-height:297mm!important;max-height:297mm!important;overflow:hidden!important}
    .ref-summary,.ref-payment,.ref-note,.ref-cert{break-inside:avoid!important;page-break-inside:avoid!important}
    @page{size:A4 portrait;margin:0}
  </style></head><body>${source.outerHTML}</body></html>`);
  doc.close();
  try{
    if(doc.fonts?.ready)await doc.fonts.ready;
    await Promise.all([...doc.images].map(img=>img.complete?Promise.resolve():new Promise(resolve=>{
      img.addEventListener("load",resolve,{once:true});img.addEventListener("error",resolve,{once:true});setTimeout(resolve,2500);
    })));
    await new Promise(r=>setTimeout(r,120));
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
  }finally{
    setTimeout(()=>iframe.remove(),1200);
  }
}
logout.onclick=async()=>{await db.auth.signOut();location="member-login.html"};
init();
