function money(v){return new Intl.NumberFormat("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v||0))}
function rateText(v){const n=Number(v||0);return Number.isFinite(n)?String(Number(n.toFixed(4))):"0";}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function thaiIntegerText(n){
 n=Math.floor(Math.abs(Number(n)||0));
 if(n===0)return "ศูนย์";
 const digits=["","หนึ่ง","สอง","สาม","สี่","ห้า","หก","เจ็ด","แปด","เก้า"];
 const pos=["","สิบ","ร้อย","พัน","หมื่น","แสน"];
 function underMillion(num){
  const s=String(num);let out="";
  for(let i=0;i<s.length;i++){
   const d=Number(s[i]),p=s.length-i-1;if(!d)continue;
   if(p===1){if(d===1)out+="สิบ";else if(d===2)out+="ยี่สิบ";else out+=digits[d]+"สิบ";}
   else if(p===0){if(d===1&&out)out+="เอ็ด";else out+=digits[d];}
   else out+=digits[d]+pos[p];
  }
  return out;
 }
 if(n>=1000000){const high=Math.floor(n/1000000),low=n%1000000;return thaiIntegerText(high)+"ล้าน"+underMillion(low)}
 return underMillion(n);
}
function thaiBahtText(value){
 const num=Math.round((Number(value)||0)*100)/100;
 const baht=Math.floor(num),satang=Math.round((num-baht)*100);
 let result=thaiIntegerText(baht)+"บาท";
 result+=satang===0?"ถ้วน":thaiIntegerText(satang)+"สตางค์";
 return result;
}
function formatDocumentDate(v){
 const s=String(v||"").trim();
 const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
 return m?`${m[3]}/${m[2]}/${m[1]}`:s;
}
function typeLabel(t){return ({QUOTATION:"ใบเสนอราคา",INVOICE:"ใบแจ้งหนี้",RECEIPT_TAX_INVOICE:"ใบเสร็จ/ใบกำกับภาษี",CREDIT_NOTE:"ใบลดหนี้"})[t]||t}
function refText(x){return x.quotation_no||x.payment_no||"-"}
function accountingCopyLabel(){return "(ต้นฉบับ)";}
function paperHtml(x){
 const items=Array.isArray(x.items)?x.items:[];
 const rows=items.length?items.map((i,n)=>{
   const imageUrl=i.image_url||i.imageUrl||i.thumbnail_url||i.thumbnailUrl||"";
   const title=i.description||i.name||x.document_subject||"";
   const sub=i.detail||i.details||i.description2||i.remark||"";
   const code=i.code||i.product_code||i.sku||"";
   const thumb=imageUrl?`<img class="item-thumb" src="${esc(imageUrl)}" crossorigin="anonymous">`:"";
   return `<tr>
     <td class="desc-col">${thumb}<span class="item-no">${n+1}.</span><div class="item-main">${esc(title)}</div>${code?`<div class="item-code">(${esc(code)})</div>`:""}${sub&&sub!==title?`<div class="item-sub">${esc(sub)}</div>`:""}</td>
     <td class="qty-col">${money(i.quantity||1)}</td>
     <td class="unit-col">${esc(i.unit||"งาน")}</td>
     <td class="price-col money-cell">${money(i.unit_price)}</td>
     <td class="disc-col money-cell">${money(i.discount_amount)}</td>
     <td class="vat-col money-cell">${rateText(i.vat_rate??x.vat_rate??7)}%</td>
     <td class="amount-col money-cell">${money(i.line_total)}</td>
   </tr>`;
 }).join(""):`<tr>
   <td class="desc-col"><span class="item-no">1.</span><div class="item-main">${esc(x.document_subject||"ค่าบริการ / ค่าอบรม SANTE")}</div></td>
   <td class="qty-col">1.00</td><td class="unit-col">งาน</td>
   <td class="price-col money-cell">${money(x.subtotal)}</td><td class="disc-col money-cell">0.00</td>
   <td class="vat-col money-cell">${rateText(x.vat_rate??7)}%</td><td class="amount-col money-cell">${money(x.subtotal)}</td>
 </tr>`;

  if(!wrap||!stage)return;
  const available=Math.max(300,stage.clientWidth-12);
  const scale=Math.min(1,available/794);
  wrap.style.transform=`scale(${scale})`;
  wrap.style.transformOrigin="top center";
  wrap.style.marginBottom=(1123*(scale-1))+"px";
}
function renderMaster(doc){
  const frame=$("docFrame");
  const rendered=paperHtml(doc);
  const src=`<!doctype html><html lang="th"><head><meta charset="utf-8"><base href="${location.origin}/"><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>${ADMIN_MASTER_CSS}</style></head><body>${rendered}</body></html>`;
  frame.srcdoc=src;
  frame.onload=()=>{setTimeout(fitFrame,50)};
}
function renderActions(){
  const a=[`<a class="btn" href="member-accounting-documents.html">กลับรายการเอกสาร</a>`];
  if(currentDoc.document_status!=="CANCELLED"){
    a.push(`<button class="btn yellow" id="printBtn">พิมพ์ / PDF</button>`);
    if(currentDoc.document_type==="INVOICE"&&currentDoc.document_status==="ISSUED")a.push(`<a class="btn green" href="member-payments.html">แจ้งชำระเงิน</a>`);
  }
  $("actions").innerHTML=a.join("");
  const p=$("printBtn");
  if(p)p.onclick=()=>{
    const w=$("docFrame").contentWindow;
    if(!w)return alert("เอกสารยังไม่พร้อม");
    w.focus();w.print();
  };
}
async function init(){
  try{
    const {data:{session},error}=await db.auth.getSession();
    if(error)throw error;
    if(!session?.user){location.replace("member-login.html");return}
    $("memberEmail").textContent=session.user.email||"";
    const {data:profile}=await db.from("profiles").select("title_th,firstname_th,lastname_th,email").eq("id",session.user.id).maybeSingle();
    if(profile){
      $("memberName").textContent=[profile.title_th,profile.firstname_th,profile.lastname_th].filter(Boolean).join(" ")||"สมาชิก SANTE";
      $("memberEmail").textContent=profile.email||session.user.email||"";
    }
    if(!DOC_ID)throw new Error("ไม่พบรหัสเอกสาร");

    const {data,error:detailError}=await db.rpc("member_get_accounting_document_detail",{p_document_id:DOC_ID});
    if(detailError)throw detailError;
    if(!data?.document)throw new Error("ไม่พบเอกสารนี้ หรือเอกสารไม่ได้เป็นของบัญชีนี้");

    currentDoc={...data.document,items:Array.isArray(data.items)?data.items:[]};
    const label=docLabel(currentDoc.document_type);
    document.title=`SANTE Member | ${label} ${currentDoc.document_no||""}`;
    $("crumbType").textContent=label;
    $("title").textContent=`${label} ${currentDoc.document_no||""}`;
    $("subtitle").textContent=currentDoc.organization_name||currentDoc.customer_name||"";
    $("status").textContent=currentDoc.document_status==="CANCELLED"?"ยกเลิก":"ออกเอกสารแล้ว";
    $("status").className="badge"+(currentDoc.document_status==="CANCELLED"?" cancelled":"");
    $("mNo").textContent=currentDoc.document_no||"-";
    $("mDate").textContent=thDate(currentDoc.issue_date);
    $("mDue").textContent=thDate(currentDoc.due_date||currentDoc.valid_until);
    $("mNet").textContent=money(currentDoc.net_receivable||currentDoc.grand_total)+" บาท";

    if(currentDoc.document_status==="CANCELLED"){
      $("notice").style.display="block";
      $("notice").textContent="เอกสารฉบับนี้ถูกยกเลิกแล้ว และไม่สามารถใช้เพื่อชำระเงินได้";
    }

    renderMaster(currentDoc);
    renderActions();
    $("loading").classList.add("hide");
  }catch(e){
    console.error(e);
    $("loading").innerHTML=`โหลดเอกสารไม่สำเร็จ<br><span style="font-size:13px;color:#6f82a0">${esc(e.message||e)}</span><br><a class="btn" style="margin-top:12px" href="member-accounting-documents.html">กลับรายการเอกสาร</a>`;
  }
}
window.addEventListener("resize",fitFrame);
$("logout").onclick=async()=>{await db.auth.signOut();location.replace("member-login.html")};
init();
</script>
</body>
</html>
