<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SANTE Member | เอกสารทางบัญชี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Prompt",sans-serif;background:#f4f9fd;color:#082d69}
a{text-decoration:none;color:inherit}button{font:inherit}
.topbar{height:72px;background:#fff;border-bottom:1px solid #e2ebf4;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1320px)/2));position:sticky;top:0;z-index:20}
.brand{height:54px;width:180px;object-fit:contain;object-position:left center}
.member{display:flex;gap:14px;align-items:center}.who{text-align:right;font-size:12px;color:#6f82a0}.who b{display:block;color:#082d69;font-size:14px}
.btn{min-height:42px;padding:0 16px;border-radius:10px;border:1px solid #d4e0ed;background:#fff;color:#082d69;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn.yellow{background:#ffbf19;border-color:#ffbf19}.btn.green{background:#e7f7ed;border-color:#c8ead4;color:#167440}
.page{width:min(1380px,calc(100% - 36px));margin:0 auto;padding:22px 0 55px}
.crumb{font-size:12px;color:#7387a1;margin-bottom:8px}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:14px}
.head h1{margin:0;font-size:28px}.sub{color:#6f82a0;font-size:13px;margin-top:4px}
.badge{padding:7px 12px;border-radius:999px;font-size:12px;background:#e8f7ed;color:#167440;font-weight:600}
.badge.cancelled{background:#fdecec;color:#9e4141}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.meta>div{background:#fff;border:1px solid #dce7f2;border-radius:12px;padding:12px 14px}
.meta span{display:block;color:#7387a1;font-size:11px}.meta b{display:block;margin-top:3px;font-size:14px}
.stage{background:#eaf2f8;border:1px solid #d8e4ef;border-radius:18px;padding:12px;display:flex;justify-content:center}
.pdf-shell{width:min(100%,1080px);height:calc(100vh - 250px);min-height:760px;background:#fff;border:1px solid #d5e0ea;box-shadow:0 12px 34px rgba(6,37,76,.14)}
.pdf-frame{width:100%;height:100%;border:0;display:block;background:#fff}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;background:#fff;border:1px solid #dce7f2;border-radius:14px;margin-top:14px;padding:13px}
.notice{margin-top:12px;text-align:center;padding:11px;border-radius:10px;background:#fff7dd;color:#806000;border:1px solid #f1df9c;font-size:12px}
.notice.cancelled{background:#fff0f0;color:#9d4242;border-color:#efcccc}
.loading{position:fixed;inset:0;background:#fff;z-index:99;display:flex;align-items:center;justify-content:center;text-align:center}
.loading.hide{display:none}
@media(max-width:850px){
 .meta{grid-template-columns:1fr 1fr}.head{align-items:flex-start;flex-direction:column}
 .stage{padding:4px}.pdf-shell{height:72vh;min-height:520px}
}
</style>
<meta name="sante-member-accounting-view" content="R19-CANONICAL-PDF-ONLY">
<meta name="sante-single-pdf-master" content="R21-MEMBER-READS-ADMIN-CANONICAL-PDF">
<meta name="sante-payment-fix" content="R23-INVOICE-CONTEXT">
</head>
<body>
<div id="loading" class="loading">กำลังโหลดเอกสาร...</div>

<header class="topbar">
  <a href="member-home.html"><img class="brand" src="sante%20(en)-logo.png" alt="SANTE"></a>
  <div class="member">
    <div class="who"><b id="memberName">สมาชิก SANTE</b><span id="memberEmail"></span></div>
    <button id="logout" class="btn">ออกจากระบบ</button>
  </div>
</header>

<main class="page">
  <div class="crumb">
    <a href="member-home.html">หน้าหลัก</a> ›
    <a href="member-accounting-documents.html">เอกสารทางบัญชีของฉัน</a> ›
    <span id="crumbType">เอกสาร</span>
  </div>

  <section class="head">
    <div>
      <h1 id="title">เอกสารทางบัญชี</h1>
      <div id="subtitle" class="sub"></div>
    </div>
    <span id="status" class="badge">-</span>
  </section>

  <section class="meta">
    <div><span>เลขที่เอกสาร</span><b id="mNo">-</b></div>
    <div><span>วันที่ออก</span><b id="mDate">-</b></div>
    <div><span>ครบกำหนด / ใช้ได้ถึง</span><b id="mDue">-</b></div>
    <div><span>ยอดสุทธิ</span><b id="mNet">0.00 บาท</b></div>
  </section>

  <section class="stage">
    <div id="pdfShell" class="pdf-shell" style="display:none">
      <iframe id="pdfFrame" class="pdf-frame" title="เอกสาร PDF"></iframe>
    </div>
    <div id="pdfMissing" style="display:none;align-self:center;text-align:center;color:#6f82a0;line-height:1.7;padding:80px 20px">
      ไม่พบไฟล์ PDF ที่ออกจากระบบสำหรับเอกสารนี้<br>
      กรุณาติดต่อ SANTE
    </div>
  </section>

  <div id="notice" class="notice" style="display:none"></div>
  <div id="actions" class="actions"></div>
</main>

<script>
const db=window.supabase.createClient(
  "https://cyegjwerxlxhczrfiurz.supabase.co",
  "sb_publishable_Hhr1LDrJqvzdEcHR4cScwA_YA9b9eYF",
  {auth:{storageKey:"sante-member-auth",persistSession:true,autoRefreshToken:true}}
);
const $=id=>document.getElementById(id);
const DOC_ID=new URLSearchParams(location.search).get("id");
const labels={
  QUOTATION:"ใบเสนอราคา",
  INVOICE:"ใบแจ้งหนี้",
  RECEIPT_TAX_INVOICE:"ใบเสร็จรับเงิน / ใบกำกับภาษี",
  CREDIT_NOTE:"ใบลดหนี้"
};
let currentDoc=null;
let pdfUrl="";

function money(v){return Number(v||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function thDate(v){
  if(!v)return "-";
  const d=new Date(v);
  return Number.isNaN(d.getTime())?String(v):new Intl.DateTimeFormat("th-TH",{day:"2-digit",month:"short",year:"numeric"}).format(d);
}
function safeDocNo(v){
  return String(v||"DOCUMENT").trim().replace(/[^A-Za-z0-9_-]/g,"_")||"DOCUMENT";
}
function canonicalPdfPath(x){
  const safe=safeDocNo(x?.document_no);
  const year=String(x?.issue_date||"").slice(0,4)||String(new Date().getFullYear());
  return `accounting/${year}/${x.document_type}/${safe}.pdf`;
}
async function signedUrl(path){
  const {data,error}=await db.storage.from("training-documents").createSignedUrl(path,900);
  if(error){console.error("SIGNED URL ERROR",path,error);return ""}
  return data?.signedUrl||"";
}
async function downloadPdf(){
  if(!pdfUrl||!currentDoc)return;
  try{
    const r=await fetch(pdfUrl);
    if(!r.ok)throw new Error("ดาวน์โหลดไฟล์ไม่สำเร็จ");
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=safeDocNo(currentDoc.document_no)+".pdf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(e){
    alert("ดาวน์โหลด PDF ไม่สำเร็จ: "+(e.message||e));
  }
}

function goToInvoicePayment(id,no,amount){
  const ctx={
    invoice_id:String(id||""),
    document_no:String(no||""),
    amount:Number(amount||0)
  };
  sessionStorage.setItem("sante-invoice-payment-context",JSON.stringify(ctx));
  const qs=new URLSearchParams({
    invoice:ctx.invoice_id,
    document:ctx.document_no,
    amount:String(ctx.amount)
  });
  location.href="member-payments.html?"+qs.toString();
}

function renderActions(){
  const actions=[`<a class="btn" href="member-accounting-documents.html">กลับรายการเอกสาร</a>`];
  if(pdfUrl){
    actions.push(`<button class="btn yellow" id="openPdfBtn">เปิด PDF แยกหน้าต่าง</button>`);
    actions.push(`<button class="btn" id="downloadPdfBtn">ดาวน์โหลด PDF</button>`);
  }
  if(currentDoc?.document_type==="INVOICE"&&currentDoc.document_status==="ISSUED"){
    actions.push(`<button class="btn green" id="invoicePaymentBtn" type="button">แจ้งชำระเงิน</button>`);
  }
  $("actions").innerHTML=actions.join("");
  if($("openPdfBtn"))$("openPdfBtn").onclick=()=>window.open(pdfUrl+(pdfUrl.includes("?")?"&":"?")+"fresh="+Date.now(),"_blank","noopener");
  if($("downloadPdfBtn"))$("downloadPdfBtn").onclick=downloadPdf;
  if($("invoicePaymentBtn"))$("invoicePaymentBtn").onclick=()=>goToInvoicePayment(
    currentDoc.source_id,
    currentDoc.document_no,
    currentDoc.net_receivable||currentDoc.grand_total||0
  );
}
async function init(){
  try{
    const {data:{session},error}=await db.auth.getSession();
    if(error)throw error;
    if(!session?.user){location.replace("member-login.html");return}

    $("memberEmail").textContent=session.user.email||"";
    const {data:profile}=await db.from("profiles").select("title_th,firstname_th,lastname_th,email").eq("id",session.user.id).maybeSingle();
    if(profile){
      $("memberName").textContent=[profile.title_th,profile.firstname_th,profile.lastname_th].filter(Boolean).join(" ")||"สมาชิก SANTE";
      $("memberEmail").textContent=profile.email||session.user.email||"";
    }

    if(!DOC_ID)throw new Error("ไม่พบรหัสเอกสาร");

    // This RPC is used only to verify ownership and read document metadata.
    const {data,error:rpcError}=await db.rpc("member_get_my_accounting_documents");
    if(rpcError)throw rpcError;

    const rows=Array.isArray(data)?data:[];
    currentDoc=rows.find(x=>String(x.source_id)===String(DOC_ID));
    if(!currentDoc)throw new Error("ไม่พบเอกสารนี้ในบัญชีของคุณ");

    if(currentDoc.document_type==="QUOTATION"){
      location.replace("member-quotation.html?id="+encodeURIComponent(currentDoc.source_id));
      return;
    }

    const label=labels[currentDoc.document_type]||currentDoc.document_type||"เอกสาร";
    document.title=safeDocNo(currentDoc.document_no);
    $("crumbType").textContent=label;
    $("title").textContent=`${label} ${currentDoc.document_no||""}`;
    $("subtitle").textContent=currentDoc.organization_name||currentDoc.customer_name||"";
    $("status").textContent=currentDoc.document_status==="CANCELLED"?"ยกเลิก":"ออกเอกสารแล้ว";
    $("status").className="badge"+(currentDoc.document_status==="CANCELLED"?" cancelled":"");
    $("mNo").textContent=currentDoc.document_no||"-";
    $("mDate").textContent=thDate(currentDoc.issue_date);
    $("mDue").textContent=thDate(currentDoc.due_date||currentDoc.valid_until);
    $("mNet").textContent=money(currentDoc.net_receivable||currentDoc.grand_total)+" บาท";

    if(currentDoc.document_status==="CANCELLED"){
      $("notice").style.display="block";
      $("notice").className="notice cancelled";
      $("notice").textContent="เอกสารฉบับนี้ถูกยกเลิกแล้ว และไม่สามารถใช้เพื่อชำระเงินได้";
    }

    // IMPORTANT: display exactly the PDF that Admin writes.
    const path=canonicalPdfPath(currentDoc);
    pdfUrl=await signedUrl(path);

    if(pdfUrl){
      $("pdfFrame").src=pdfUrl+(pdfUrl.includes("?")?"&":"?")+"fresh="+Date.now()+"#toolbar=1&navpanes=0&view=FitH";
      $("pdfShell").style.display="block";
    }else{
      $("pdfMissing").style.display="block";
    }

    renderActions();
    $("loading").classList.add("hide");
  }catch(e){
    console.error(e);
    $("loading").innerHTML=`โหลดเอกสารไม่สำเร็จ<br><span style="font-size:13px;color:#6f82a0">${esc(e.message||e)}</span><br><a class="btn" style="margin-top:12px" href="member-accounting-documents.html">กลับรายการเอกสาร</a>`;
  }
}
$("logout").onclick=async()=>{await db.auth.signOut();location.replace("member-login.html")};
init();
</script>
</body>
</html>
