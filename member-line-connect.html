<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SANTE Member | เชื่อมต่อ LINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #082d69;
      --navy-dark: #061f4d;
      --blue: #087df0;
      --yellow: #ffbf19;
      --yellow-dark: #b77d00;
      --green: #188d49;

      --text: #082d69;
      --muted: #6f82a0;

      --line: #dce7f2;

      --soft-blue: #eaf5ff;
      --soft-yellow: #fff5d8;

      --white: #ffffff;

      --shadow:
        0 10px 30px rgba(11, 45, 103, 0.07);
    }

    html {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      min-height: 100vh;

      overflow-x: hidden;

      font-family: "Prompt", sans-serif;

      color: var(--text);

      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #f7fbfe 32%,
          #eef7fc 100%
        );
    }

    img {
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font-family: "Prompt", sans-serif;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }


    /* =========================================================
       LOADING
    ========================================================= */

    .loading {
      position: fixed;
      inset: 0;

      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background: #ffffff;

      color: var(--navy);

      font-size: 16px;
      font-weight: 500;

      text-align: center;
    }

    .loading.hidden {
      display: none;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    .topbar {
      width: 100%;
      height: 82px;

      position: sticky;
      top: 0;
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 30px;

      padding:
        0
        max(28px, calc((100vw - 1480px) / 2));

      background: rgba(255, 255, 255, 0.97);

      border-bottom: 1px solid #e7eef6;

      box-shadow:
        0 3px 16px rgba(11, 45, 103, 0.04);

      backdrop-filter: blur(10px);
    }

    .brand {
      min-width: 0;

      display: flex;
      align-items: center;
    }

    .brand-logo {
      width: 220px;
      height: 68px;

      display: block;

      object-fit: contain;
      object-position: left center;
    }

    .member-area {
      min-width: 0;

      display: flex;
      align-items: center;

      gap: 18px;
    }

    .member-copy {
      min-width: 0;

      text-align: right;
    }

    .member-name {
      max-width: 320px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      color: var(--navy);

      font-size: 16px;
      font-weight: 600;
    }

    .member-email {
      max-width: 320px;

      margin-top: 2px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      color: #7184a3;

      font-size: 13px;
    }

    .logout-button {
      min-height: 44px;

      flex-shrink: 0;

      padding: 0 18px;

      border: 1px solid #d5e1ef;
      border-radius: 11px;

      background: #ffffff;

      color: var(--navy);

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition: 0.2s;
    }

    .logout-button:hover {
      background: #f5f9fd;

      border-color: #b9cde4;
    }


    /* =========================================================
       PAGE
    ========================================================= */

    .page {
      width: min(1480px, calc(100% - 48px));

      margin: 0 auto;

      padding:
        24px
        0
        60px;
    }


    /* =========================================================
       DESKTOP HERO
    ========================================================= */

    .desktop-hero {
      width: 100%;

      overflow: hidden;

      border-radius: 28px;

      background: #ffffff;

      box-shadow: var(--shadow);
    }

    .desktop-hero img {
      width: 100%;
      height: auto;

      display: block;
    }


    /* =========================================================
       MOBILE HERO
       hidden on desktop
    ========================================================= */

    .mobile-hero {
      display: none;
    }


    /* =========================================================
       SECTION HEADING
    ========================================================= */

    .section-heading {
      display: flex;
      align-items: center;

      gap: 15px;

      margin:
        30px
        8px
        16px;
    }

    .section-icon {
      width: 54px;
      height: 54px;

      flex: 0 0 54px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: #e4f3ff;

      color: var(--blue);

      font-size: 24px;
      font-weight: 700;
    }

    .section-heading h2 {
      color: var(--navy);

      font-size: clamp(25px, 2vw, 30px);
      font-weight: 700;

      line-height: 1.25;
    }

    .section-heading p {
      margin-top: 4px;

      color: var(--muted);

      font-size: 15px;

      line-height: 1.6;
    }


    /* =========================================================
       SERVICE GRID
    ========================================================= */

    .service-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 18px;
    }

    .service-card {
      min-width: 0;
      min-height: 182px;

      position: relative;

      display: grid;

      grid-template-columns:
        68px
        minmax(0, 1fr)
        auto;

      align-items: start;

      gap: 19px;

      padding: 25px;

      overflow: hidden;

      background: rgba(255, 255, 255, 0.98);

      border: 1px solid var(--line);
      border-radius: 22px;

      box-shadow:
        0 7px 20px rgba(25, 75, 130, 0.04);
    }

    .service-card::after {
      content: "";

      position: absolute;

      width: 170px;
      height: 170px;

      right: -65px;
      bottom: -90px;

      border-radius: 50%;

      background: #f2f8fd;

      pointer-events: none;
    }

    .service-card.active {
      cursor: pointer;

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease;
    }

    .service-card.active:hover {
      transform: translateY(-3px);

      border-color: #c9dced;

      box-shadow:
        0 14px 30px rgba(11, 45, 103, 0.09);
    }

    .service-icon {
      width: 64px;
      height: 64px;

      position: relative;
      z-index: 2;

      display: grid;
      place-items: center;

      border-radius: 18px;

      background: var(--soft-blue);

      color: var(--blue);

      font-size: 29px;
      font-weight: 700;
    }

    .training-card .service-icon {
      background: var(--soft-yellow);

      color: #e5a200;
    }

    .service-content {
      min-width: 0;

      position: relative;
      z-index: 2;
    }

    .service-content h3 {
      color: var(--navy);

      font-size: 24px;
      font-weight: 700;

      line-height: 1.35;
    }

    .service-content p {
      max-width: 680px;

      margin-top: 7px;

      color: #6c809f;

      font-size: 15px;

      line-height: 1.75;
    }

    .service-action {
      display: inline-block;

      margin-top: 10px;

      color: var(--yellow-dark);

      font-size: 15px;
      font-weight: 600;
    }

    .service-action.disabled {
      color: #7588a6;
    }

    .service-status {
      position: relative;
      z-index: 3;

      height: max-content;

      padding: 7px 13px;

      border-radius: 999px;

      background: #eef3f8;

      color: #7990ad;

      font-size: 12px;
      font-weight: 500;

      white-space: nowrap;
    }

    .service-status.ready {
      background: #e8f8ed;

      color: var(--green);
    }


    /* =========================================================
       QUICK GRID
    ========================================================= */

    .quick-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 18px;

      margin-top: 18px;
    }

    .quick-card {
      min-width: 0;
      min-height: 100px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      padding: 20px 24px;

      background: #ffffff;

      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .quick-card > div {
      min-width: 0;
    }

    .quick-card h4 {
      color: var(--navy);

      font-size: 18px;
      font-weight: 600;
    }

    .quick-card p {
      margin-top: 4px;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.6;
    }

    .quick-status {
      flex-shrink: 0;

      color: #8192a9;

      font-size: 12px;

      white-space: nowrap;
    }


    /* =========================================================
       TRAINING SECTION
    ========================================================= */

    .training-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 25px;

      margin:
        30px
        8px
        16px;
    }

    .training-heading-left {
      min-width: 0;

      display: flex;
      align-items: center;

      gap: 15px;
    }

    .training-heading h2 {
      color: var(--navy);

      font-size: clamp(24px, 2vw, 29px);
      font-weight: 700;
    }

    .training-heading p {
      margin-top: 3px;

      color: var(--muted);

      font-size: 14px;
    }

    .search-box {
      width: min(410px, 35vw);
      height: 48px;

      flex-shrink: 0;

      padding: 0 17px;

      border: 1px solid #d7e2ef;
      border-radius: 12px;

      outline: none;

      background: #ffffff;

      color: var(--navy);

      font-size: 14px;
    }

    .search-box:focus {
      border-color: #7db9ee;

      box-shadow:
        0 0 0 3px
        rgba(8, 125, 240, 0.08);
    }


    /* =========================================================
       TRAINING PREVIEW
    ========================================================= */

    .training-preview {
      min-width: 0;
      min-height: 160px;

      display: flex;
      align-items: center;

      gap: 22px;

      padding: 19px;

      background: #ffffff;

      border: 1px solid var(--line);
      border-radius: 20px;

      box-shadow:
        0 6px 18px rgba(11, 45, 103, 0.04);
    }

    .training-preview-image {
      width: 190px;
      height: 122px;

      flex: 0 0 190px;

      display: grid;
      place-items: center;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          #e4f3ff,
          #fff2c7
        );

      font-size: 48px;
    }

    .training-preview-content {
      min-width: 0;
    }

    .training-preview h3 {
      color: var(--navy);

      font-size: 21px;
      font-weight: 700;

      line-height: 1.4;
    }

    .training-preview p {
      margin-top: 6px;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.7;
    }

    .training-button {
      min-height: 42px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      margin-top: 12px;

      padding: 9px 18px;

      border-radius: 10px;

      background: var(--yellow);

      color: var(--navy);

      font-size: 14px;
      font-weight: 600;

      transition: 0.2s;
    }

    .training-button:hover {
      background: #f5b600;
    }


    /* =========================================================
       TABLET
       768 - 1023
    ========================================================= */

    @media
    (min-width: 768px)
    and
    (max-width: 1023px) {

      .topbar {
        height: 76px;

        padding: 0 24px;
      }

      .brand-logo {
        width: 180px;
        height: 62px;
      }

      .member-name {
        max-width: 220px;

        font-size: 14px;
      }

      .member-email {
        max-width: 220px;

        font-size: 11px;
      }

      .page {
        width: calc(100% - 36px);

        padding-top: 18px;
      }

      .desktop-hero {
        border-radius: 22px;
      }

      .service-grid {
        grid-template-columns: 1fr;
      }

      .service-card {
        min-height: 165px;
      }

      .quick-grid {
        grid-template-columns: 1fr;
      }

      .training-heading {
        align-items: flex-end;
      }

      .search-box {
        width: 320px;
      }

    }


    /* =========================================================
       MOBILE
       <= 767px
    ========================================================= */

    @media (max-width: 767px) {

      body {
        background:
          linear-gradient(
            180deg,
            #ffffff 0%,
            #f6fbff 45%,
            #eef7fc 100%
          );
      }


      /* -------------------------
         MOBILE HEADER
      ------------------------- */

      .topbar {
        height: auto;
        min-height: 64px;

        position: sticky;

        gap: 8px;

        padding:
          7px
          12px;

        padding-left:
          max(12px, env(safe-area-inset-left));

        padding-right:
          max(12px, env(safe-area-inset-right));
      }

      .brand {
        flex: 1 1 auto;

        min-width: 0;
      }

      .brand-logo {
        width: 118px;
        height: 50px;

        flex-shrink: 0;
      }

      .member-area {
        flex: 0 1 auto;

        gap: 7px;
      }

      .member-copy {
        display: none;
      }

      .logout-button {
        min-height: 38px;

        padding: 0 10px;

        border-radius: 9px;

        font-size: 11px;
      }


      /* -------------------------
         MOBILE PAGE
      ------------------------- */

      .page {
        width: 100%;

        margin: 0;

        padding:
          10px
          12px
          calc(35px + env(safe-area-inset-bottom));
      }


      /* -------------------------
         HIDE DESKTOP HERO
      ------------------------- */

      .desktop-hero {
        display: none;
      }


      /* -------------------------
         MOBILE HERO
      ------------------------- */

      .mobile-hero {
        min-height: 390px;

        position: relative;

        display: flex;
        flex-direction: column;

        overflow: hidden;

        padding:
          23px
          20px
          0;

        border-radius: 20px;

        background:
          linear-gradient(
            145deg,
            #eaf7ff 0%,
            #ffffff 58%,
            #fff4c9 100%
          );

        box-shadow:
          0 8px 25px
          rgba(11, 45, 103, 0.07);
      }

      .mobile-hero::before {
        content: "";

        position: absolute;

        width: 190px;
        height: 190px;

        top: -90px;
        right: -70px;

        border-radius: 50%;

        background:
          rgba(255, 191, 25, 0.28);
      }

      .mobile-hero::after {
        content: "";

        position: absolute;

        width: 180px;
        height: 180px;

        left: -90px;
        bottom: -90px;

        border-radius: 50%;

        background:
          rgba(64, 176, 245, 0.14);
      }

      .mobile-hero-content {
        position: relative;
        z-index: 5;
      }

      .mobile-hero-badge {
        width: max-content;

        display: inline-flex;
        align-items: center;

        padding: 6px 12px;

        border-radius: 999px;

        background: var(--yellow);

        color: var(--navy);

        font-size: 11px;
        font-weight: 600;

        letter-spacing: 0.3px;
      }

      .mobile-hero h1 {
        margin-top: 13px;

        color: var(--navy);

        font-size: clamp(27px, 8vw, 34px);
        font-weight: 700;

        line-height: 1.23;
      }

      .mobile-hero h1 span {
        color: #087df0;
      }

      .mobile-hero-description {
        max-width: 320px;

        margin-top: 9px;

        color: #637b9a;

        font-size: 13px;

        line-height: 1.65;
      }

      .mobile-hero-visual {
        min-height: 0;

        position: relative;
        z-index: 3;

        flex: 1;

        display: flex;
        align-items: flex-end;
        justify-content: center;

        margin:
          5px
          -20px
          0;

        overflow: hidden;
      }

      .mobile-hero-visual img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
        object-position: center;
      }

      .mobile-hero-visual::before { display: none; }


      /* -------------------------
         MOBILE SECTION HEADING
      ------------------------- */

      .section-heading {
        gap: 11px;

        margin:
          23px
          2px
          13px;
      }

      .section-icon {
        width: 44px;
        height: 44px;

        flex-basis: 44px;

        font-size: 19px;
      }

      .section-heading h2 {
        font-size: 21px;

        line-height: 1.3;
      }

      .section-heading p {
        margin-top: 2px;

        font-size: 12px;

        line-height: 1.5;
      }


      /* -------------------------
         MOBILE SERVICE
      ------------------------- */

      .service-grid {
        grid-template-columns: 1fr;

        gap: 11px;
      }

      .service-card {
        width: 100%;
        min-height: 0;

        display: grid;

        grid-template-columns:
          52px
          minmax(0, 1fr);

        gap:
          8px
          12px;

        padding: 16px;

        border-radius: 17px;
      }

      .service-card::after {
        width: 120px;
        height: 120px;

        right: -60px;
        bottom: -65px;
      }

      .service-icon {
        width: 50px;
        height: 50px;

        grid-column: 1;
        grid-row: 1;

        border-radius: 14px;

        font-size: 22px;
      }

      .service-content {
        grid-column: 2;
        grid-row: 1 / span 2;

        padding-right: 0;
      }

      .service-content h3 {
        padding-right: 0;

        font-size: 18px;

        line-height: 1.4;
      }

      .service-content p {
        margin-top: 5px;

        font-size: 12.5px;

        line-height: 1.65;
      }

      .service-action {
        margin-top: 8px;

        font-size: 12.5px;
      }

      .service-status {
        grid-column: 1 / -1;
        grid-row: 3;

        justify-self: start;

        margin-top: 2px;

        padding: 5px 9px;

        font-size: 10px;
      }


      /* -------------------------
         MOBILE QUICK
      ------------------------- */

      .quick-grid {
        grid-template-columns: 1fr;

        gap: 10px;

        margin-top: 11px;
      }

      .quick-card {
        width: 100%;
        min-height: 0;

        align-items: flex-start;

        gap: 10px;

        padding: 15px;

        border-radius: 15px;
      }

      .quick-card h4 {
        font-size: 15px;

        line-height: 1.4;
      }

      .quick-card p {
        margin-top: 3px;

        font-size: 11.5px;

        line-height: 1.55;
      }

      .quick-status {
        padding-top: 2px;

        font-size: 10px;
      }


      /* -------------------------
         MOBILE TRAINING TITLE
      ------------------------- */

      .training-heading {
        display: block;

        margin:
          24px
          2px
          13px;
      }

      .training-heading-left {
        gap: 11px;
      }

      .training-heading h2 {
        font-size: 20px;

        line-height: 1.35;
      }

      .training-heading p {
        margin-top: 2px;

        font-size: 11.5px;
      }

      .search-box {
        width: 100%;
        height: 44px;

        margin-top: 12px;

        padding: 0 14px;

        border-radius: 11px;

        font-size: 13px;
      }


      /* -------------------------
         MOBILE TRAINING PREVIEW
      ------------------------- */

      .training-preview {
        width: 100%;
        min-height: 0;

        display: block;

        padding: 14px;

        border-radius: 17px;
      }

      .training-preview-image {
        width: 100%;
        height: 105px;

        margin-bottom: 13px;

        border-radius: 13px;

        font-size: 38px;
      }

      .training-preview h3 {
        font-size: 17px;

        line-height: 1.4;
      }

      .training-preview p {
        margin-top: 5px;

        font-size: 12px;

        line-height: 1.65;
      }

      .training-button {
        width: 100%;
        min-height: 43px;

        margin-top: 11px;

        font-size: 13px;
      }

    }


    /* =========================================================
       SMALL MOBILE
       <= 374px
    ========================================================= */

    @media (max-width: 374px) {

      .page {
        padding-left: 10px;
        padding-right: 10px;
      }

      .brand-logo {
        width: 104px;
      }

      .logout-button {
        padding: 0 8px;

        font-size: 10px;
      }

      .mobile-hero {
        min-height: 370px;

        padding:
          20px
          17px
          0;
      }

      .mobile-hero h1 {
        font-size: 26px;
      }

      .mobile-hero-description {
        font-size: 12px;
      }

      .mobile-hero-visual {
        margin-left: -17px;
        margin-right: -17px;
      }

      .service-card {
        padding: 14px;
      }

      .service-content h3 {
        font-size: 17px;
      }

      .service-content p {
        font-size: 12px;
      }

    }


    /* =========================================================
       LARGE DESKTOP
    ========================================================= */

    @media (min-width: 1600px) {

      .page {
        width: min(1520px, calc(100% - 80px));
      }

      .topbar {
        padding-left:
          max(40px, calc((100vw - 1520px) / 2));

        padding-right:
          max(40px, calc((100vw - 1520px) / 2));
      }

      .service-content h3 {
        font-size: 26px;
      }

      .service-content p {
        font-size: 16px;
      }

    }

  

.line-page{
  width:100%;
  margin:0 auto;
  padding:30px 0 70px;
}
.line-card{
  width:100%;
  min-height:280px;
  padding:42px 46px;
  border:1px solid var(--line);
  border-radius:24px;
  background:#fff;
  box-shadow:0 10px 28px rgba(25,75,130,.055);
}
.line-card + .line-card{margin-top:18px}
.line-status{
  display:flex;
  align-items:center;
  gap:20px;
}
.line-dot{
  width:18px;height:18px;border-radius:50%;
  flex:0 0 18px;
  background:#9aa9bc;
  box-shadow:0 0 0 8px #eef2f7;
}
.line-dot.on{background:#06c755;box-shadow:0 0 0 8px #e8f8ee}
.line-copy h2{color:var(--navy);font-size:30px;line-height:1.3}
.line-copy p{margin-top:7px;color:var(--muted);font-size:16px;line-height:1.7}
.line-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}
.line-btn{
  min-height:50px;display:inline-flex;align-items:center;justify-content:center;
  padding:0 22px;border:1px solid var(--line);border-radius:12px;
  font:600 15px Prompt,sans-serif;cursor:pointer;background:#fff;color:var(--navy)
}
.line-btn.primary{background:#06c755;border-color:#06c755;color:#fff}
.line-btn.danger{background:#fff0f1;border-color:#efc5ca;color:#a52a35}
.line-info{margin-top:24px;padding:18px 20px;border-radius:15px;background:#eef6ff;color:#315577;font-size:15px;line-height:1.75}
.line-success{background:#eaf9f1;color:#087744}
.line-error{background:#fff0f1;color:#a52a35}

@media(max-width:1023px) and (min-width:768px){
  .line-page{width:100%;padding:24px 0 56px}
  .line-card{min-height:250px;padding:32px 34px;border-radius:22px}
  .line-copy h2{font-size:26px}
  .line-copy p{font-size:14px}
  .line-btn{min-height:46px;font-size:14px;padding:0 18px}
  .line-info{font-size:13px;padding:16px 17px}
}

@media(max-width:767px){
  .line-page{width:100%;padding:18px 0 calc(46px + env(safe-area-inset-bottom))}
  .line-card{min-height:0;padding:18px;border-radius:18px}
  .line-status{gap:14px;align-items:flex-start}
  .line-dot{width:14px;height:14px;flex-basis:14px;margin-top:4px;box-shadow:0 0 0 6px #eef2f7}
  .line-dot.on{box-shadow:0 0 0 6px #e8f8ee}
  .line-copy h2{font-size:20px;line-height:1.35}
  .line-copy p{margin-top:5px;font-size:12px;line-height:1.65}
  .line-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
  .line-actions .line-btn{width:100%;min-height:44px;font-size:12px;padding:0 10px}
  .line-info{margin-top:16px;padding:13px 14px;font-size:11.5px;line-height:1.65}
}

@media(max-width:430px){
  .line-actions{grid-template-columns:1fr}
}
</style>

<body>
<div id="loading" class="loading">กำลังตรวจสอบบัญชี...</div>

<header class="topbar">
  <a class="brand" href="member-home.html">
    <img src="sante%20(en)-logo.png" alt="SANTE Consulting" class="brand-logo">
  </a>
  <div class="member-area">
    <div class="member-copy">
      <div id="memberName" class="member-name">สมาชิก SANTE</div>
      <div id="memberEmail" class="member-email"></div>
    </div>
    <button id="logoutButton" class="logout-button" type="button">ออกจากระบบ</button>
  </div>
</header>

<main class="page">
  <section class="desktop-hero">
    <img src="sante-member-hero.png" alt="SANTE Member">
  </section>

  <section class="mobile-hero">
    <div class="mobile-hero-content">
      <div class="mobile-hero-badge">SANTE MEMBER</div>
      <h1>เชื่อมต่อบัญชี<br><span>กับ LINE</span></h1>
      <p class="mobile-hero-description">
        รับแจ้งเตือนการลงทะเบียน การชำระเงิน ผลสอบ และวุฒิบัตรผ่าน LINE
      </p>
    </div>
    <div class="mobile-hero-visual">
      <img src="sante-mobile-hero.png" alt="SANTE Member">
    </div>
  </section>

  <section class="line-page">
    <div id="message"></div>

    <div class="line-card">
      <div class="line-status">
        <div id="statusDot" class="line-dot"></div>
        <div class="line-copy">
          <h2 id="statusTitle">กำลังตรวจสอบ...</h2>
          <p id="statusText">กรุณารอสักครู่</p>
        </div>
      </div>

      <div class="line-actions">
        <button id="connectBtn" class="line-btn primary" type="button">เชื่อมต่อ LINE</button>
        <button id="testBtn" class="line-btn" type="button" style="display:none">ส่งข้อความทดสอบ</button>
        <button id="unlinkBtn" class="line-btn danger" type="button" style="display:none">ยกเลิกการเชื่อมต่อ</button>
        <a class="line-btn" href="member-home.html">กลับหน้าหลัก</a>
      </div>

      <div class="line-info">
        LINE เป็นช่องทางแจ้งเตือนเสริม ข้อมูลสำคัญยังสามารถตรวจสอบได้จากบัญชีสมาชิก SANTE
      </div>
    </div>
  </section>
</main>

<script>
const SUPABASE_URL="https://cyegjwerxlxhczrfiurz.supabase.co";
const SUPABASE_KEY="sb_publishable_Hhr1LDrJqvzdEcHR4cScwA_YA9b9eYF";
const WORKER_BASE="https://sante-notification-dispatcher.santeconsulting45.workers.dev";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{
    storageKey:"sante-member-auth",
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true
  }
});

const $=id=>document.getElementById(id);
let currentSession=null;

function fullName(p){
  return [p?.title_th,p?.firstname_th,p?.lastname_th].filter(Boolean).join(" ").replace(/\s+/g," ").trim();
}

function showMessage(text,type=""){
  $("message").innerHTML=text?`<div class="line-info ${type}">${text}</div><div style="height:12px"></div>`:"";
}

async function api(path,options={}){
  const token=currentSession?.access_token;
  if(!token) throw new Error("ไม่พบ session");
  const r=await fetch(WORKER_BASE+path,{
    ...options,
    headers:{
      "authorization":`Bearer ${token}`,
      "content-type":"application/json",
      ...(options.headers||{})
    }
  });
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||`HTTP ${r.status}`);
  return data;
}

function renderLinked(linked){
  $("statusDot").classList.toggle("on",linked);
  $("statusTitle").textContent=linked?"เชื่อมต่อ LINE แล้ว":"ยังไม่ได้เชื่อมต่อ LINE";
  $("statusText").textContent=linked
    ?"บัญชีนี้พร้อมรับ LINE Notification จาก SANTE"
    :"เชื่อมต่อ LINE เพื่อรับการแจ้งเตือนเพิ่มเติม";
  $("connectBtn").style.display=linked?"none":"inline-flex";
  $("testBtn").style.display=linked?"inline-flex":"none";
  $("unlinkBtn").style.display=linked?"inline-flex":"none";
}

async function initialize(){
  const sr=await db.auth.getSession();
  currentSession=sr.data.session;
  if(!currentSession?.user){
    location.replace("member-login.html");return;
  }

  $("memberEmail").textContent=currentSession.user.email||"";

  const pr=await db.from("profiles")
    .select("title_th,firstname_th,lastname_th,email,line_user_id,line_linked_at,line_notifications_enabled")
    .eq("id",currentSession.user.id).maybeSingle();

  if(pr.data){
    $("memberName").textContent=fullName(pr.data)||"สมาชิก SANTE";
    if(pr.data.email)$("memberEmail").textContent=pr.data.email;
    renderLinked(!!pr.data.line_user_id);
  }else{
    renderLinked(false);
  }

  const params=new URLSearchParams(location.search);
  if(params.get("linked")==="1"){
    showMessage("เชื่อมต่อ LINE สำเร็จแล้ว","line-success");
    renderLinked(true);
    history.replaceState({},document.title,"member-line-connect.html");
  }
  if(params.get("error")){
    showMessage("เชื่อมต่อ LINE ไม่สำเร็จ: "+params.get("error"),"line-error");
  }

  $("loading").classList.add("hidden");
}

$("connectBtn").onclick=async()=>{
  try{
    $("connectBtn").disabled=true;
    const data=await api("/line/connect/start",{method:"POST",body:"{}"});
    location.href=data.authorize_url;
  }catch(e){
    alert("เริ่มเชื่อมต่อ LINE ไม่สำเร็จ: "+e.message);
    $("connectBtn").disabled=false;
  }
};

$("testBtn").onclick=async()=>{
  try{
    $("testBtn").disabled=true;
    const data=await api("/line/test",{method:"POST",body:"{}"});
    alert("ส่งข้อความทดสอบไป LINE แล้ว");
  }catch(e){
    alert("ส่ง LINE ไม่สำเร็จ: "+e.message);
  }finally{
    $("testBtn").disabled=false;
  }
};

$("unlinkBtn").onclick=async()=>{
  if(!confirm("ยกเลิกการเชื่อมต่อ LINE ของบัญชีนี้หรือไม่?"))return;
  try{
    await api("/line/connect/unlink",{method:"POST",body:"{}"});
    renderLinked(false);
    showMessage("ยกเลิกการเชื่อมต่อ LINE แล้ว","line-success");
  }catch(e){
    alert("ยกเลิกการเชื่อมต่อไม่สำเร็จ: "+e.message);
  }
};

$("logoutButton").onclick=async()=>{
  await db.auth.signOut();
  location.replace("member-login.html");
};

initialize().catch(e=>{
  console.error(e);
  $("loading").textContent="โหลดข้อมูลไม่สำเร็จ: "+e.message;
});
</script>
</body>
</html>
