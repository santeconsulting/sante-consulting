/* =========================================================
   R5 MEMBER SHELL — MATCH MEMBER HOME (DESKTOP + MOBILE)
   ========================================================= */
:root{
  --member-navy:#082d69;
  --member-blue:#087df0;
  --member-yellow:#ffbf19;
  --member-muted:#6f82a0;
  --member-line:#dce7f2;
}

/* Header master */
.topbar{
  width:100%!important;
  height:82px!important;
  min-height:82px!important;
  position:sticky!important;
  top:0!important;
  z-index:100!important;
  display:flex!important;
  align-items:center!important;
  justify-content:space-between!important;
  gap:30px!important;
  padding:0 max(28px,calc((100vw - 1480px)/2))!important;
  background:rgba(255,255,255,.97)!important;
  border-bottom:1px solid #e7eef6!important;
  box-shadow:0 3px 16px rgba(11,45,103,.04)!important;
  backdrop-filter:blur(10px);
}
.brand{min-width:0;display:flex;align-items:center}
.brand-logo{
  width:220px!important;
  height:68px!important;
  display:block;
  object-fit:contain!important;
  object-position:left center!important;
}
.member-area{min-width:0;display:flex!important;align-items:center!important;gap:18px!important}
.member-copy{min-width:0;text-align:right!important}
.member-name{
  max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--member-navy);font-size:16px!important;font-weight:600!important
}
.member-email{
  max-width:320px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:#7184a3;font-size:13px!important
}
.logout,.logout-button{
  min-height:44px!important;height:auto!important;flex-shrink:0;padding:0 18px!important;
  border:1px solid #d5e1ef!important;border-radius:11px!important;background:#fff!important;
  color:var(--member-navy)!important;font:600 14px Prompt,sans-serif!important;cursor:pointer
}

/* Page + desktop hero master */
.page{
  width:min(1480px,calc(100% - 48px))!important;
  margin:0 auto!important;
  padding:24px 0 60px!important;
}
.desktop-hero{
  width:100%!important;display:block;overflow:hidden!important;border-radius:28px!important;
  background:#fff!important;box-shadow:0 10px 30px rgba(11,45,103,.07)!important;padding:0!important
}
.desktop-hero img{display:block!important;width:100%!important;height:auto!important;border-radius:0!important}
.mobile-hero{display:none}

/* Old hero aliases are no longer used visually */
.member-shell-hero,.hero.member-shell-legacy{display:none!important}

.crumbs{margin-top:28px!important;margin-bottom:12px!important;font-size:13px!important;color:#6f82a0!important}
.page-title{margin-bottom:18px!important}
