<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SANTE SYSTEM | Admin Login</title>

  <link rel="preconnect" href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Ffonts.googleapis.com%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7Cf72a775bdfb94211897508df21048e67%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265975590384786%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=x%2FTf7S2KjX6zZgg4TBHVSoqiRapPWFSxSYj9jpjnO%2Bk%3D&reserved=0">
  <link rel="preconnect" href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Ffonts.gstatic.com%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7Cf72a775bdfb94211897508df21048e67%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265975590406523%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=G9mqRc%2BW0R76%2FtqxBlK15OY1MpG0ALPjq6A6CY0qgbE%3D&reserved=0" crossorigin>
  <link href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Ffonts.googleapis.com%2Fcss2%3Ffamily%3DPrompt%3Awght%40300%3B400%3B500%3B600%3B700%26display%3Dswap&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7Cf72a775bdfb94211897508df21048e67%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265975590420124%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=YFouW%2F6BWDrM6TUIRR%2F6ZcdtN9rfs6VSnoMJxQiEDGo%3D&reserved=0" rel="stylesheet">

  <!-- Supabase -->
  <script src="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fcdn.jsdelivr.net%2Fnpm%2F%40supabase%2Fsupabase-js%402&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7Cf72a775bdfb94211897508df21048e67%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265975590432885%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=lWb01Zfp7FwWOz7eQmn0j4fT4onws%2BiTTA6Mt%2BdTryA%3D&reserved=0"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #06356b;
      --navy-dark: #032957;
      --blue: #075ea7;
      --yellow: #ffc400;
      --yellow-light: #ffd84d;
      --white: #ffffff;
      --text: #0b315f;
      --muted: #758399;
      --border: #d8e1ec;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: "Prompt", sans-serif;
      background: #f4f8fc;
      color: var(--text);
      overflow-x: hidden;
    }

    button,
    input {
      font-family: "Prompt", sans-serif;
    }

    /* =========================
       MAIN LAYOUT
    ========================= */

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-columns: 53% 47%;
      overflow: hidden;
      background: #fff;
    }

    /* =========================
       LEFT SIDE
    ========================= */

    .hero {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 25%,
          rgba(24, 126, 205, .58) 0%,
          rgba(24, 126, 205, 0) 38%),
        linear-gradient(145deg, #075fa9 0%, #064982 35%, #032957 100%);
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 780px;
      height: 780px;
      border-radius: 50%;
      background: rgba(255,255,255,.035);
      top: -510px;
      left: -200px;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 620px;
      height: 620px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.07);
      left: -280px;
      bottom: -330px;
    }

    .hero-copy {
      position: absolute;
      z-index: 5;
      top: 7vh;
      left: 9%;
      right: 5%;
    }

    .welcome-th {
      color: white;
      font-size: clamp(34px, 4.3vw, 68px);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -1px;
    }

    .welcome-en {
      color: var(--yellow);
      font-size: clamp(30px, 3.8vw, 59px);
      font-weight: 700;
      line-height: 1.08;
    }

    .welcome-line {
      width: 92px;
      height: 4px;
      background: var(--yellow);
      border-radius: 20px;
      margin: 18px 0;
    }

    .slogan-en {
      color: white;
      font-size: clamp(14px, 1.65vw, 26px);
      font-weight: 600;
      letter-spacing: .2px;
    }

    .slogan-en span {
      color: var(--yellow);
    }

    .slogan-th {
      color: white;
      font-size: clamp(13px, 1.25vw, 20px);
      margin-top: 3px;
      font-weight: 500;
    }

    .slogan-th span {
      color: var(--yellow);
      margin-left: 12px;
    }

    /* White wave area */

    .wave {
      position: absolute;
      z-index: 1;
      width: 130%;
      height: 60%;
      left: -12%;
      bottom: -13%;
      background: #f9fcff;
      border-radius: 52% 55% 0 0 / 19% 22% 0 0;
      transform: rotate(2deg);
      box-shadow:
        0 -14px 0 rgba(123,190,247,.35),
        0 -27px 0 rgba(213,235,255,.85);
    }

    .yellow-wave {
      position: absolute;
      z-index: 2;
      left: -5%;
      bottom: 2.5%;
      width: 110%;
      height: 26px;
      background: var(--yellow);
      transform: rotate(5deg);
      border-radius: 50%;
    }

    .navy-wave {
      position: absolute;
      z-index: 3;
      left: -12%;
      bottom: -11%;
      width: 120%;
      height: 19%;
      background: #003e7e;
      transform: rotate(3deg);
      border-radius: 50% 50% 0 0;
    }

    /* Industrial skyline */

    .skyline {
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      bottom: 18%;
      height: 22%;
      opacity: .20;
      background:
        linear-gradient(
          to top,
          #2188db 0 36%,
          transparent 36%
        );
      clip-path: polygon(
        0 100%, 0 60%, 4% 60%, 4% 25%,
        7% 25%, 7% 72%, 10% 72%, 10% 48%,
        13% 48%, 13% 80%, 17% 80%, 17% 40%,
        19% 40%, 19% 73%, 24% 73%, 24% 53%,
        28% 53%, 28% 83%, 34% 83%, 34% 36%,
        37% 36%, 37% 75%, 42% 75%, 42% 57%,
        47% 57%, 47% 83%, 53% 83%, 53% 45%,
        57% 45%, 57% 72%, 62% 72%, 62% 31%,
        65% 31%, 65% 78%, 70% 78%, 70% 50%,
        74% 50%, 74% 81%, 79% 81%, 79% 38%,
        82% 38%, 82% 70%, 86% 70%, 86% 55%,
        91% 55%, 91% 76%, 95% 76%, 95% 46%,
        98% 46%, 98% 100%
      );
    }

    /* Artwork */

    .mascot {
      position: absolute;
      z-index: 4;
      left: 4%;
      bottom: 0;
      width: min(90%, 820px);
      max-height: 70vh;
      object-fit: contain;
      object-position: left bottom;
      filter: drop-shadow(0 18px 18px rgba(0, 30, 70, .16));
    }

    /* =========================
       RIGHT SIDE
    ========================= */

    .login-side {
      min-height: 100svh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 26px 6%;
      background:
        radial-gradient(circle at 100% 50%, #e5f3ff 0, transparent 38%),
        #f8fbff;
    }

    .login-side::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 45%;
      height: 16px;
      background: var(--yellow);
      transform: skewX(-35deg);
      transform-origin: right top;
    }

    .card {
      position: relative;
      width: min(100%, 620px);
      background: rgba(255,255,255,.96);
      border-radius: 34px;
      padding: clamp(30px, 4vh, 48px) clamp(30px, 4vw, 56px);
      box-shadow: 0 18px 55px rgba(22, 72, 120, .12);
    }

    /* Language */

    .languages {
      position: absolute;
      top: 22px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px;
      background: #f0f5fb;
      border-radius: 40px;
    }

    .lang-btn {
      border: 0;
      background: transparent;
      color: var(--navy);
      padding: 8px 14px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
    }

    .lang-btn.active {
      background: var(--navy);
      color: white;
    }

    /* SANTE Logo symbol */

    .brand {
      text-align: center;
      padding-top: 32px;
      margin-bottom: 25px;
    }

    .brand-symbol {
      height: 86px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .brand-symbol span {
      display: block;
      width: 17px;
      border-radius: 20px;
      background: linear-gradient(#ffd636, #ffbf00);
    }

    .brand-symbol span:nth-child(1),
    .brand-symbol span:nth-child(5) {
      height: 40px;
    }

    .brand-symbol span:nth-child(2),
    .brand-symbol span:nth-child(4) {
      height: 62px;
    }

    .brand-symbol span:nth-child(3) {
      height: 86px;
    }

    .brand h1 {
      color: var(--navy);
      font-size: clamp(32px, 3.3vw, 52px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: .5px;
    }

    .brand-divider {
      width: 110px;
      height: 3px;
      margin: 10px auto 8px;
      background: var(--yellow);
      border-radius: 20px;
    }

    .system-th {
      color: var(--navy);
      font-weight: 600;
      font-size: 18px;
    }

    .system-en {
      color: #657187;
      font-weight: 500;
      font-size: 17px;
    }

    .admin-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      background: #fff7d6;
      color: #7c5b00;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
    }

    /* Form */

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 8px;
      color: var(--navy);
    }

    .icon {
      width: 23px;
      height: 23px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      height: 60px;
      border: 1.5px solid var(--border);
      border-radius: 13px;
      padding: 0 18px;
      font-size: 15px;
      color: var(--navy);
      background: white;
      outline: none;
      transition: .2s;
    }

    .input-wrap input:focus {
      border-color: #68a9e3;
      box-shadow: 0 0 0 4px rgba(63, 145, 218, .10);
    }

    .password-input {
      padding-right: 55px !important;
    }

    .eye {
      position: absolute;
      top: 50%;
      right: 16px;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 21px;
      color: #778399;
    }

    .login-btn {
      width: 100%;
      height: 64px;
      margin-top: 4px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      background: linear-gradient(90deg, #ffc400, #ffd42d);
      color: var(--navy);
      font-weight: 700;
      font-size: 20px;
      position: relative;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 10px 22px rgba(255, 196, 0, .20);
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 13px 26px rgba(255, 196, 0, .27);
    }

    .login-btn:disabled {
      opacity: .7;
      cursor: wait;
    }

    .arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 43px;
      height: 43px;
      border-radius: 50%;
      background: var(--navy);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .admin-note {
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--navy);
      font-size: 14px;
      font-weight: 500;
    }

    .admin-note::before,
    .admin-note::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #cad8e7;
    }

    .home-link {
      margin-top: 15px;
      text-align: center;
    }

    .home-link a {
      color: var(--navy);
      font-weight: 600;
      text-decoration: underline;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #b42318;
    }

    .message.success {
      display: block;
      background: #edfdf3;
      color: #087443;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: #99a4b2;
      font-size: 11px;
    }

    /* =========================
       NOTEBOOK / SMALL DESKTOP
       ทำให้ 100% พอดีจอ
    ========================= */

    @media (max-height: 820px) and (min-width: 901px) {

      .card {
        padding-top: 25px;
        padding-bottom: 24px;
      }

      .brand {
        padding-top: 20px;
        margin-bottom: 15px;
      }

      .brand-symbol {
        height: 58px;
        margin-bottom: 8px;
      }

      .brand-symbol span:nth-child(1),
      .brand-symbol span:nth-child(5) {
        height: 29px;
      }

      .brand-symbol span:nth-child(2),
      .brand-symbol span:nth-child(4) {
        height: 43px;
      }

      .brand-symbol span:nth-child(3) {
        height: 58px;
      }

      .brand h1 {
        font-size: 36px;
      }

      .field {
        margin-bottom: 12px;
      }

      .input-wrap input {
        height: 48px;
      }

      .login-btn {
        height: 52px;
      }

      .admin-note {
        margin-top: 15px;
      }

      .footer {
        margin-top: 13px;
      }

      .mascot {
        max-height: 62vh;
      }
    }

    /* =========================
       TABLET / MOBILE
    ========================= */

    @media (max-width: 900px) {

      .page {
        display: block;
      }

      .hero {
        min-height: 590px;
      }

      .hero-copy {
        top: 45px;
        left: 7%;
      }

      .mascot {
        width: 78%;
        max-height: 430px;
      }

      .login-side {
        min-height: auto;
        padding: 45px 20px;
      }

      .card {
        max-width: 650px;
      }
    }

    @media (max-width: 560px) {

      .hero {
        min-height: 510px;
      }

      .hero-copy {
        top: 35px;
        left: 7%;
      }

      .welcome-th {
        font-size: 37px;
      }

      .welcome-en {
        font-size: 32px;
      }

      .slogan-en {
        font-size: 13px;
      }

      .slogan-th {
        font-size: 12px;
      }

      .mascot {
        width: 94%;
        max-height: 350px;
      }

      .login-side {
        padding: 28px 13px;
      }

      .card {
        padding: 34px 22px 28px;
        border-radius: 24px;
      }

      .languages {
        top: 14px;
        right: 14px;
      }

      .brand {
        padding-top: 50px;
      }

      .brand h1 {
        font-size: 34px;
      }

      .input-wrap input {
        height: 55px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- LEFT -->
  <section class="hero">

    <div class="hero-copy">
      <div class="welcome-th" id="welcomeTh">ยินดีต้อนรับ</div>
      <div class="welcome-en">Welcome</div>

      <div class="welcome-line"></div>

      <div class="slogan-en">
        TRUST IN SAFETY.
        <span>TRUST IN SANTE.</span>
      </div>

      <div class="slogan-th">
        เชื่อมั่นในความปลอดภัย
        <span>เชื่อมั่นในซานเต้</span>
      </div>
    </div>

    <div class="wave"></div>
    <div class="skyline"></div>
    <div class="yellow-wave"></div>
    <div class="navy-wave"></div>

    <!-- ภาพที่อัปโหลดไว้ใน GitHub -->
    <img
      class="mascot"
      src="sante-admin-artwork.png"
      alt="SANTE Safety Mascot"
    >

  </section>


  <!-- RIGHT -->
  <section class="login-side">

    <div class="card">

      <div class="languages">
        <button
          class="lang-btn active"
          id="thaiBtn"
          type="button"
          onclick="setLanguage('th')">
          🇹🇭 ไทย
        </button>

        <button
          class="lang-btn"
          id="englishBtn"
          type="button"
          onclick="setLanguage('en')">
          🇬🇧 EN
        </button>
      </div>


      <div class="brand">

        <div class="brand-symbol">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <h1>SANTE SYSTEM</h1>

        <div class="brand-divider"></div>

        <div class="system-th" id="systemTitle">
          ระบบบริหารจัดการ
        </div>

        <div class="system-en">
          SANTE Consulting
        </div>

        <div class="admin-pill">
          ● ADMINISTRATOR
        </div>

      </div>


      <form id="loginForm">

        <div class="field">

          <label for="email">
            <span class="icon">✉</span>
            <span id="emailLabel">อีเมล</span>
          </label>

          <div class="input-wrap">
            <input
              id="email"
              type="email"
              autocomplete="email"
              placeholder="example@santeconsulting.co.th"
              required
            >
          </div>

        </div>


        <div class="field">

          <label for="password">
            <span class="icon">🔒</span>
            <span id="passwordLabel">รหัสผ่าน</span>
          </label>

          <div class="input-wrap">

            <input
              id="password"
              class="password-input"
              type="password"
              autocomplete="current-password"
              placeholder="กรุณากรอกรหัสผ่าน"
              required
            >

            <button
              class="eye"
              type="button"
              id="togglePassword"
              aria-label="แสดงหรือซ่อนรหัสผ่าน">
              ◉
            </button>

          </div>

        </div>


        <button
          id="loginButton"
          class="login-btn"
          type="submit">

          <span id="loginText">เข้าสู่ระบบ</span>

          <span class="arrow">→</span>

        </button>


        <div
          id="message"
          class="message">
        </div>

      </form>


      <div class="admin-note">
        🔒
        <span id="adminText">
          เฉพาะผู้ดูแลระบบเท่านั้น
        </span>
      </div>


      <div class="home-link">
        🏠
        <a href="index.html" id="homeText">
          กลับหน้าหลัก
        </a>
      </div>


      <div class="footer">
        © 2026 SANTE CONSULTING CO., LTD.<br>
        ระบบสำหรับผู้ดูแลระบบเท่านั้น
      </div>

    </div>

  </section>

</div>


<script>
  /* =========================================
     SUPABASE
     Publishable key ใช้ใน browser ได้
     ห้ามใส่ service_role / secret key
  ========================================= */

  const SUPABASE_URL =
    "https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fcyegjwerxlxhczrfiurz.supabase.co%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7Cf72a775bdfb94211897508df21048e67%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265975590445824%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=EmPBoDdm9WRq%2F61p9D7aDYNzmirpCPIXixcty6gVd8c%3D&reserved=0";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Hhr1LDrJqvzdEcHR4cScwA_YA9b9eYF";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================================
     LANGUAGE
  ========================================= */

  let currentLanguage = "th";

  function setLanguage(language) {

    currentLanguage = language;

    const thaiButton =
      document.getElementById("thaiBtn");

    const englishButton =
      document.getElementById("englishBtn");

    thaiButton.classList.toggle(
      "active",
      language === "th"
    );

    englishButton.classList.toggle(
      "active",
      language === "en"
    );


    if (language === "th") {

      document.getElementById("systemTitle")
        .textContent = "ระบบบริหารจัดการ";

      document.getElementById("emailLabel")
        .textContent = "อีเมล";

      document.getElementById("passwordLabel")
        .textContent = "รหัสผ่าน";

      document.getElementById("password")
        .placeholder = "กรุณากรอกรหัสผ่าน";

      document.getElementById("loginText")
        .textContent = "เข้าสู่ระบบ";

      document.getElementById("adminText")
        .textContent = "เฉพาะผู้ดูแลระบบเท่านั้น";

      document.getElementById("homeText")
        .textContent = "กลับหน้าหลัก";

    } else {

      document.getElementById("systemTitle")
        .textContent = "Management System";

      document.getElementById("emailLabel")
        .textContent = "Email";

      document.getElementById("passwordLabel")
        .textContent = "Password";

      document.getElementById("password")
        .placeholder = "Enter your password";

      document.getElementById("loginText")
        .textContent = "Sign In";

      document.getElementById("adminText")
        .textContent = "Administrators only";

      document.getElementById("homeText")
        .textContent = "Back to home";

    }
  }


  /* =========================================
     PASSWORD SHOW / HIDE
  ========================================= */

  document
    .getElementById("togglePassword")
    .addEventListener("click", function () {

      const password =
        document.getElementById("password");

      if (password.type === "password") {

        password.type = "text";
        this.textContent = "○";

      } else {

        password.type = "password";
        this.textContent = "◉";

      }

    });


  /* =========================================
     MESSAGE
  ========================================= */

  function showMessage(text, type) {

    const message =
      document.getElementById("message");

    message.textContent = text;
    message.className = "message " + type;

  }


  /* =========================================
     ADMIN LOGIN
  ========================================= */

  document
    .getElementById("loginForm")
    .addEventListener("submit", async function (event) {

      event.preventDefault();

      const email =
        document.getElementById("email")
          .value
          .trim();

      const password =
        document.getElementById("password")
          .value;

      const button =
        document.getElementById("loginButton");

      const loginText =
        document.getElementById("loginText");


      button.disabled = true;

      loginText.textContent =
        currentLanguage === "th"
          ? "กำลังเข้าสู่ระบบ..."
          : "Signing in...";


      try {

        /* LOGIN */

        const {
          data,
          error
        } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


        if (error) {
          throw error;
        }


        if (!data.user) {
          throw new Error("LOGIN_FAILED");
        }


        /*
          ตรวจสิทธิ์จาก Database จริง
          ไม่ได้ตรวจจากหน้า HTML อย่างเดียว
        */

        const {
          data: staffAllowed,
          error: roleError
        } =
        await supabaseClient.rpc("is_staff");


        if (roleError) {

          await supabaseClient.auth.signOut();

          throw new Error(
            "ไม่สามารถตรวจสอบสิทธิ์ผู้ดูแลระบบได้"
          );

        }


        if (staffAllowed !== true) {

          await supabaseClient.auth.signOut();

          showMessage(
            currentLanguage === "th"
              ? "บัญชีนี้ไม่มีสิทธิ์เข้าสู่ระบบผู้ดูแล"
              : "This account does not have administrator access.",
            "error"
          );

          return;

        }


        showMessage(
          currentLanguage === "th"
            ? "เข้าสู่ระบบสำเร็จ"
            : "Login successful",
          "success"
        );


        /*
          ขั้นต่อไปเราจะสร้าง admin-dashboard.html
        */

        setTimeout(function () {

          window.location.href =
            "admin-dashboard.html";

        }, 500);


      } catch (error) {

        console.error(error);

        showMessage(
          currentLanguage === "th"
            ? "อีเมลหรือรหัสผ่านไม่ถูกต้อง หรือบัญชีไม่มีสิทธิ์เข้าใช้งาน"
            : "Incorrect email/password or unauthorized account.",
          "error"
        );

      } finally {

        button.disabled = false;

        loginText.textContent =
          currentLanguage === "th"
            ? "เข้าสู่ระบบ"
            : "Sign In";

      }

    });


  /* =========================================
     ALREADY LOGGED IN
  ========================================= */

  async function checkExistingSession() {

    const {
      data: { session }
    } =
    await supabaseClient.auth.getSession();


    if (!session) {
      return;
    }


    const {
      data: staffAllowed
    } =
    await supabaseClient.rpc("is_staff");


    if (staffAllowed === true) {

      window.location.href =
        "admin-dashboard.html";

    }

  }


  checkExistingSession();

</script>
