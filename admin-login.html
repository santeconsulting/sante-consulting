<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --navy:#06356c;
    --navy-dark:#032755;
    --navy-deep:#021d42;
    --yellow:#ffc400;
    --yellow-light:#ffd633;
    --white:#ffffff;
    --border:#d5dfeb;
    --muted:#718097;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:"Prompt",sans-serif;
    background:#eef5fc;
    color:var(--navy);
}

/* =========================================
   DESKTOP MAIN SCREEN
========================================= */

.page{
    width:100%;
    height:100vh;
    height:100dvh;

    min-height:620px;

    display:grid;
    grid-template-columns:52% 48%;

    overflow:hidden;
}

/* =========================================
   LEFT
========================================= */

.brand-panel{
    position:relative;
    height:100%;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 25% 10%,
            rgba(34,112,190,.60),
            transparent 37%
        ),
        linear-gradient(
            145deg,
            #0b5599 0%,
            #063b75 44%,
            #032959 75%,
            #021d42 100%
        );
}

/* subtle background shapes */

.brand-panel::before{
    content:"";
    position:absolute;

    width:700px;
    height:700px;

    left:-400px;
    top:-430px;

    border-radius:50%;

    background:
        rgba(255,255,255,.035);
}

.brand-panel::after{
    content:"";
    position:absolute;

    width:650px;
    height:650px;

    left:-380px;
    bottom:-480px;

    border-radius:50%;

    border:
        1px solid rgba(255,255,255,.08); }


/* =========================================
   WELCOME TEXT
========================================= */

.welcome-area{
    position:absolute;

    z-index:10;

    top:6vh;
    left:7%;
    right:7%;

    text-align:center;
}

.welcome-th{
    color:white;

    font-size:
        clamp(30px,3.2vw,57px);

    font-weight:700;

    line-height:1.05;
}

.welcome-en{
    margin-top:2px;

    color:var(--yellow);

    font-size:
        clamp(27px,3vw,52px);

    font-weight:700;

    line-height:1.05;
}

.welcome-line{
    width:92px;
    height:4px;

    margin:
        clamp(10px,1.5vh,17px)
        auto
        clamp(10px,1.4vh,16px);

    border-radius:20px;

    background:var(--yellow);
}

.slogan{
    color:white;

    font-size:
        clamp(14px,1.5vw,24px);

    font-weight:600;

    line-height:1.4;

    white-space:nowrap;
}

.slogan-yellow{
    color:var(--yellow);
}

.slogan-thai{
    margin-top:3px;

    color:white;

    font-size:
        clamp(13px,1.25vw,20px);

    font-weight:400;

    line-height:1.5;
}

.slogan-thai .highlight{
    color:var(--yellow);
    font-weight:500;
}


/* =========================================
   LEFT DECORATION
========================================= */

.white-wave{
    position:absolute;

    z-index:1;

    left:-12%;
    width:125%;

    bottom:9%;

    height:51%;

    border-radius:
        50% 50% 0 0 /
        20% 20% 0 0;

    background:
        linear-gradient(
            180deg,
            #f8fcff,
            #eaf5ff
        );

    transform:rotate(-3deg);
}

.yellow-wave{
    position:absolute;

    z-index:2;

    left:-8%;
    bottom:4%;

    width:125%;
    height:18px;

    border-radius:50%;

    background:var(--yellow);

    transform:rotate(5deg);
}

.bottom-navy{
    position:absolute;

    z-index:1;

    left:-10%;
    bottom:-13%;

    width:125%;
    height:28%;

    background:#06366c;

    border-radius:50% 50% 0 0;

    transform:rotate(3deg);
}


/* factory silhouette */

.factory{
    position:absolute;

    z-index:2;

    left:0;
    right:0;

    bottom:18%;

    height:20%;

    opacity:.22;

    background:
        linear-gradient(
            to top,
            rgba(45,135,210,.85),
            rgba(45,135,210,0)
        );

    clip-path:polygon(
        0 100%,
        0 60%,
        4% 60%,
        4% 20%,
        7% 20%,
        7% 72%,
        11% 72%,
        11% 42%,
        14% 42%,
        14% 76%,
        20% 76%,
        20% 30%,
        23% 30%,
        23% 80%,
        31% 80%,
        31% 50%,
        35% 50%,
        35% 80%,
        43% 80%,
        43% 35%,
        47% 35%,
        47% 77%,
        54% 77%,
        54% 58%,
        59% 58%,
        59% 82%,
        67% 82%,
        67% 28%,
        71% 28%,
        71% 76%,
        77% 76%,
        77% 46%,
        81% 46%,
        81% 82%,
        88% 82%,
        88% 34%,
        92% 34%,
        92% 73%,
        100% 73%,
        100% 100%
    );
}


/* =========================================
   MASCOT
========================================= */

.artwork-wrap{
    position:absolute;

    z-index:5;

    left:0;
    right:0;

    bottom:0;

    height:67%;

    display:flex;

    align-items:flex-end;
    justify-content:center;

    pointer-events:none;
}

.artwork{
    display:block;

    width:auto;
    height:100%;

    max-width:96%;

    object-fit:contain;
    object-position:center bottom;
}


/* =========================================
   RIGHT PANEL
========================================= */

.login-panel{
    position:relative;

    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:
        clamp(18px,3vh,38px)
        clamp(22px,4vw,65px);

    overflow:hidden;

    background:
        radial-gradient(
            circle at 100% 20%,
            rgba(65,135,210,.12),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #ffffff,
            #f4f9ff
        );
}


/* yellow / navy corner */

.login-panel::before{
    content:"";

    position:absolute;

    width:500px;
    height:25px;

    top:-3px;
    right:-130px;

    background:var(--yellow);

    transform:rotate(-40deg);
}

.login-panel::after{
    content:"";

    position:absolute;

    width:540px;
    height:38px;

    top:17px;
    right:-170px;

    background:var(--navy);

    transform:rotate(-40deg);
}


/* =========================================
   LOGIN CARD
========================================= */

.login-card{
    position:relative;

    z-index:5;

    width:min(100%,650px);

    max-height:calc(100dvh - 36px);

    padding:
        clamp(17px,2.2vh,28px)
        clamp(28px,3.4vw,52px)
        clamp(18px,2.5vh,32px);

    background:
        rgba(255,255,255,.98);

    border-radius:30px;

    border:
        1px solid rgba(255,255,255,.9);

    box-shadow:
        0 24px 65px rgba(4,48,97,.13);

    overflow:auto;

    scrollbar-width:none;
}

.login-card::-webkit-scrollbar{
    display:none;
}


/* =========================================
   LANGUAGE
========================================= */

.language-row{
    display:flex;
    justify-content:flex-end;
}

.language-switch{
    display:inline-flex;

    padding:4px;

    gap:2px;

    border-radius:30px;

    background:#f0f4f9;
}

.lang-btn{
    border:0;

    padding:7px 14px;

    border-radius:25px;

    background:transparent;

    color:#536176;

    font-family:"Prompt",sans-serif;

    font-size:14px;

    cursor:pointer;
}

.lang-btn.active{
    background:var(--navy);
    color:white;
}


/* =========================================
   SANTE LOGO
========================================= */

.card-logo{
    text-align:center;
}

.mini-symbol{
    height:
        clamp(58px,8.5vh,90px);

    display:flex;

    justify-content:center;
    align-items:center;

    gap:7px;

    margin:
        clamp(3px,.8vh,8px)
        0
        clamp(5px,.7vh,8px);
}

.mini-symbol span{
    display:block;

    width:
        clamp(13px,1.3vw,19px);

    border-radius:20px;

    background:
        linear-gradient(
            180deg,
            #ffd83d,
            #ffbe00
        );
}

.mini-symbol span:nth-child(1),
.mini-symbol span:nth-child(5){
    height:45%;
}

.mini-symbol span:nth-child(2),
.mini-symbol span:nth-child(4){
    height:68%;
}

.mini-symbol span:nth-child(3){
    height:100%;
}

.system-title{
    color:var(--navy);

    font-size:
        clamp(31px,3vw,48px);

    line-height:1;

    font-weight:800;

    letter-spacing:.3px;
}

.title-line{
    width:120px;
    height:3px;

    background:var(--yellow);

    margin:
        clamp(6px,.8vh,10px)
        auto;
}

.system-subtitle{
    color:var(--navy);

    font-size:
        clamp(15px,1.3vw,19px);

    font-weight:600;

    line-height:1.35;
}

.system-subtitle-en{
    color:#53647b;

    font-size:
        clamp(14px,1.2vw,18px);

    font-weight:500;
}


/* =========================================
   FORM
========================================= */

.login-form{
    margin-top:
        clamp(12px,1.8vh,22px);
}

.field{
    margin-bottom:
        clamp(10px,1.5vh,17px);
}

.field-label{
    display:flex;

    align-items:center;

    gap:9px;

    margin-bottom:
        clamp(5px,.7vh,8px);

    color:var(--navy);

    font-size:
        clamp(14px,1.1vw,17px);

    font-weight:600;
}

.field-icon{
    width:24px;
    height:24px;

    display:flex;

    align-items:center;
    justify-content:center;
}

.field-icon svg{
    width:23px;
    height:23px;

    fill:none;

    stroke:var(--navy);

    stroke-width:2;
}

.input-wrap{
    position:relative;
}

.form-input{
    width:100%;

    height:
        clamp(48px,6.4vh,61px);

    padding:0 17px;

    border:
        1.5px solid #cad6e5;

    border-radius:11px;

    outline:none;

    background:white;

    color:#173b68;

    font-family:"Prompt",sans-serif;

    font-size:
        clamp(14px,1vw,16px);
}

.form-input:focus{
    border-color:var(--navy);

    box-shadow:
        0 0 0 4px
        rgba(5,55,111,.07);
}

.form-input::placeholder{
    color:#9ba7b7;
}

.password-input{
    padding-right:58px;
}

.toggle-password{
    position:absolute;

    right:10px;
    top:50%;

    transform:translateY(-50%);

    width:42px;
    height:42px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:0;

    background:transparent;

    cursor:pointer;
}

.toggle-password svg{
    width:25px;
    height:25px;

    fill:none;

    stroke:#64758c;

    stroke-width:2;
}


/* =========================================
   LOGIN BUTTON
========================================= */

.login-btn{
    position:relative;

    width:100%;

    height:
        clamp(52px,6.7vh,64px);

    margin-top:2px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            90deg,
            #ffd21d,
            #ffbd00
        );

    color:var(--navy-dark);

    font-family:"Prompt",sans-serif;

    font-size:
        clamp(17px,1.4vw,21px);

    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 9px 22px
        rgba(255,190,0,.20);
}

.login-btn:hover{
    transform:translateY(-1px);
}

.login-btn:disabled{
    opacity:.7;
    cursor:not-allowed;
    transform:none;
}

.login-arrow{
    position:absolute;

    right:11px;
    top:50%;

    transform:translateY(-50%);

    width:
        clamp(38px,4.4vh,46px);

    height:
        clamp(38px,4.4vh,46px);

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:var(--navy);

    color:white;

    font-size:24px;
}


/* =========================================
   MESSAGE
========================================= */

.message{
    display:none;

    margin-top:10px;

    padding:9px 12px;

    border-radius:9px;

    text-align:center;

    font-size:13px;
}

.message.error{
    display:block;

    color:#a22626;

    background:#fff0f0;

    border:1px solid #ffd1d1;
}

.message.success{
    display:block;

    color:#176438;

    background:#effbf3;

    border:1px solid #c9efd6;
}


/* =========================================
   ADMIN ONLY
========================================= */

.admin-only{
    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    margin-top:
        clamp(11px,1.5vh,19px);

    color:#314c70;

    font-size:
        clamp(12px,1vw,15px);

    font-weight:500;
}

.admin-only::before,
.admin-only::after{
    content:"";

    flex:1;

    height:1px;

    background:#cad6e4;
}


/* =========================================
   HOME
========================================= */

.home-link{
    margin-top:
        clamp(8px,1.2vh,15px);

    text-align:center;
}

.home-link a{
    color:var(--navy);

    font-size:
        clamp(13px,1vw,16px);

    font-weight:600;

    text-decoration:underline;
}

.home-icon{
    margin-right:5px;

    text-decoration:none;
}

.copyright{
    margin-top:
        clamp(9px,1.2vh,15px);

    color:#9aa6b4;

    text-align:center;

    font-size:10px;

    line-height:1.4;
}


/* =========================================
   SHORT LAPTOP SCREENS
   IMPORTANT: fixes 100% browser zoom
========================================= */

@media (min-width:761px) and (max-height:760px){

    .page{
        min-height:560px;
    }

    .welcome-area{
        top:4vh;
    }

    .welcome-th{
        font-size:36px;
    }

    .welcome-en{
        font-size:32px;
    }

    .slogan{
        font-size:16px;
    }

    .slogan-thai{
        font-size:14px;
    }

    .artwork-wrap{
        height:64%;
    }

    .login-card{
        padding:
            15px
            38px
            17px;

        border-radius:24px;
    }

    .mini-symbol{
        height:55px;
    }

    .system-title{
        font-size:32px;
    }

    .title-line{
        margin:5px auto;
    }

    .system-subtitle{
        font-size:14px;
    }

    .system-subtitle-en{
        font-size:13px;
    }

    .login-form{
        margin-top:10px;
    }

    .field{
        margin-bottom:8px;
    }

    .field-label{
        margin-bottom:4px;
        font-size:13px;
    }

    .form-input{
        height:44px;
        font-size:13px;
    }

    .login-btn{
        height:47px;
        font-size:16px;
    }

    .login-arrow{
        width:34px;
        height:34px;
        font-size:20px;
    }

    .admin-only{
        margin-top:8px;
        font-size:11px;
    }

    .home-link{
        margin-top:6px;
    }

    .home-link a{
        font-size:12px;
    }

    .copyright{
        margin-top:6px;
        font-size:9px;
    }
}


/* =========================================
   TABLET
========================================= */

@media (max-width:1000px) and (min-width:761px){

    .page{
        grid-template-columns:45% 55%;
    }

    .welcome-th{
        font-size:35px;
    }

    .welcome-en{
        font-size:31px;
    }

    .slogan{
        font-size:14px;
        white-space:normal;
    }

    .slogan-thai{
        font-size:13px;
    }

    .artwork-wrap{
        height:60%;
    }

    .login-panel{
        padding:20px;
    }
}


/* =========================================
   MOBILE
========================================= */

@media (max-width:760px){

    html,
    body{
        overflow:auto;
    }

    .page{
        display:block;

        height:auto;

        min-height:100dvh;

        overflow:visible;
    }

    .brand-panel{
        height:420px;
    }

    .welcome-area{
        top:25px;
    }

    .welcome-th{
        font-size:31px;
    }

    .welcome-en{
        font-size:27px;
    }

    .welcome-line{
        width:65px;
        height:3px;
        margin:8px auto;
    }

    .slogan{
        font-size:13px;
        white-space:normal;
    }

    .slogan-thai{
        font-size:12px;
    }

    .white-wave{
        bottom:8%;
        height:47%;
    }

    .artwork-wrap{
        height:60%;
    }

    .artwork{
        max-width:86%;
    }

    .login-panel{
        height:auto;

        min-height:auto;

        padding:
            22px
            13px
            30px;

        overflow:visible;
    }

    .login-panel::before,
    .login-panel::after{
        display:none;
    }

    .login-card{
        max-height:none;

        overflow:visible;

        padding:
            20px
            19px
            25px;

        border-radius:23px;
    }

    .mini-symbol{
        height:65px;
    }

    .system-title{
        font-size:31px;
    }

    .system-subtitle{
        font-size:15px;
    }

    .system-subtitle-en{
        font-size:14px;
    }

    .login-form{
        margin-top:20px;
    }

    .form-input{
        height:55px;
    }

    .login-btn{
        height:57px;
    }
}

</style>
</head>


<body>

<div class="page">


<!-- ======================================
     LEFT
======================================= -->

<section class="brand-panel">

    <div class="welcome-area">

        <div
            class="welcome-th"
            data-th="ยินดีต้อนรับ"
            data-en="Welcome"
        >
            ยินดีต้อนรับ
        </div>

        <div
            class="welcome-en"
            data-th="Welcome"
            data-en="SANTE SYSTEM"
        >
            Welcome
        </div>

        <div class="welcome-line"></div>


        <div class="slogan">

            TRUST IN SAFETY.
            <span class="slogan-yellow">
                TRUST IN SANTE.
            </span>

        </div>


        <div

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fcyegjwerxlxhczrfiurz.supabase.co%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7C6341282af7fc4fed304908df2102ade2%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265967536052656%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=rR7CRtkQHvpQG23D7bSo2JVPrNA7qo5KCf5rSm1HBvU%3D&reserved=0";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_Hhr1LDrJqvzdEcHR4cScwA_YA9b9eYF";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);



/* =========================================
   LANGUAGE
========================================= */

let currentLanguage = "th";


function setLanguage(language){

    currentLanguage = language;


    document
    .getElementById("thaiButton")
    .classList.toggle(
        "active",
        language === "th"
    );


    document
    .getElementById("englishButton")
    .classList.toggle(
        "active",
        language === "en"
    );


    document
    .querySelectorAll("[data-th]")
    .forEach(element => {

        element.innerHTML =
        element.getAttribute(
            language === "th"
            ? "data-th"
            : "data-en"
        );

    });


    document
    .getElementById("password")
    .placeholder =
        language === "th"
        ? "กรุณากรอกรหัสผ่าน"
        : "Enter your password";

}



/* =========================================
   PASSWORD
========================================= */

function togglePassword(){

    const password =
    document.getElementById("password");


    password.type =
        password.type === "password"
        ? "text"
        : "password";

}



/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

    const message =
    document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;

}


function clearMessage(){

    const message =
    document.getElementById("message");

    message.textContent = "";

    message.className =
        "message";

}



/* =========================================
   LOGIN
========================================= */

document
.getElementById("loginForm")
.addEventListener(
"submit",
async function(event){

    event.preventDefault();

    clearMessage();


    const email =
    document
    .getElementById("email")
    .value
    .trim();


    const password =
    document
    .getElementById("password")
    .value;


    const loginButton =
    document.getElementById(
        "loginButton"
    );


    const loginButtonText =
    document.getElementById(
        "loginButtonText"
    );


    loginButton.disabled = true;


    loginButtonText.textContent =
        currentLanguage === "th"
        ? "กำลังเข้าสู่ระบบ..."
        : "Signing in...";


    try{


        /* AUTH */

        const {
            data,
            error
        } =
        await supabaseClient.auth
        .signInWithPassword({
            email,
            password
        });


        if(error){
            throw error;
        }


        if(!data.user){
            throw new Error(
                "USER_NOT_FOUND"
            );
        }



        /* STAFF CHECK */

        const {
            data:staffAccess,
            error:staffError
        } =
        await supabaseClient.rpc(
            "is_staff"
        );


        if(staffError){

            await supabaseClient.auth
            .signOut();

            throw staffError;

        }


        if(staffAccess !== true){

            await supabaseClient.auth
            .signOut();


            showMessage(

                currentLanguage === "th"

                ? "บัญชีนี้ไม่มีสิทธิ์เข้าถึงระบบผู้ดูแล"

                : "This account does not have administrator access.",

                "error"

            );

            return;

        }



        /* SUCCESS */

        showMessage(

            currentLanguage === "th"
            ? "เข้าสู่ระบบสำเร็จ"
            : "Login successful",

            "success"

        );


        setTimeout(
            function(){

                window.location.href =
                    "admin.html";

            },
            400
        );


    }

    catch(error){

        console.error(error);


        let text;


        if(
            error.message &&
            error.message
            .toLowerCase()
            .includes("invalid login")
        ){

            text =
                currentLanguage === "th"
                ? "อีเมลหรือรหัสผ่านไม่ถูกต้อง"
                : "Invalid email or password";

        }

        else{

            text =
                currentLanguage === "th"
                ? "ไม่สามารถเข้าสู่ระบบได้ กรุณาลองใหม่อีกครั้ง"
                : "Unable to sign in. Please try again.";

        }


        showMessage(
            text,
            "error"
        );

    }

    finally{

        loginButton.disabled = false;


        loginButtonText.textContent =
            currentLanguage === "th"
            ? "เข้าสู่ระบบ"
            : "Sign In";

    }

}
);



/* =========================================
   EXISTING SESSION
========================================= */

async function checkExistingSession(){

    const {data} =
    await supabaseClient.auth
    .getSession();


    if(
        data &&
        data.session
    ){

        const {
            data:staffAccess
        } =
        await supabaseClient.rpc(
            "is_staff"
        );


        if(staffAccess === true){

            window.location.href =
                "admin.html";

        }

    }

}


checkExistingSession();

</script>
