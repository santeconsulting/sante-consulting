  <style>
    :root {
      --navy: #082b55;
      --navy-dark: #051f3e;
      --yellow: #ffc400;
      --yellow-dark: #f4b800;
      --white: #ffffff;
      --text: #172033;
      --muted: #718096;
      --border: #dce2ea;
      --error: #c62828;
      --success: #16803c;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Prompt", sans-serif;
      background: #f5f7fa;
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
    }

    /* =========================
       LEFT BRAND AREA
    ========================== */

    .brand-panel {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 30% 30%,
          #12487f 0%,
          var(--navy) 45%,
          var(--navy-dark) 100%
        );

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px;
    }

    .brand-panel::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(255, 196, 0, 0.08);
      top: -170px;
      left: -130px;
    }

    .brand-panel::after {
      content: "";
      position: absolute;
      width: 330px;
      height: 330px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      right: -120px;
      bottom: -120px;
    }

    .brand-content {
      width: 100%;
      max-width: 820px;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .brand-image {
      width: 100%;
      max-width: 760px;
      max-height: 72vh;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 20px 30px rgba(0,0,0,.22));
    }

    .brand-tagline {
      margin-top: 12px;
      color: rgba(255,255,255,.92);
      font-size: 17px;
      font-weight: 400;
    }

    .brand-tagline strong {
      color: var(--yellow);
      font-weight: 600;
    }

    /* =========================
       LOGIN AREA
    ========================== */

    .login-panel {
      position: relative;
      background: var(--white);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 50px 55px;
    }

    .language-switch {
      position: absolute;
      top: 28px;
      right: 34px;

      display: flex;
      align-items: center;
      gap: 6px;

      background: #f4f6f9;
      padding: 5px;
      border-radius: 10px;
    }

    .language-switch button {
      border: none;
      background: transparent;
      color: #718096;

      font-family: "Prompt", sans-serif;
      font-size: 13px;
      font-weight: 500;

      padding: 7px 11px;
      border-radius: 7px;

      cursor: pointer;
      transition: .2s;
    }

    .language-switch button.active {
      background: var(--navy);
      color: white;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .mobile-logo {
      display: none;
    }

    .system-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      color: var(--navy);
      background: #f0f5fa;

      border-radius: 30px;
      padding: 7px 13px;

      font-size: 12px;
      font-weight: 600;

      margin-bottom: 22px;
    }

    .system-label span {
      width: 8px;
      height: 8px;
      background: var(--yellow);
      border-radius: 50%;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: 36px;
      font-weight: 700;
      line-height: 1.25;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      margin: 10px 0 30px;
      line-height: 1.7;
    }

    /* FORM */

    .field {
      margin-bottom: 19px;
    }

    label {
      display: block;
      margin-bottom: 8px;

      color: #344054;
      font-size: 14px;
      font-weight: 500;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 52px;

      border: 1px solid var(--border);
      border-radius: 10px;

      padding: 0 15px;

      font-family: "Prompt", sans-serif;
      font-size: 15px;
      color: var(--text);

      background: #fff;

      transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(8,43,85,.08);
    }

    input::placeholder {
      color: #a0a9b7;
    }

    .password-input {
      padding-right: 68px;
    }

    .show-password {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);

      border: none;
      background: transparent;

      color: var(--navy);
      font-family: "Prompt", sans-serif;
      font-size: 12px;
      font-weight: 600;

      padding: 8px;

      cursor: pointer;
    }

    .login-button {
      width: 100%;
      height: 54px;

      margin-top: 7px;

      border: none;
      border-radius: 10px;

      background: var(--yellow);
      color: var(--navy-dark);

      font-family: "Prompt", sans-serif;
      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      box-shadow: 0 8px 20px rgba(255,196,0,.20);

      transition:
        transform .15s,
        background .2s,
        opacity .2s;
    }

    .login-button:hover {
      background: var(--yellow-dark);
      transform: translateY(-1px);
    }

    .login-button:disabled {
      cursor: wait;
      opacity: .65;
      transform: none;
    }

    #message {
      display: none;

      margin-top: 17px;
      padding: 11px 13px;

      border-radius: 8px;

      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    #message.error {
      display: block;
      background: #fff1f1;
      color: var(--error);
    }

    #message.success {
      display: block;
      background: #edf9f1;
      color: var(--success);
    }

    .back-home {
      display: block;

      margin-top: 25px;

      color: #7b8798;
      text-decoration: none;

      text-align: center;
      font-size: 13px;
    }

    .back-home:hover {
      color: var(--navy);
    }

    .footer {
      margin-top: 42px;

      color: #a0a8b4;
      font-size: 11px;
      text-align: center;
      line-height: 1.7;
    }

    /* =========================
       TABLET
    ========================== */

    @media (max-width: 1024px) {

      .page {
        grid-template-columns: 1fr 1fr;
      }

      .brand-panel {
        padding: 30px 20px;
      }

      .brand-image {
        max-height: 60vh;
      }

      .login-panel {
        padding: 45px 35px;
      }

      h1 {
        font-size: 31px;
      }

    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 760px) {

      .page {
        display: block;
        min-height: 100vh;
      }

      .brand-panel {
        display: none;
      }

      .login-panel {
        min-height: 100vh;

        align-items: flex-start;

        padding:
          max(80px, env(safe-area-inset-top))
          22px
          35px;
      }

      .language-switch {
        top: 20px;
        right: 20px;
      }

      .login-container {
        max-width: 480px;
        margin: 0 auto;
      }

      .mobile-logo {
        display: block;
        width: 180px;
        max-height: 150px;
        object-fit: contain;
        margin: 0 auto 22px;
      }

      .system-label {
        margin-bottom: 17px;
      }

      h1 {
        font-size: 29px;
      }

      .subtitle {
        margin-bottom: 25px;
      }

      .footer {
        margin-top: 30px;
      }

    }

    @media (max-width: 390px) {

      .login-panel {
        padding-left: 17px;
        padding-right: 17px;
      }

      h1 {
        font-size: 26px;
      }

      .mobile-logo {
        width: 155px;
      }

    }
  </style>
</head>

<body>

<div class="page">

  <!-- LEFT SIDE -->
  <section class="brand-panel">

    <div class="brand-content">

      <img
        src="sante-admin-artwork.png"

        class="brand-image"
      >

      <div class="brand-tagline" data-i18n="tagline">

        ผู้เชี่ยวชาญด้านความปลอดภัย อาชีวอนามัย และสิ่งแวดล้อม
      </div>

    </div>

  </section>


  <!-- LOGIN SIDE -->
  <main class="login-panel">

    <!-- LANGUAGE -->
    <div class="language-switch">

      <button
        type="button"
        id="langTH"
        class="active"
      >
        ไทย
      </button>

      <button
        type="button"
        id="langEN"
      >
        EN
      </button>

    </div>


    <div class="login-container">

      <!-- Mobile artwork -->
      <img
        src="sante-admin-artwork.png"
        alt="SANTE"
        class="mobile-logo"
      >


      <div class="system-label">
        <span></span>
        SANTE SYSTEM
      </div>


      <h1 data-i18n="heading">
        เข้าสู่ระบบผู้ดูแล
      </h1>


      <p
        class="subtitle"
        data-i18n="subtitle"
      >
        ระบบบริหารจัดการ SANTE Consulting
      </p>


      <form id="loginForm">

        <div class="field">

          <label
            for="email"
            data-i18n="emailLabel"
          >
            อีเมล
          </label>

          <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="name@company.com"

          >

        </div>


        <div class="field">

            for="password"

          >

          </label>


          <div class="input-wrap">

            <input
              id="password"
              class="password-input"
              type="password"
              autocomplete="current-password"

            >

              id="showPassword"

              type="button"

              แสดง
            </button>

          </div>

        </div>


        <button
          id="loginButton"
          class="login-button"
          type="submit"
          data-i18n="login"
        >
          เข้าสู่ระบบ
        </button>


        <div id="message"></div>

      </form>


      <a
        href="index.html"
        class="back-home"

        ← กลับสู่เว็บไซต์หลัก

      <div class="footer">

        © 2026 SANTE CONSULTING CO., LTD.<br>

        <span data-i18n="security">

        </span>

      </div>

    </div>

  </main>

</div>


<script>

  /* ======================================
     SUPABASE
  ====================================== */

  const SUPABASE_URL =
    "https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fcyegjwerxlxhczrfiurz.supabase.co%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7Ce332adc7cddd483016e308df20ffd18a%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265955248272729%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=lLliYq2MgH1BEb2aAORC%2FZ7c83n8Y1yaMskjAIkvwT8%3D&reserved=0";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Hhr1LDrJqvzdEcHR4cScwA_YA9b9eYF";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* ======================================
     LANGUAGE
  ====================================== */

  const translations = {

    th: {

      tagline:
        "<strong>Trust in SANTE.</strong> ผู้เชี่ยวชาญด้านความปลอดภัย อาชีวอนามัย และสิ่งแวดล้อม",

      heading:
        "เข้าสู่ระบบผู้ดูแล",

      subtitle:
        "ระบบบริหารจัดการ SANTE Consulting",

      emailLabel:
        "อีเมล",

      passwordLabel:
        "รหัสผ่าน",

      show:
        "แสดง",

      hide:
        "ซ่อน",

      login:
        "เข้าสู่ระบบ",

      loggingIn:
        "กำลังเข้าสู่ระบบ...",

      back:
        "← กลับสู่เว็บไซต์หลัก",

      security:
        "สำหรับผู้ได้รับอนุญาตเท่านั้น",

      loginSuccess:
        "เข้าสู่ระบบสำเร็จ",

      noPermission:
        "บัญชีนี้ไม่มีสิทธิ์เข้าสู่ระบบผู้ดูแล",

      roleError:
        "ไม่สามารถตรวจสอบสิทธิ์ผู้ดูแลระบบได้",

      loginError:
        "อีเมลหรือรหัสผ่านไม่ถูกต้อง"

    },


    en: {

      tagline:
        "<strong>Trust in SANTE.</strong> Specialists in Safety, Occupational Health and Environment",

      heading:
        "Admin Login",

      subtitle:
        "SANTE Consulting Management System",

      emailLabel:
        "Email",

      passwordLabel:
        "Password",

      show:
        "Show",

      hide:
        "Hide",

      login:
        "Sign in",

      loggingIn:
        "Signing in...",

      back:
        "← Back to main website",

      security:
        "Authorized personnel only",

      loginSuccess:
        "Login successful",

      noPermission:
        "This account does not have administrator access",

      roleError:
        "Unable to verify administrator permissions",

      loginError:
        "Invalid email or password"

    }

  };


  let currentLanguage = "th";


  const langTH =
    document.getElementById("langTH");

  const langEN =
    document.getElementById("langEN");


  function setLanguage(language) {

    currentLanguage = language;

    document.documentElement.lang =
      language === "th" ? "th" : "en";


    document
      .querySelectorAll("[data-i18n]")
      .forEach(element => {

        const key =
          element.dataset.i18n;

        if (
          translations[language][key]
          !== undefined
        ) {

          if (key === "tagline") {

            element.innerHTML =
              translations[language][key];

          } else {

            element.textContent =
              translations[language][key];

          }

        }

      });


    langTH.classList.toggle(
      "active",
      language === "th"
    );

    langEN.classList.toggle(
      "active",
      language === "en"
    );


    updatePasswordButton();

  }


  langTH.addEventListener(
    "click",
    () => setLanguage("th")
  );


  langEN.addEventListener(
    "click",
    () => setLanguage("en")
  );


  /* ======================================
     PASSWORD SHOW / HIDE
  ====================================== */

  const passwordInput =
    document.getElementById("password");

  const showPasswordButton =
    document.getElementById("showPassword");


  function updatePasswordButton() {

    const visible =
      passwordInput.type === "text";

    showPasswordButton.textContent =
      visible
        ? translations[currentLanguage].hide
        : translations[currentLanguage].show;

  }


  showPasswordButton.addEventListener(
    "click",
    () => {

      passwordInput.type =
        passwordInput.type === "password"
          ? "text"
          : "password";

      updatePasswordButton();

    }
  );


  /* ======================================
     MESSAGE
  ====================================== */

  const message =
    document.getElementById("message");


  function showMessage(text, type) {

    message.textContent = text;
    message.className = type;

  }


  function clearMessage() {

    message.textContent = "";
    message.className = "";

  }


  /* ======================================
     LOGIN
  ====================================== */

  const loginForm =
    document.getElementById("loginForm");

  const loginButton =
    document.getElementById("loginButton");


  loginForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      clearMessage();


      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        passwordInput.value;


      loginButton.disabled = true;

      loginButton.textContent =
        translations[currentLanguage]
          .loggingIn;


      try {

        /*
          Login with Supabase Auth
        */

        const {
          data,
          error
        } =
          await supabaseClient
            .auth
            .signInWithPassword({
              email,
              password
            });


        if (error) {

          throw new Error(
            translations[currentLanguage]
              .loginError
          );

        }


        if (!data.user) {

          throw new Error(
            translations[currentLanguage]
              .loginError
          );

        }


        /*
          Verify permission from database.

          is_staff() is authoritative.
          Do NOT authorize based on email.
        */

        const {
          data: staffAllowed,
          error: roleError
        } =
          await supabaseClient
            .rpc("is_staff");


        if (roleError) {

          await supabaseClient
            .auth
            .signOut();

          throw new Error(
            translations[currentLanguage]
              .roleError
          );

        }


        if (staffAllowed !== true) {

          await supabaseClient
            .auth
            .signOut();

          throw new Error(
            translations[currentLanguage]
              .noPermission
          );

        }


        showMessage(
          translations[currentLanguage]
            .loginSuccess,
          "success"
        );


        /*
          Dashboard file will be created next.
        */

        setTimeout(() => {

          window.location.href =
            "admin.html";

        }, 500);


      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          translations[currentLanguage]
            .loginError,
          "error"
        );

      } finally {

        loginButton.disabled = false;

        loginButton.textContent =
          translations[currentLanguage]
            .login;

      }

    }
  );


  /* ======================================
     EXISTING SESSION
  ====================================== */

  async function checkExistingSession() {

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .getSession();


      if (error || !data.session) {
        return;
      }


      const {
        data: staffAllowed,
        error: roleError
      } =
        await supabaseClient
          .rpc("is_staff");


      if (
        !roleError &&
        staffAllowed === true
      ) {

        window.location.href =
          "admin.html";

      } else {

        await supabaseClient
          .auth
          .signOut();

      }

    } catch (error) {

      console.error(
        "Session check error:",
        error
      );

    }

  }
