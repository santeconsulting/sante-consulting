<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SANTE SYSTEM | Admin Login</title>

  <!-- Prompt Font -->
  <link rel="preconnect" href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Ffonts.googleapis.com%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7Cc1bfca988e3f45c36f8708df2103a5a3%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265971712937827%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=yRkzVCBDbi9P%2Bw%2BBhN%2FZSOfAHxmmOANI9xVucMZfmws%3D&reserved=0">
  <link rel="preconnect" href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Ffonts.gstatic.com%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7Cc1bfca988e3f45c36f8708df2103a5a3%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265971712957124%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=vH7Fm000XzLSedA%2Bd2AP5ef4CgTyM6bMnxZ2s6QfOrI%3D&reserved=0" crossorigin>
  <link href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Ffonts.googleapis.com%2Fcss2%3Ffamily%3DPrompt%3Awght%40300%3B400%3B500%3B600%3B700%26display%3Dswap&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7Cc1bfca988e3f45c36f8708df2103a5a3%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265971712969916%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=70hikt880hQOfwtBYIjrKkwmI31n2GR57eDG%2FHwMpdk%3D&reserved=0" rel="stylesheet">

  <!-- Supabase -->
  <script src="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fcdn.jsdelivr.net%2Fnpm%2F%40supabase%2Fsupabase-js%402&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7Cc1bfca988e3f45c36f8708df2103a5a3%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265971712982832%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=6oxRnj4c%2FjLMW%2FUC5ccRBuoZgotilDSgAvjQzqjlYcw%3D&reserved=0"></script>

  <style>
    :root {
      --navy: #062c5e;
      --navy-dark: #031f43;
      --navy-light: #0d4d8b;
      --yellow: #ffc400;
      --yellow-light: #ffd94d;
      --white: #ffffff;
      --soft-bg: #f4f8fc;
      --text: #092d5c;
      --muted: #6f7f92;
      --border: #d9e2ec;
      --danger: #c62828;
      --success: #15803d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: "Prompt", sans-serif;
      background: #f5f8fc;
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(460px, 0.95fr);
      overflow: hidden;
    }

    /* =========================
       LEFT / BRAND SIDE
    ========================== */

    .brand-panel {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(35, 116, 188, 0.55),
          transparent 34%
        ),
        linear-gradient(
          145deg,
          #073b76 0%,
          #052e61 48%,
          #031f43 100%
        );
    }

    .brand-panel::before {
      content: "";
      position: absolute;
      width: 430px;
      height: 430px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      left: -170px;
      top: 110px;
    }

    .brand-panel::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border: 1px solid rgba(255, 196, 0, 0.10);
      border-radius: 50%;
      right: -130px;
      top: -90px;
    }

    .brand-copy {
      position: relative;
      z-index: 5;
      padding: clamp(28px, 4.2vh, 48px)
               clamp(32px, 5vw, 74px)
               10px;
      color: white;
    }

    .welcome-th {
      font-size: clamp(27px, 2.5vw, 42px);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.4px;
    }

    .welcome-en {
      margin-top: 2px;
      font-size: clamp(20px, 1.8vw, 30px);
      color: var(--yellow);
      font-weight: 500;
    }

    .motto-en {
      margin-top: clamp(14px, 2vh, 22px);
      font-size: clamp(16px, 1.35vw, 22px);
      font-weight: 600;
      color: white;
      letter-spacing: 0.4px;
    }

    .motto-th {
      margin-top: 4px;
      font-size: clamp(13px, 1vw, 16px);
      color: rgba(255,255,255,0.86);
      font-weight: 300;
    }

    .yellow-line {
      margin-top: 15px;
      width: 76px;
      height: 4px;
      background: var(--yellow);
      border-radius: 20px;
    }

    /* Artwork area */

    .artwork-area {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 2;
    }

    .white-wave {
      position: absolute;
      width: 135%;
      height: 82%;
      left: -18%;
      bottom: -24%;
      background:
        linear-gradient(
          150deg,
          #f8fcff 0%,
          #e8f4ff 65%,
          #ffffff 100%
        );
      border-radius: 48% 55% 0 0 / 25% 32% 0 0;
      transform: rotate(-3deg);
      z-index: 1;
    }

    .blue-wave {
      position: absolute;
      width: 130%;
      height: 115px;
      left: -10%;
      bottom: -55px;
      background: #07386f;
      border-radius: 50% 50% 0 0;
      transform: rotate(2deg);
      z-index: 2;
    }

    .yellow-wave {
      position: absolute;
      width: 135%;
      height: 20px;
      left: -12%;
      bottom: 49px;
      background: var(--yellow);
      border-radius: 50%;
      transform: rotate(2deg);
      z-index: 3;
    }

    .artwork {
      position: relative;
      z-index: 4;
      display: block;
      width: min(90%, 780px);
      max-height: min(64vh, 650px);
      object-fit: contain;
      object-position: center bottom;
      margin: 0 auto -3px;
      filter: drop-shadow(0 18px 18px rgba(0, 27, 61, 0.13));
    }

    /* =========================
       RIGHT / LOGIN
    ========================== */

    .login-panel {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(20px, 3vw, 48px);
      background:
        radial-gradient(
          circle at 100% 100%,
          rgba(13, 77, 139, 0.08),
          transparent 35%
        ),
        #f7f9fc;
    }

    .login-panel::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 170px;
      height: 16px;
      background: var(--yellow);
      clip-path: polygon(18% 0,100% 0,100% 100%,0 100%);
    }

    .login-panel::after {
      content: "";
      position: absolute;
      top: 16px;
      right: 0;
      width: 205px;
      height: 7px;
      background: var(--navy);
      clip-path: polygon(18% 0,100% 0,100% 100%,0 100%);
    }

    .login-card {
      width: min(100%, 560px);
      background: rgba(255,255,255,0.98);
      border: 1px solid rgba(7, 56, 111, 0.08);
      border-radius: 28px;
      padding: clamp(24px, 4vh, 42px)
               clamp(25px, 3.5vw, 48px);
      box-shadow:
        0 22px 60px rgba(5, 45, 91, 0.10),
        0 4px 15px rgba(5, 45, 91, 0.04);
    }

    .language-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 3px;
    }

    .language-switch {
      display: flex;
      align-items: center;
      padding: 4px;
      background: #edf2f8;
      border-radius: 100px;
    }

    .lang-btn {
      border: 0;
      background: transparent;
      font-family: inherit;
      color: #53657a;
      padding: 7px 13px;
      border-radius: 100px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s ease;
    }

    .lang-btn.active {
      color: white;
      background: var(--navy);
      box-shadow: 0 3px 10px rgba(6, 44, 94, 0.18);
    }

    .system-brand {
      text-align: center;
      margin-bottom: clamp(17px, 2.5vh, 27px);
    }

    .mini-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      height: 58px;
      margin-bottom: 8px;
    }

    .mini-logo span {
      display: block;
      width: 13px;
      border-radius: 20px;
      background: linear-gradient(
        180deg,
        #ffd630,
        #ffbd00
      );
    }

    .mini-logo span:nth-child(1) {
      height: 27px;
    }

    .mini-logo span:nth-child(2) {
      height: 43px;
    }

    .mini-logo span:nth-child(3) {
      height: 58px;
    }

    .mini-logo span:nth-child(4) {
      height: 43px;
    }

    .mini-logo span:nth-child(5) {
      height: 27px;
    }

    .system-title {
      font-size: clamp(28px, 2.5vw, 40px);
      line-height: 1;
      color: var(--navy);
      font-weight: 700;
      letter-spacing: -1px;
    }

    .system-subtitle {
      margin-top: 9px;
      font-size: 15px;
      line-height: 1.5;
      color: #334d6c;
      font-weight: 400;
    }

    .admin-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 9px;
      padding: 6px 12px;
      background: #fff7d9;
      color: #8b6800;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
    }

    .admin-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--yellow);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      color: var(--navy);
      font-weight: 500;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 46px 0 15px;
      font-family: inherit;
      font-size: 14px;
      color: var(--navy);
      outline: none;
      background: #fff;
      transition: 0.2s ease;
    }

    input:focus {
      border-color: #8baed1;
      box-shadow: 0 0 0 4px rgba(13, 77, 139, 0.07);
    }

    input::placeholder {
      color: #a2adba;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #718096;
      cursor: pointer;
      font-family: inherit;
      font-size: 18px;
    }

    .login-button {
      width: 100%;
      height: 54px;
      margin-top: 6px;
      border: none;
      border-radius: 13px;
      cursor: pointer;
      font-family: inherit;
      font-size: 17px;
      font-weight: 600;
      color: var(--navy);
      background:
        linear-gradient(
          90deg,
          #ffcb05,
          #ffc000
        );
      box-shadow: 0 10px 24px rgba(255, 196, 0, 0.22);
      transition: 0.2s ease;
    }

    .login-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 13px 27px rgba(255, 196, 0, 0.28);
    }

    .login-button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 11px;
      padding: 9px 12px;
      border-radius: 9px;
      font-size: 12px;
      text-align: center;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: var(--danger);
      border: 1px solid #ffd4d4;
    }

    .message.success {
      display: block;
      background: #edf9f1;
      color: var(--success);
      border: 1px solid #cbeed7;
    }

    .admin-only {
      margin-top: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      color: #65768b;
    }

    .admin-only::before,
    .admin-only::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #e0e6ee;
    }

    .home-link {
      display: block;
      width: fit-content;
      margin: 13px auto 0;
      color: var(--navy);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }

    .home-link:hover {
      text-decoration: underline;
    }

    .copyright {
      margin-top: 13px;
      text-align: center;
      font-size: 10px;
      color: #9aa7b5;
    }

    /* =========================
       LAPTOP HEIGHT FIX
       important for 100% zoom
    ========================== */

    @media (min-width: 901px) and (max-height: 760px) {

      .brand-copy {
        padding-top: 22px;
      }

      .welcome-th {
        font-size: 28px;
      }

      .welcome-en {
        font-size: 21px;
      }

      .motto-en {
        margin-top: 10px;
        font-size: 16px;
      }

      .motto-th {
        font-size: 12px;
      }

      .yellow-line {
        margin-top: 9px;
      }

      .artwork {
        max-height: 58vh;
        width: min(84%, 650px);
      }

      .login-panel {
        padding: 18px 30px;
      }

      .login-card {
        padding: 19px 35px;
        border-radius: 23px;
      }

      .mini-logo {
        height: 44px;
        margin-bottom: 5px;
      }

      .mini-logo span {
        width: 10px;
      }

      .mini-logo span:nth-child(1),
      .mini-logo span:nth-child(5) {
        height: 21px;
      }

      .mini-logo span:nth-child(2),
      .mini-logo span:nth-child(4) {
        height: 33px;
      }

      .mini-logo span:nth-child(3) {
        height: 44px;
      }

      .system-title {
        font-size: 30px;
      }

      .system-subtitle {
        margin-top: 5px;
        font-size: 13px;
      }

      .admin-label {
        margin-top: 5px;
        padding: 4px 10px;
      }

      .system-brand {
        margin-bottom: 12px;
      }

      .form-group {
        margin-bottom: 9px;
      }

      label {
        margin-bottom: 4px;
        font-size: 12px;
      }

      input {
        height: 43px;
      }

      .login-button {
        height: 45px;
        margin-top: 2px;
        font-size: 15px;
      }

      .admin-only {
        margin-top: 10px;
      }

      .home-link {
        margin-top: 8px;
      }

      .copyright {
        margin-top: 7px;
      }
    }

    /* =========================
       TABLET
    ========================== */

    @media (max-width: 900px) {

      body {
        overflow: auto;
      }

      .page {
        display: block;
        min-height: 100vh;
        overflow: visible;
      }

      .brand-panel {
        min-height: 520px;
      }

      .brand-copy {
        text-align: center;
        padding: 35px 25px 0;
      }

      .yellow-line {
        margin-left: auto;
        margin-right: auto;
      }

      .artwork {
        max-height: 360px;
        width: min(86%, 600px);
      }

      .login-panel {
        min-height: auto;
        padding: 45px 20px 55px;
      }

      .login-card {
        max-width: 580px;
      }
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 560px) {

      .brand-panel {
        min-height: 420px;
      }

      .brand-copy {
        padding-top: 28px;
      }

      .welcome-th {
        font-size: 27px;
      }

      .welcome-en {
        font-size: 20px;
      }

      .motto-en {
        font-size: 14px;
        margin-top: 12px;
      }

      .motto-th {
        font-size: 11px;
      }

      .artwork {
        max-height: 280px;
        width: 95%;
      }

      .login-panel {
        padding: 30px 13px 40px;
      }

      .login-card {
        padding: 22px 18px 25px;
        border-radius: 20px;
      }

      .system-title {
        font-size: 29px;
      }

      .system-subtitle {
        font-size: 13px;
      }
    }

  </style>
</head>

<body>

<div class="page">

  <!-- LEFT -->
  <section class="brand-panel">

    <div class="brand-copy">

      <div class="welcome-th"
           data-th="ยินดีต้อนรับ"
           data-en="Welcome">
        ยินดีต้อนรับ
      </div>

      <div class="welcome-en"
           data-th="Welcome"
           data-en="SANTE Admin System">
        Welcome
      </div>

      <div class="motto-en">
        TRUST IN SAFETY. TRUST IN SANTE.
      </div>

      <div class="motto-th"
           data-th="เชื่อมั่นในความปลอดภัย เชื่อมั่นในซานเต้"
           data-en="Safety you can trust. SANTE you can trust.">
        เชื่อมั่นในความปลอดภัย เชื่อมั่นในซานเต้
      </div>

      <div class="yellow-line"></div>

    </div>

    <div class="artwork-area">

      <div class="white-wave"></div>
      <div class="yellow-wave"></div>
      <div class="blue-wave"></div>

      <!-- ภาพที่คุณ Upload ใน GitHub -->
      <img
        class="artwork"
        src="sante-admin-artwork.png"
        alt="SANTE Admin Mascot"
      >

    </div>

  </section>


  <!-- RIGHT -->
  <section class="login-panel">

    <div class="login-card">

      <div class="language-row">
        <div class="language-switch">
          <button
            class="lang-btn active"
            id="btnTH"
            type="button"
            onclick="setLanguage('th')">
            🇹🇭 ไทย
          </button>

          <button
            class="lang-btn"
            id="btnEN"
            type="button"
            onclick="setLanguage('en')">
            🇬🇧 EN
          </button>
        </div>
      </div>

      <div class="system-brand">

        <div class="mini-logo">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="system-title">
          SANTE SYSTEM
        </div>

        <div
          class="system-subtitle"
          data-th="ระบบบริหารจัดการ<br>SANTE Consulting"
          data-en="Administration System<br>SANTE Consulting">
          ระบบบริหารจัดการ<br>
          SANTE Consulting
        </div>

        <div class="admin-label">
          <span class="admin-dot"></span>
          <span
            data-th="ADMINISTRATOR"
            data-en="ADMINISTRATOR">
            ADMINISTRATOR
          </span>
        </div>

      </div>


      <form id="loginForm">

        <div class="form-group">

          <label
            for="email"
            data-th="อีเมล"
            data-en="Email">
            อีเมล
          </label>

          <div class="input-wrap">
            <input
              type="email"
              id="email"
              autocomplete="email"
              placeholder="example@santeconsulting.co.th"
              required
            >
          </div>

        </div>


        <div class="form-group">

          <label
            for="password"
            data-th="รหัสผ่าน"
            data-en="Password">
            รหัสผ่าน
          </label>

          <div class="input-wrap">

            <input
              type="password"
              id="password"
              autocomplete="current-password"
              placeholder="กรุณากรอกรหัสผ่าน"
              required
            >

            <button
              type="button"
              class="password-toggle"
              onclick="togglePassword()"
              aria-label="Show password">
              👁
            </button>

          </div>

        </div>


        <button
          type="submit"
          class="login-button"
          id="loginButton"
          data-th="เข้าสู่ระบบ →"
          data-en="Sign in →">
          เข้าสู่ระบบ →
        </button>


        <div
          id="loginMessage"
          class="message">
        </div>

      </form>


      <div
        class="admin-only"
        data-th="🔒 เฉพาะผู้ดูแลระบบเท่านั้น"
        data-en="🔒 Administrators only">
        🔒 เฉพาะผู้ดูแลระบบเท่านั้น
      </div>


      <a
        class="home-link"
        href="index.html"

        data-en="⌂ Back to home">
        ⌂ กลับหน้าหลัก

      </div>

    </div>

  </section>

</div>


<script>

  /* ======================================
     SUPABASE
  ====================================== */

  const SUPABASE_URL =
    "https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fcyegjwerxlxhczrfiurz.supabase.co%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7Cc1bfca988e3f45c36f8708df2103a5a3%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265971712995353%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=e3UslBEBxvJObnqY2jHLYc28tX1PjW06Gp6gQHwE9v4%3D&reserved=0";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Hhr1LDrJqvzdEcHR4cScwA_YA9b9eYF";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* ======================================
     LANGUAGE
  ====================================== */

  let currentLanguage = "th";

  function setLanguage(language) {

    currentLanguage = language;

    document.documentElement.lang = language;

    document
      .getElementById("btnTH")
      .classList.toggle(
        "active",
        language === "th"
      );

    document
      .getElementById("btnEN")
      .classList.toggle(
        "active",
        language === "en"
      );

    document
      .querySelectorAll("[data-th]")
      .forEach(element => {

        const text =
          language === "th"
            ? element.dataset.th
            : element.dataset.en;

        element.innerHTML = text;

      });


    const password =
      document.getElementById("password");

    password.placeholder =
      language === "th"
        ? "กรุณากรอกรหัสผ่าน"
        : "Enter your password";

  }


  /* ======================================
     PASSWORD
  ====================================== */

  function togglePassword() {

    const password =
      document.getElementById("password");

    password.type =
      password.type === "password"
        ? "text"
        : "password";

  }


  /* ======================================
     MESSAGE
  ====================================== */

  function showMessage(message, type) {

    const box =
      document.getElementById("loginMessage");

    box.textContent = message;

    box.className =
      "message " + type;

  }


  /* ======================================
     LOGIN
  ====================================== */

  document
    .getElementById("loginForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        const button =
          document.getElementById(
            "loginButton"
          );


        button.disabled = true;

        button.textContent =
          currentLanguage === "th"
            ? "กำลังตรวจสอบ..."
            : "Checking...";


        document
          .getElementById("loginMessage")
          .className = "message";


        try {

          /* LOGIN */

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({
                email,
                password
              });


          if (error) {

            throw error;

          }


          if (!data.user) {

            throw new Error(
              "LOGIN_FAILED"
            );

          }


          /* CHECK STAFF PERMISSION */

          const {
            data: staffAllowed,
            error: roleError
          } =
            await supabaseClient.rpc(
              "is_staff"
            );


          if (roleError) {

            await supabaseClient.auth
              .signOut();

            throw roleError;

          }


          if (staffAllowed !== true) {

            await supabaseClient.auth
              .signOut();

            showMessage(
              currentLanguage === "th"
                ? "บัญชีนี้ไม่มีสิทธิ์เข้าสู่ระบบผู้ดูแล"
                : "This account does not have administrator access.",
              "error"
            );

            button.disabled = false;

            button.textContent =
              currentLanguage === "th"
                ? "เข้าสู่ระบบ →"
                : "Sign in →";

            return;

          }


          /* SUCCESS */

          showMessage(
            currentLanguage === "th"
              ? "เข้าสู่ระบบสำเร็จ"
              : "Login successful",
            "success"
          );


          /*
             PART ต่อไปเราจะสร้าง
             admin-dashboard.html
          */

          setTimeout(() => {

            window.location.href =
              "admin-dashboard.html";

          }, 500);


        }

        catch (error) {

          console.error(error);

          showMessage(
            currentLanguage === "th"
              ? "อีเมลหรือรหัสผ่านไม่ถูกต้อง หรือไม่สามารถเข้าสู่ระบบได้"
              : "Incorrect email/password or unable to sign in.",
            "error"
          );

          button.disabled = false;

          button.textContent =
            currentLanguage === "th"
              ? "เข้าสู่ระบบ →"
              : "Sign in →";

        }

      }
    );


  /* ======================================
     IF ALREADY LOGGED IN
  ====================================== */

  async function checkExistingSession() {

    const {
      data
    } =
      await supabaseClient.auth
        .getSession();


    if (!data.session) {

      return;

    }


    const {
      data: staffAllowed
    } =
      await supabaseClient.rpc(
        "is_staff"
      );


    if (staffAllowed === true) {

      window.location.href =
        "admin-dashboard.html";

    }

  }


  checkExistingSession();

</script>

</body>
</html>
