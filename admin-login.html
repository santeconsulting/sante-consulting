<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SANTE SYSTEM | Admin Login</title>

  <link rel="preconnect" href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Ffonts.googleapis.com%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7C7ed9a833f733425c29b308df2109d06e%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265998183297921%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=Ses6TNsQxJsVaJfbI9VT9FEj2hrhYZpRzEjZG%2F5ve64%3D&reserved=0">
  <link rel="preconnect" href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Ffonts.gstatic.com%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7C7ed9a833f733425c29b308df2109d06e%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265998183319918%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=Flquif%2FsAzWOWH3gMfUJN1bvAs%2Fg1X6hTGtx3JptYHY%3D&reserved=0" crossorigin>
  <link href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Ffonts.googleapis.com%2Fcss2%3Ffamily%3DPrompt%3Awght%40300%3B400%3B500%3B600%3B700%26display%3Dswap&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7C7ed9a833f733425c29b308df2109d06e%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265998183333365%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=7dQVqYC%2B%2Fe2i6vTxQ5yDa4LCU6Guz7uO55yq%2BZZVmEY%3D&reserved=0" rel="stylesheet">

  <script src="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fcdn.jsdelivr.net%2Fnpm%2F%40supabase%2Fsupabase-js%402&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7C7ed9a833f733425c29b308df2109d06e%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265998183346778%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=%2FVTAn0NfIRosNY2YHMYWwKajD%2F22LAoUKK1PXtBqxIY%3D&reserved=0"></script>

  <style>

    :root{
      --navy:#002f63;
      --navy-dark:#002451;
      --blue:#006eb6;

      /* เหลืองโทน SANTE */
      --yellow:#fdbd00;
      --yellow-light:#ffd333;

      --white:#ffffff;
      --text:#063466;
      --muted:#66758a;
      --border:#d5e0eb;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html,
    body{
      width:100%;
      height:100%;
    }

    body{
      font-family:"Prompt",sans-serif;
      background:#f5f8fc;
      color:var(--text);
      overflow:hidden;
    }


    /* =====================================================
       MAIN PAGE
    ===================================================== */

    .page{
      width:100%;
      height:100vh;

      display:grid;

      grid-template-columns:
        minmax(0,53%)
        minmax(0,47%);

      overflow:hidden;
    }


    /* =====================================================
       LEFT SIDE
    ===================================================== */

    .visual{
      position:relative;

      width:100%;
      height:100vh;

      overflow:hidden;

      background:
        radial-gradient(
          circle at 5% 5%,
          rgba(19,115,185,.32),
          transparent 34%
        ),
        linear-gradient(
          145deg,
          #002451 0%,
          #003b75 52%,
          #006eb6 100%
        );
    }


    /* subtle navy decoration */

    .visual::before{
      content:"";

      position:absolute;

      width:560px;
      height:560px;

      border-radius:50%;

      left:-330px;
      top:-300px;

      background:
        rgba(255,255,255,.035);

      z-index:0;
    }


    .visual::after{
      content:"";

      position:absolute;

      width:650px;
      height:650px;

      border-radius:50%;

      right:-430px;
      top:-430px;

      background:
        rgba(255,255,255,.035);

      z-index:0;
    }


    /* =====================================================
       WELCOME
    ===================================================== */

    .welcome{
      position:absolute;

      z-index:10;

      top:4.2vh;
      left:0;

      width:100%;

      padding:0 30px;

      text-align:center;
      color:white;
    }


    .welcome h1{
      font-size:clamp(38px,4vw,65px);

      font-weight:700;

      line-height:.98;

      letter-spacing:-1px;
    }


    .welcome h2{
      margin-top:4px;

      font-size:clamp(32px,3.6vw,56px);

      font-weight:700;

      line-height:1;

      color:var(--yellow);
    }


    .welcome-line{
      width:70px;
      height:4px;

      margin:
        clamp(10px,1.7vh,20px)
        auto
        clamp(8px,1.4vh,16px);

      border-radius:20px;

      background:var(--yellow);
    }


    .slogan{
      font-size:clamp(15px,1.45vw,24px);

      font-weight:600;

      line-height:1.25;

      white-space:nowrap;
    }


    .slogan span{
      color:var(--yellow);
    }


    .slogan-th{
      margin-top:5px;

      font-size:clamp(13px,1.25vw,20px);

      font-weight:400;

      line-height:1.25;
    }


    .slogan-th span{
      color:var(--yellow);
    }


    /* =====================================================
       WHITE WAVE
    ===================================================== */

    .white-wave{
      position:absolute;

      z-index:1;

      left:-10%;
      bottom:-8%;

      width:125%;
      height:64%;

      background:white;

      border-radius:
        53% 47% 0 0 /
        14% 17% 0 0;

      transform:rotate(-1deg);
    }


    .light-wave{
      position:absolute;

      z-index:2;

      left:-7%;
      bottom:0;

      width:120%;
      height:53%;

      background:
        linear-gradient(
          to bottom,
          rgba(216,239,255,.75),
          rgba(255,255,255,.10)
        );

      clip-path:
        polygon(
          0 13%,
          17% 5%,
          38% 11%,
          57% 4%,
          77% 10%,
          100% 2%,
          100% 100%,
          0 100%
        );
    }


    /* =====================================================
       INDUSTRIAL SKYLINE
    ===================================================== */

    .skyline{
      position:absolute;

      z-index:3;

      left:0;
      bottom:9%;

      width:100%;
      height:24%;

      opacity:.34;
    }


    .skyline::before{
      content:"";

      position:absolute;

      left:0;
      right:0;
      bottom:0;

      height:100%;

      background:
        linear-gradient(
          90deg,

          transparent 0 4%,
          #77b7e5 4% 6%,
          transparent 6% 9%,

          #77b7e5 9% 11%,
          transparent 11% 15%,

          #77b7e5 15% 18%,
          transparent 18% 22%,

          #77b7e5 22% 25%,
          transparent 25% 30%,

          #77b7e5 30% 33%,
          transparent 33% 38%,

          #77b7e5 38% 41%,
          transparent 41% 47%,

          #77b7e5 47% 50%,
          transparent 50% 56%,

          #77b7e5 56% 59%,
          transparent 59% 65%,

          #77b7e5 65% 68%,
          transparent 68% 73%,

          #77b7e5 73% 76%,
          transparent 76% 82%,

          #77b7e5 82% 85%,
          transparent 85% 90%,

          #77b7e5 90% 93%,
          transparent 93%
        );
    }


    /* =====================================================
       MASCOT
       จุดสำคัญ: แมวใหญ่ขึ้น + ขยับขึ้น
    ===================================================== */

    .mascot{
      position:absolute;

      z-index:7;

      /*
        เพิ่มขนาดจากเดิม
      */
      width:min(58vw,720px);

      max-height:66vh;

      left:50%;

      /*
        เดิมติดลบมาก ทำให้แมวอยู่ต่ำ
        รอบนี้ขยับขึ้น
      */
      bottom:1.5%;

      transform:
        translateX(-50%);

      object-fit:contain;

      object-position:center bottom;

      filter:
        drop-shadow(
          0 18px 20px
          rgba(0,30,65,.20)
        );
    }


    /* =====================================================
       BOTTOM NAVY RIBBON
    ===================================================== */

    .ribbon{
      position:absolute;

      z-index:5;

      left:-5%;
      bottom:-7%;

      width:112%;
      height:17%;

      background:
        linear-gradient(
          90deg,
          #002451,
          #003b75
        );

      border-radius:
        50% 50% 0 0 /
        35% 35% 0 0;

      transform:rotate(1.5deg);
    }


    .ribbon::before{
      content:"";

      position:absolute;

      left:0;
      top:-12px;

      width:100%;
      height:12px;

      background:var(--yellow);

      border-radius:50%;
    }


    /* =====================================================
       RIGHT SIDE
    ===================================================== */

    .login-side{
      position:relative;

      height:100vh;

      display:flex;

      align-items:center;
      justify-content:center;

      padding:
        clamp(16px,2.5vh,30px)
        clamp(35px,6vw,90px);

      background:
        linear-gradient(
          135deg,
          #ffffff 0%,
          #f7fbff 100%
        );

      overflow:hidden;
    }


    .top-accent{
      position:absolute;

      right:0;
      top:0;

      width:34%;
      height:14px;

      background:var(--yellow);

      transform:skewX(-38deg);

      transform-origin:right;
    }


    .login-card{
      width:100%;
      max-width:600px;
    }


    /* =====================================================
       LANGUAGE
    ===================================================== */

    .language{
      display:flex;

      justify-content:flex-end;

      margin-bottom:
        clamp(7px,1.3vh,18px);
    }


    .language-box{
      padding:5px;

      border-radius:40px;

      background:#eef3f8;

      display:flex;

      gap:4px;
    }


    .lang{
      border:0;

      background:transparent;

      padding:7px 15px;

      border-radius:25px;

      font-family:"Prompt",sans-serif;

      font-size:13px;

      cursor:pointer;

      color:var(--text);
    }


    .lang.active{
      background:var(--navy);

      color:white;
    }


    /* =====================================================
       BRAND
    ===================================================== */

    .brand{
      text-align:center;

      margin-bottom:
        clamp(12px,2vh,25px);
    }


    .brand-symbol{
      height:
        clamp(54px,8vh,86px);

      display:flex;

      align-items:center;
      justify-content:center;

      gap:8px;

      margin-bottom:8px;
    }


    .brand-symbol span{
      display:block;

      width:
        clamp(15px,1.5vw,22px);

      border-radius:30px;

      background:
        linear-gradient(
          to bottom,
          var(--yellow-light),
          var(--yellow)
        );
    }


    .brand-symbol span:nth-child(1){
      height:48%;
    }

    .brand-symbol span:nth-child(2){
      height:72%;
    }

    .brand-symbol span:nth-child(3){
      height:100%;
    }

    .brand-symbol span:nth-child(4){
      height:72%;
    }

    .brand-symbol span:nth-child(5){
      height:48%;
    }


    .brand h1{
      font-size:
        clamp(32px,3vw,52px);

      font-weight:700;

      line-height:1;

      letter-spacing:-1px;

      color:var(--navy);
    }


    .brand-line{
      width:115px;
      height:3px;

      margin:
        7px auto
        9px;

      border-radius:10px;

      background:var(--yellow);
    }


    .brand .thai{
      font-size:
        clamp(15px,1.35vw,20px);

      font-weight:600;

      line-height:1.3;
    }


    .brand .english{
      margin-top:1px;

      font-size:
        clamp(14px,1.3vw,19px);

      font-weight:500;

      line-height:1.3;

      color:#59677e;
    }


    .admin-badge{
      display:inline-block;

      margin-top:7px;

      padding:3px 12px;

      border-radius:20px;

      background:#fff2b7;

      color:#705700;

      font-size:11px;

      font-weight:500;
    }


    /* =====================================================
       FORM
    ===================================================== */

    .form-group{
      margin-bottom:
        clamp(10px,1.6vh,18px);
    }


    .form-group label{
      display:flex;

      align-items:center;

      gap:8px;

      margin-bottom:6px;

      font-size:
        clamp(14px,1.2vw,17px);

      font-weight:600;
    }


    .field{
      position:relative;
    }


    .field input{
      width:100%;

      height:
        clamp(48px,6.5vh,60px);

      padding:
        0 52px
        0 18px;

      border:
        1.5px solid
        var(--border);

      border-radius:12px;

      outline:none;

      font-family:"Prompt",sans-serif;

      font-size:
        clamp(14px,1.1vw,16px);

      color:var(--text);

      background:white;

      transition:.2s;
    }


    .field input:focus{
      border-color:#78a9d2;

      box-shadow:
        0 0 0 4px
        rgba(0,91,160,.07);
    }


    .eye{
      position:absolute;

      right:17px;
      top:50%;

      transform:
        translateY(-50%);

      border:0;

      background:transparent;

      cursor:pointer;

      font-size:20px;
    }


    /* =====================================================
       LOGIN BUTTON
    ===================================================== */

    .login-button{
      position:relative;

      width:100%;

      height:
        clamp(52px,7vh,64px);

      border:0;

      border-radius:13px;

      margin-top:3px;

      cursor:pointer;

      font-family:"Prompt",sans-serif;

      font-size:
        clamp(17px,1.5vw,21px);

      font-weight:600;

      color:var(--navy-dark);

      background:
        linear-gradient(
          90deg,
          #ffd02a,
          var(--yellow)
        );

      box-shadow:
        0 8px 20px
        rgba(253,189,0,.20);
    }


    .login-button:hover{
      filter:brightness(1.025);
    }


    .login-button:disabled{
      opacity:.65;

      cursor:not-allowed;
    }


    .arrow{
      position:absolute;

      right:9px;
      top:50%;

      transform:
        translateY(-50%);

      width:
        clamp(37px,4.2vh,46px);

      height:
        clamp(37px,4.2vh,46px);

      border-radius:50%;

      display:flex;

      align-items:center;
      justify-content:center;

      background:var(--navy);

      color:white;

      font-size:24px;
    }


    /* =====================================================
       BOTTOM
    ===================================================== */

    .admin-only{
      display:flex;

      align-items:center;

      gap:13px;

      margin:
        clamp(10px,1.7vh,20px)
        0
        clamp(7px,1.2vh,14px);

      font-size:
        clamp(12px,1vw,15px);

      font-weight:500;
    }


    .admin-only::before,
    .admin-only::after{
      content:"";

      flex:1;

      height:1px;

      background:#cbd8e5;
    }


    .home{
      text-align:center;
    }


    .home a{
      color:var(--navy);

      font-weight:600;

      font-size:
        clamp(13px,1.1vw,16px);

      text-decoration:underline;

      text-underline-offset:4px;
    }


    .message{
      min-height:20px;

      margin-top:8px;

      text-align:center;

      font-size:13px;

      color:#d43838;
    }


    /* =====================================================
       STANDARD LAPTOP
       สำคัญสำหรับจอที่ใช้อยู่
    ===================================================== */

    @media
    (min-width:901px)
    and (max-height:850px){

      .welcome{
        top:3.5vh;
      }

      .welcome h1{
        font-size:
          clamp(35px,3.6vw,50px);
      }

      .welcome h2{
        font-size:
          clamp(30px,3.1vw,43px);
      }

      .welcome-line{
        margin:
          10px auto
          9px;
      }

      .slogan{
        font-size:
          clamp(14px,1.3vw,19px);
      }

      .slogan-th{
        font-size:
          clamp(12px,1.1vw,16px);
      }


      /*
        สำคัญ:
        แมวใหญ่ + ขึ้นสูง
      */

      .mascot{
        width:min(55vw,630px);

        max-height:65vh;

        bottom:1%;
      }


      .login-side{
        padding:
          12px
          clamp(35px,5vw,75px);
      }


      .language{
        margin-bottom:5px;
      }


      .brand{
        margin-bottom:10px;
      }


      .brand-symbol{
        height:53px;

        margin-bottom:5px;
      }


      .brand h1{
        font-size:
          clamp(30px,2.8vw,39px);
      }


      .brand-line{
        margin:
          5px auto
          6px;
      }


      .brand .thai,
      .brand .english{
        font-size:14px;
      }


      .admin-badge{
        margin-top:5px;

        font-size:10px;
      }


      .form-group{
        margin-bottom:9px;
      }


      .form-group label{
        margin-bottom:4px;

        font-size:14px;
      }


      .field input{
        height:47px;

        font-size:14px;
      }


      .login-button{
        height:50px;

        font-size:17px;
      }


      .arrow{
        width:36px;

        height:36px;

        font-size:21px;
      }


      .admin-only{
        margin:
          9px 0
          6px;

        font-size:12px;
      }


      .home a{
        font-size:13px;
      }


      .message{
        margin-top:5px;

        min-height:16px;

        font-size:12px;
      }

    }


    /* =====================================================
       VERY SHORT LAPTOP
    ===================================================== */

    @media
    (min-width:901px)
    and (max-height:700px){

      .welcome{
        top:18px;
      }

      .welcome h1{
        font-size:36px;
      }

      .welcome h2{
        font-size:31px;
      }

      .slogan{
        font-size:14px;
      }

      .slogan-th{
        font-size:12px;
      }

      .mascot{
        width:min(50vw,560px);

        max-height:61vh;

        bottom:0;
      }

      .brand-symbol{
        height:45px;
      }

      .brand h1{
        font-size:30px;
      }

      .brand .thai,
      .brand .english{
        font-size:12px;
      }

      .field input{
        height:42px;
      }

      .login-button{
        height:45px;
      }

    }


    /* =====================================================
       TABLET
    ===================================================== */

    @media(max-width:900px){

      html,
      body{
        height:auto;

        overflow:auto;
      }

      body{
        overflow-x:hidden;
      }

      .page{
        display:block;

        height:auto;
      }


      .visual{
        height:650px;

        min-height:650px;
      }


      .welcome{
        top:45px;
      }


      .mascot{
        width:min(90vw,600px);

        max-height:470px;

        bottom:0;
      }


      .login-side{
        height:auto;

        min-height:720px;

        padding:
          45px
          8%
          55px;
      }


      .login-card{
        max-width:620px;
      }

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media(max-width:600px){

      .visual{
        height:550px;

        min-height:550px;
      }


      .welcome{
        top:35px;

        padding:
          0 15px;
      }


      .welcome h1{
        font-size:36px;
      }


      .welcome h2{
        font-size:31px;
      }


      .welcome-line{
        margin:
          11px auto
          9px;
      }


      .slogan{
        font-size:13px;

        white-space:normal;
      }


      .slogan-th{
        font-size:11px;
      }


      .mascot{
        width:490px;

        max-width:105%;

        max-height:390px;

        bottom:0;
      }


      .login-side{
        min-height:auto;

        padding:
          30px
          21px
          45px;
      }


      .brand-symbol{
        height:60px;
      }


      .brand h1{
        font-size:34px;
      }


      .field input{
        height:54px;
      }


      .login-button{
        height:56px;
      }

    }

  </style>
</head>


<body>


<div class="page">


  <!-- ==================================================
       LEFT SIDE
  =================================================== -->

  <section class="visual">


    <div class="welcome">

      <h1 id="welcomeTitle">
        ยินดีต้อนรับ
      </h1>

      <h2 id="welcomeEnglish">
        Welcome
      </h2>

      <div class="welcome-line"></div>


      <div class="slogan">

        TRUST IN SAFETY.

        <span>
          TRUST IN SANTE.
        </span>

      </div>


      <div class="slogan-th">

<script>


/* =====================================================

===================================================== */


const SUPABASE_URL =
  "https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fcyegjwerxlxhczrfiurz.supabase.co%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7C7ed9a833f733425c29b308df2109d06e%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265998183360114%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=4HJraigGTQE%2F3zlsbEGd%2F3ZI7TtSif7MC6%2F6AZFGqvc%3D&reserved=0";


const SUPABASE_KEY =
  "sb_publishable_Hhr1LDrJqvzdEcHR4cScwA_YA9b9eYF";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* =====================================================
   LANGUAGE
===================================================== */


let currentLanguage = "th";


function setLanguage(language){


  currentLanguage = language;


  const thaiButton =
    document.getElementById(
      "thaiButton"
    );


  const englishButton =
    document.getElementById(
      "englishButton"
    );


  thaiButton.classList.toggle(
    "active",
    language === "th"
  );


  englishButton.classList.toggle(
    "active",
    language === "en"
  );



  if(language === "th"){


    document
      .getElementById(
        "welcomeTitle"
      )
      .textContent =
      "ยินดีต้อนรับ";


    document
      .getElementById(
        "welcomeEnglish"
      )
      .textContent =
      "Welcome";


    document
      .getElementById(
        "systemThai"
      )
      .textContent =
      "ระบบบริหารจัดการ";


    document
      .getElementById(
        "emailLabel"
      )
      .textContent =
      "✉️ อีเมล";


    document
      .getElementById(
        "passwordLabel"
      )
      .textContent =
      "🔒 รหัสผ่าน";


    document
      .getElementById(
        "password"
      )
      .placeholder =
      "กรุณากรอกรหัสผ่าน";


    document
      .getElementById(
        "loginText"
      )
      .textContent =
      "เข้าสู่ระบบ";


    document
      .getElementById(
        "adminOnlyText"
      )
      .textContent =
      "🔒 เฉพาะผู้ดูแลระบบเท่านั้น";


    document
      .getElementById(
        "homeText"
      )
      .textContent =
      "🏠 กลับหน้าหลัก";


  }else{


    document
      .getElementById(
        "welcomeTitle"
      )
      .textContent =
      "Welcome";


    document
      .getElementById(
        "welcomeEnglish"

    document
      .getElementById(

    document
      .getElementById(
        "emailLabel"

      .textContent =

    document
      .getElementById(
        "passwordLabel"
      )

    document
      .getElementById(

      .placeholder =

    document
      .getElementById(

    document
      .getElementById(
        "adminOnlyText"

    document
      .getElementById(
        "homeText"
      )

  }


}



/* =====================================================
   PASSWORD
===================================================== */


function togglePassword(){


  const password =
    document.getElementById(
      "password"
    );


  password.type =
    password.type === "password"
      ? "text"
      : "password";


}



/* =====================================================
   LOGIN
===================================================== */


document
  .getElementById(
    "loginForm"
  )
  .addEventListener(
    "submit",
    async function(event){


      event.preventDefault();


      const email =
        document
          .getElementById(
            "email"
          )
          .value
          .trim();


      const password =
        document
          .getElementById(
            "password"
          )
          .value;


      const message =
        document.getElementById(
          "message"
        );


      const button =
        document.getElementById(
          "loginButton"
        );


      const loginText =
        document.getElementById(
          "loginText"
        );


      message.textContent = "";


      button.disabled = true;


      loginText.textContent =
        currentLanguage === "th"
          ? "กำลังเข้าสู่ระบบ..."
          : "Signing in...";


      try{


        /* -----------------------------------------
           SIGN IN
        ------------------------------------------ */


        const {
          data,
          error
        } =
        await supabaseClient
          .auth
          .signInWithPassword({

            email:
              email,

            password:
              password

          });


        if(error){

          throw error;

        }



        /* -----------------------------------------
           CHECK ADMIN / STAFF
        ------------------------------------------ */


        const {
          data: isStaff,
          error: staffError
        } =
        await supabaseClient
          .rpc(
            "is_staff"
          );


        if(staffError){

          throw staffError;

        }



        /* -----------------------------------------
           NO PERMISSION
        ------------------------------------------ */


        if(!isStaff){


          await supabaseClient
            .auth
            .signOut();


          message.textContent =
            currentLanguage === "th"

              ? "บัญชีนี้ไม่มีสิทธิ์เข้าสู่ระบบผู้ดูแล"

              : "This account does not have administrator access.";


          return;


        }



        /* -----------------------------------------
           LOGIN SUCCESS
        ------------------------------------------ */


        window.location.href =
          "admin-dashboard.html";


      }catch(error){


        console.error(
          error
        );


        message.textContent =
          currentLanguage === "th"

            ? "อีเมลหรือรหัสผ่านไม่ถูกต้อง หรือไม่สามารถเข้าสู่ระบบได้"

            : "Invalid email or password, or unable to sign in.";


      }finally{


        button.disabled =
          false;


        loginText.textContent =
          currentLanguage === "th"

            ? "เข้าสู่ระบบ"

            : "Sign In";


      }


    }
  );


</script>
