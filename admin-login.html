<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SANTE SYSTEM | Admin Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --navy:#002b5c;
      --navy-2:#003d78;
      --blue:#006fb7;
      --yellow:#ffc400;
      --yellow-light:#ffd84a;
      --white:#ffffff;
      --text:#052f60;
      --muted:#65748a;
      --border:#d7e1ec;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html,body{
      width:100%;
      height:100%;
    }

    body{
      font-family:"Prompt",sans-serif;
      background:#f6f9fc;
      color:var(--text);
      overflow:hidden;
    }

    .page{
      width:100%;
      height:100vh;
      display:grid;
      grid-template-columns:53% 47%;
      overflow:hidden;
    }

    /* LEFT */

    .visual{
      position:relative;
      height:100vh;
      overflow:hidden;

      background:
        radial-gradient(
          circle at 5% 8%,
          rgba(18,111,184,.30),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          #00254f 0%,
          #00396f 48%,
          #006eaf 100%
        );
    }

    .visual::before{
      content:"";
      position:absolute;
      width:620px;
      height:620px;
      border-radius:50%;
      left:-380px;
      top:-330px;
      background:rgba(255,255,255,.035);
    }

    .visual::after{
      content:"";
      position:absolute;
      width:680px;
      height:680px;
      border-radius:50%;
      right:-440px;
      top:-430px;
      background:rgba(255,255,255,.035);
    }

    .welcome{
      position:absolute;
      z-index:10;
      top:4.5vh;
      left:0;
      width:100%;
      padding:0 28px;
      text-align:center;
      color:#fff;
    }

    .welcome h1{
      font-size:clamp(40px,4vw,64px);
      font-weight:700;
      line-height:1;
      letter-spacing:-1px;
    }

    .welcome h2{
      margin-top:3px;
      font-size:clamp(34px,3.5vw,55px);
      font-weight:700;
      line-height:1.05;
      color:var(--yellow);
    }

    .welcome-line{
      width:78px;
      height:4px;
      margin:16px auto 15px;
      border-radius:20px;
      background:var(--yellow);
    }

    .slogan{
      font-size:clamp(20px,1.75vw,29px);
      font-weight:600;
      line-height:1.3;
      white-space:nowrap;
    }

    .slogan .yellow{
      color:var(--yellow);
    }

    .slogan-th{
      margin-top:5px;
      font-size:clamp(17px,1.45vw,23px);
      font-weight:400;
      line-height:1.3;
      white-space:nowrap;
    }

    .slogan-th .yellow{
      color:var(--yellow);
      font-weight:500;
    }

    .white-wave{
      position:absolute;
      z-index:1;
      left:-10%;
      bottom:-9%;
      width:125%;
      height:64%;
      background:#fff;
      border-radius:53% 47% 0 0 / 15% 18% 0 0;
      transform:rotate(-1deg);
    }

    .light-wave{
      position:absolute;
      z-index:2;
      left:-8%;
      bottom:0;
      width:122%;
      height:52%;

      background:
        linear-gradient(
          to bottom,
          rgba(220,241,255,.82),
          rgba(255,255,255,.08)
        );

      clip-path:polygon(
        0 13%,
        17% 5%,
        38% 11%,
        57% 4%,
        77% 10%,
        100% 2%,
        100% 100%,
        0 100%
      );
    }

    .skyline{
      position:absolute;
      z-index:3;
      left:0;
      bottom:9%;
      width:100%;
      height:23%;
      opacity:.32;
    }

    .skyline::before{
      content:"";
      position:absolute;
      inset:0;

      background:
        linear-gradient(
          90deg,
          transparent 0 4%,
          #75b6e4 4% 6%,
          transparent 6% 9%,
          #75b6e4 9% 11%,
          transparent 11% 15%,
          #75b6e4 15% 18%,
          transparent 18% 22%,
          #75b6e4 22% 25%,
          transparent 25% 30%,
          #75b6e4 30% 33%,
          transparent 33% 38%,
          #75b6e4 38% 41%,
          transparent 41% 47%,
          #75b6e4 47% 50%,
          transparent 50% 56%,
          #75b6e4 56% 59%,
          transparent 59% 65%,
          #75b6e4 65% 68%,
          transparent 68% 74%,
          #75b6e4 74% 77%,
          transparent 77% 83%,
          #75b6e4 83% 86%,
          transparent 86% 91%,
          #75b6e4 91% 94%,
          transparent 94%
        );
    }

    .mascot{
      position:absolute;
      z-index:7;
      left:50%;
      bottom:1%;
      width:min(58vw,710px);
      max-height:65vh;
      transform:translateX(-50%);
      object-fit:contain;
      object-position:center bottom;
      filter:drop-shadow(0 18px 20px rgba(0,30,65,.18));
    }

    .ribbon{
      position:absolute;
      z-index:5;
      left:-5%;
      bottom:-7%;
      width:112%;
      height:17%;
      background:linear-gradient(90deg,#00254f,#003c75);
      border-radius:50% 50% 0 0 / 35% 35% 0 0;
      transform:rotate(1.5deg);
    }

    .ribbon::before{
      content:"";
      position:absolute;
      left:0;
      top:-12px;
      width:100%;
      height:12px;
      border-radius:50%;
      background:var(--yellow);
    }

    /* RIGHT */

    .login-side{
      position:relative;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:clamp(14px,2vh,26px) clamp(35px,6vw,90px);
      background:linear-gradient(135deg,#fff 0%,#f7fbff 100%);
      overflow:hidden;
    }

    .top-accent{
      position:absolute;
      right:0;
      top:0;
      width:34%;
      height:14px;
      background:var(--yellow);
      transform:skewX(-38deg);
      transform-origin:right;
    }

    .login-card{
      width:100%;
      max-width:600px;
    }

    .language{
      display:flex;
      justify-content:flex-end;
      margin-bottom:8px;
    }

    .language-box{
      display:flex;
      gap:4px;
      padding:5px;
      border-radius:40px;
      background:#eef3f8;
    }

    .lang{
      border:0;
      background:transparent;
      padding:7px 15px;
      border-radius:25px;
      font-family:"Prompt",sans-serif;
      font-size:13px;
      color:var(--text);
      cursor:pointer;
    }

    .lang.active{
      color:#fff;
      background:var(--navy);
    }

    .brand{
      text-align:center;
      margin-bottom:16px;
    }

    .company-logo{
      display:block;
      width:min(330px,68%);
      max-height:150px;
      margin:0 auto 8px;
      object-fit:contain;
      object-position:center;
    }

    .brand h1{
      font-size:clamp(32px,3vw,50px);
      font-weight:700;
      line-height:1;
      letter-spacing:-1px;
      color:var(--navy);
    }

    .brand-line{
      width:120px;
      height:3px;
      margin:7px auto 8px;
      border-radius:10px;
      background:var(--yellow);
    }

    .brand .thai{
      font-size:clamp(15px,1.3vw,19px);
      font-weight:600;
      line-height:1.3;
    }

    .brand .english{
      margin-top:1px;
      font-size:clamp(14px,1.25vw,18px);
      font-weight:500;
      line-height:1.3;
      color:#59677e;
    }

    .admin-badge{
      display:inline-block;
      margin-top:6px;
      padding:3px 12px;
      border-radius:20px;
      background:#fff2b7;
      color:#705700;
      font-size:11px;
      font-weight:500;
    }

    .form-group{
      margin-bottom:12px;
    }

    .form-group label{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:5px;
      font-size:15px;
      font-weight:600;
    }

    .field{
      position:relative;
    }

    .field input{
      width:100%;
      height:52px;
      padding:0 52px 0 18px;
      border:1.5px solid var(--border);
      border-radius:12px;
      outline:none;
      background:#fff;
      font-family:"Prompt",sans-serif;
      font-size:15px;
      color:var(--text);
      transition:.2s;
    }

    .field input:focus{
      border-color:#78a9d2;
      box-shadow:0 0 0 4px rgba(0,91,160,.07);
    }

    .eye{
      position:absolute;
      right:17px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:transparent;
      cursor:pointer;
      font-size:20px;
    }

    .login-button{
      position:relative;
      width:100%;
      height:56px;
      margin-top:2px;
      border:0;
      border-radius:13px;
      background:linear-gradient(90deg,#ffd22b,var(--yellow));
      box-shadow:0 8px 20px rgba(255,196,0,.20);
      color:var(--navy);
      font-family:"Prompt",sans-serif;
      font-size:19px;
      font-weight:600;
      cursor:pointer;
    }

    .login-button:disabled{
      opacity:.65;
      cursor:not-allowed;
    }

    .arrow{
      position:absolute;
      right:9px;
      top:50%;
      transform:translateY(-50%);
      width:40px;
      height:40px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      background:var(--navy);
      color:#fff;
      font-size:23px;
    }

    .admin-only{
      display:flex;
      align-items:center;
      gap:13px;
      margin:12px 0 8px;
      font-size:13px;
      font-weight:500;
    }

    .admin-only::before,
    .admin-only::after{
      content:"";
      flex:1;
      height:1px;
      background:#cbd8e5;
    }

    .home{
      text-align:center;
    }

    .home a{
      color:var(--navy);
      font-size:14px;
      font-weight:600;
      text-decoration:underline;
      text-underline-offset:4px;
    }

    .message{
      min-height:20px;
      margin-top:8px;
      text-align:center;
      color:#d43838;
      font-size:12px;
      line-height:1.45;
    }

    .message.success{
      color:#168447;
    }

    @media (min-width:901px) and (max-height:850px){
      .welcome{top:3.2vh}
      .welcome h1{font-size:43px}
      .welcome h2{font-size:37px}
      .welcome-line{margin:10px auto 9px}
      .slogan{font-size:18px}
      .slogan-th{font-size:15px}

      .mascot{
        width:min(55vw,630px);
        max-height:64vh;
        bottom:1%;
      }

      .login-side{
        padding:10px clamp(35px,5vw,72px);
      }

      .language{margin-bottom:3px}

      .company-logo{
        width:min(260px,58%);
        max-height:94px;
        margin-bottom:5px;
      }

      .brand{margin-bottom:9px}
      .brand h1{font-size:34px}
      .brand-line{margin:4px auto 5px}

      .brand .thai,
      .brand .english{
        font-size:13px;
      }

      .admin-badge{
        margin-top:4px;
        font-size:9px;
      }

      .form-group{margin-bottom:8px}

      .form-group label{
        margin-bottom:3px;
        font-size:13px;
      }

      .field input{
        height:44px;
        font-size:13px;
      }

      .login-button{
        height:47px;
        font-size:16px;
      }

      .arrow{
        width:34px;
        height:34px;
        font-size:19px;
      }

      .admin-only{
        margin:7px 0 5px;
        font-size:11px;
      }

      .home a{font-size:12px}
    }

    @media(max-width:900px){
      html,body{height:auto}

      body{
        overflow:auto;
        overflow-x:hidden;
      }

      .page{
        display:block;
        height:auto;
      }

      .visual{
        height:650px;
      }

      .mascot{
        width:min(90vw,600px);
        max-height:470px;
        bottom:0;
      }

      .login-side{
        height:auto;
        min-height:700px;
        padding:40px 8% 55px;
      }

      .company-logo{
        width:min(310px,70%);
      }
    }

    @media(max-width:600px){
      .visual{height:550px}

      .welcome{
        top:30px;
        padding:0 14px;
      }

      .welcome h1{font-size:36px}
      .welcome h2{font-size:31px}

      .slogan{
        font-size:14px;
        white-space:normal;
      }

      .slogan-th{
        font-size:12px;
        white-space:normal;
      }

      .mascot{
        width:490px;
        max-width:105%;
        max-height:390px;
      }

      .login-side{
        min-height:auto;
        padding:30px 21px 45px;
      }

      .company-logo{
        width:min(280px,75%);
      }

      .brand h1{font-size:34px}
      .field input{height:53px}
      .login-button{height:55px}
    }
  </style>
</head>

<body>

<div class="page">

  <section class="visual">

    <div class="welcome">

      <h1 id="welcomeTitle">
        ยินดีต้อนรับ
      </h1>

      <h2 id="welcomeEnglish">
        Welcome
      </h2>

      <div class="welcome-line"></div>

      <div class="slogan">
        TRUST IN SAFETY.
        <span class="yellow">
          TRUST IN SANTE.
        </span>
      </div>

      <div class="slogan-th">
        เชื่อมั่นในความปลอดภัย
        &nbsp;&nbsp;
        <span class="yellow">
          เชื่อมั่นในซานเต้
        </span>
      </div>

    </div>

    <div class="white-wave"></div>
    <div class="light-wave"></div>
    <div class="skyline"></div>

    <img
      src="sante-admin-artwork.png"
      alt="SANTE Safety Mascot"
      class="mascot"
    >

    <div class="ribbon"></div>

  </section>


  <section class="login-side">

    <div class="top-accent"></div>

    <div class="login-card">

      <div class="language">

        <div class="language-box">

          <button
            class="lang active"
            id="thaiButton"
            type="button"
            onclick="setLanguage('th')"
          >
            🇹🇭 ไทย
          </button>

          <button
            class="lang"
            id="englishButton"
            type="button"
            onclick="setLanguage('en')"
          >
            🇬🇧 EN
          </button>

        </div>

      </div>


      <div class="brand">

        <img
          src="SANTE-logo.png"
          alt="SANTE Consulting Company Logo"
          class="company-logo"
        >

        <h1>SANTE SYSTEM</h1>

        <div class="brand-line"></div>

        <div class="thai" id="systemThai">
          ระบบบริหารจัดการ
        </div>

        <div class="english">
          SANTE Consulting
        </div>

        <div class="admin-badge">
          ● ADMINISTRATOR
        </div>

      </div>


      <form id="loginForm">

        <div class="form-group">

          <label id="emailLabel">
            ✉️ อีเมล
          </label>

          <div class="field">

            <input
              id="email"
              type="email"
              autocomplete="username"
              placeholder="example@santeconsulting.co.th"
              required
            >

          </div>

        </div>


        <div class="form-group">

          <label id="passwordLabel">
            🔒 รหัสผ่าน
          </label>

          <div class="field">

            <input
              id="password"
              type="password"
              autocomplete="current-password"
              placeholder="กรุณากรอกรหัสผ่าน"
              required
            >

            <button
              class="eye"
              type="button"
              onclick="togglePassword()"
              aria-label="Show password"
            >
              👁
            </button>

          </div>

        </div>


        <button
          id="loginButton"
          class="login-button"
          type="submit"
        >

          <span id="loginText">
            เข้าสู่ระบบ
          </span>

          <span class="arrow">
            →
          </span>

        </button>

      </form>


      <div class="admin-only">
        <span id="adminOnlyText">
          🔒 เฉพาะผู้ดูแลระบบเท่านั้น
        </span>
      </div>


      <div class="home">
        <a href="index.html" id="homeText">
          🏠 กลับหน้าหลัก
        </a>
      </div>


      <div
        id="message"
        class="message"
      ></div>

    </div>

  </section>

</div>


<script>

  /* =========================
     SUPABASE CONFIG
  ========================= */

  const SUPABASE_URL =
    "https://cyegjwerxlxhczrfiurz.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Hhr1LDrJqvzdEcHR4cScwA_YA9b9eYF";

  const AUTH_STORAGE_KEY =
    "sante-admin-auth";


  if (!window.supabase) {
    document.getElementById("message").textContent =
      "SYSTEM ERROR: ไม่สามารถโหลด Supabase library ได้";
    throw new Error("Supabase library failed to load.");
  }


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          storageKey: AUTH_STORAGE_KEY,
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );


  /* =========================
     LANGUAGE
  ========================= */

  let currentLanguage = "th";


  function setLanguage(language) {

    currentLanguage = language;

    const thaiButton =
      document.getElementById("thaiButton");

    const englishButton =
      document.getElementById("englishButton");


    thaiButton.classList.toggle(
      "active",
      language === "th"
    );

    englishButton.classList.toggle(
      "active",
      language === "en"
    );


    if (language === "th") {

      document.getElementById("welcomeTitle").textContent =
        "ยินดีต้อนรับ";

      document.getElementById("welcomeEnglish").textContent =
        "Welcome";

      document.getElementById("systemThai").textContent =
        "ระบบบริหารจัดการ";

      document.getElementById("emailLabel").textContent =
        "✉️ อีเมล";

      document.getElementById("passwordLabel").textContent =
        "🔒 รหัสผ่าน";

      document.getElementById("password").placeholder =
        "กรุณากรอกรหัสผ่าน";

      document.getElementById("loginText").textContent =
        "เข้าสู่ระบบ";

      document.getElementById("adminOnlyText").textContent =
        "🔒 เฉพาะผู้ดูแลระบบเท่านั้น";

      document.getElementById("homeText").textContent =
        "🏠 กลับหน้าหลัก";

    } else {

      document.getElementById("welcomeTitle").textContent =
        "Welcome";

      document.getElementById("welcomeEnglish").textContent =
        "SANTE";

      document.getElementById("systemThai").textContent =
        "Management System";

      document.getElementById("emailLabel").textContent =
        "✉️ Email";

      document.getElementById("passwordLabel").textContent =
        "🔒 Password";

      document.getElementById("password").placeholder =
        "Enter your password";

      document.getElementById("loginText").textContent =
        "Sign In";

      document.getElementById("adminOnlyText").textContent =
        "🔒 Administrators only";

      document.getElementById("homeText").textContent =
        "🏠 Back to Home";
    }
  }


  /* =========================
     PASSWORD
  ========================= */

  function togglePassword() {

    const password =
      document.getElementById("password");

    password.type =
      password.type === "password"
        ? "text"
        : "password";
  }


  /* =========================
     HELPERS
  ========================= */

  function showError(stage, error) {

    console.error(stage, error);

    const message =
      document.getElementById("message");

    const detail =
      error?.message ||
      error?.error_description ||
      String(error || "Unknown error");

    message.classList.remove("success");

    message.textContent =
      stage + ": " + detail;
  }


  function wait(milliseconds) {

    return new Promise(
      resolve =>
        setTimeout(
          resolve,
          milliseconds
        )
    );
  }


  /* =========================
     LOGIN
  ========================= */

  document
    .getElementById("loginForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        const message =
          document.getElementById("message");

        const button =
          document.getElementById("loginButton");

        const loginText =
          document.getElementById("loginText");


        message.textContent = "";
        message.classList.remove("success");

        button.disabled = true;

        loginText.textContent =
          currentLanguage === "th"
            ? "กำลังเข้าสู่ระบบ..."
            : "Signing in...";


        let shouldRestoreButton = true;


        try {

          /* STEP 1 — LOGIN */

          const {
            data: authData,
            error: authError
          } =
          await supabaseClient.auth
            .signInWithPassword({
              email: email,
              password: password
            });


          if (authError) {

            showError(
              "AUTH ERROR",
              authError
            );

            return;
          }


          if (!authData?.user || !authData?.session) {

            showError(
              "AUTH ERROR",
              new Error(
                "Login succeeded but no user/session was returned."
              )
            );

            return;
          }


          console.log(
            "AUTH OK:",
            authData.user.id
          );


          /* STEP 2 — VERIFY STORED SESSION */

          let activeSession = null;

          for (
            let attempt = 1;
            attempt <= 5;
            attempt++
          ) {

            const {
              data: sessionData,
              error: sessionError
            } =
            await supabaseClient.auth
              .getSession();


            if (sessionError) {

              showError(
                "SESSION ERROR",
                sessionError
              );

              return;
            }


            if (sessionData?.session) {

              activeSession =
                sessionData.session;

              break;
            }


            await wait(150);
          }


          if (!activeSession) {

            showError(
              "SESSION ERROR",
              new Error(
                "Supabase session was not available after login."
              )
            );

            return;
          }


          console.log(
            "SESSION OK:",
            activeSession.user.id
          );


          /* STEP 3 — STAFF PERMISSION */

          const {
            data: isStaff,
            error: staffError
          } =
          await supabaseClient.rpc(
            "is_staff"
          );


          if (staffError) {

            showError(
              "RPC ERROR",
              staffError
            );

            return;
          }


          console.log(
            "is_staff() =",
            isStaff
          );


          if (isStaff !== true) {

            await supabaseClient.auth
              .signOut();

            message.classList.remove(
              "success"
            );

            message.textContent =
              currentLanguage === "th"
                ? "PERMISSION ERROR: บัญชีนี้ไม่มีสิทธิ์ STAFF / ADMIN"
                : "PERMISSION ERROR: This account does not have STAFF / ADMIN access.";

            return;
          }


          /* STEP 4 — SUCCESS */

          message.classList.add(
            "success"
          );

          message.textContent =
            currentLanguage === "th"
              ? "เข้าสู่ระบบสำเร็จ กำลังเปิด SANTE Admin..."
              : "Login successful. Opening SANTE Admin...";


          loginText.textContent =
            currentLanguage === "th"
              ? "เข้าสู่ระบบสำเร็จ"
              : "Login successful";


          /*
            Keep the button locked while moving
            to the dashboard.
          */

          shouldRestoreButton = false;


          /*
            Small settling period after the
            session has been verified.
          */

          await wait(500);


          window.location.href =
            "./admin.html";


        } catch (error) {

          showError(
            "UNEXPECTED ERROR",
            error
          );

        } finally {

          if (shouldRestoreButton) {

            button.disabled = false;

            loginText.textContent =
              currentLanguage === "th"
                ? "เข้าสู่ระบบ"
                : "Sign In";
          }
        }
      }
    );

</script>

</body>
</html>
