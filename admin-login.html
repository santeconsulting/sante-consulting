<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SANTE SYSTEM | Admin Login</title>

  <link rel="preconnect" href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Ffonts.googleapis.com%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7C0277730517a84db69a9408df2106a071%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265984509187059%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=GPhdZYY3J2sGZa6pVGnIh%2Fc4ic%2BItR2Rxrro5Oy9EVQ%3D&reserved=0">
  <link rel="preconnect" href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Ffonts.gstatic.com%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7C0277730517a84db69a9408df2106a071%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265984509206425%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=3IrrMlgnoaUcGhhU5QHmZTLtNknpx0t80Av0tAbUUIs%3D&reserved=0" crossorigin>

  <style>
    :root{
      --navy:#06366c;
      --navy-dark:#032d5e;
      --blue:#0877bd;
      --yellow:#ffc400;
      --yellow-light:#ffd83d;
      --white:#ffffff;
      --text:#073568;
      --muted:#66758a;
      --border:#d6e0ec;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html,
    body{
      width:100%;
      min-height:100%;
    }

    body{
      font-family:"Prompt",sans-serif;
      background:#f5f8fc;
      color:var(--text);
    }

    /* ==============================
       MAIN
    ============================== */

    .page{
      width:100%;
      min-height:100vh;
      display:grid;
      grid-template-columns:52% 48%;
      overflow:hidden;
    }

    /* ==============================
       LEFT SIDE
    ============================== */

    .visual{
      position:relative;
      min-height:100vh;
      overflow:hidden;

      background:
        linear-gradient(
          145deg,
          #07386f 0%,
          #064d91 45%,
          #087fc0 100%
        );
    }

    .visual::before{
      content:"";
      position:absolute;
      width:520px;
      height:520px;
      border-radius:50%;
      left:-300px;
      top:-250px;
      background:rgba(255,255,255,.035);
    }

    .visual::after{
      content:"";
      position:absolute;
      width:700px;
      height:700px;
      border-radius:50%;
      right:-400px;
      top:-400px;
      background:rgba(255,255,255,.04);
    }

    /* welcome text */

    .welcome{
      position:absolute;
      z-index:5;

      top:7vh;
      left:0;
      width:100%;

      text-align:center;
      color:white;
      padding:0 30px;
    }

    .welcome h1{
      font-size:clamp(42px,4.5vw,72px);
      font-weight:700;
      line-height:1;
      letter-spacing:-1px;
    }

    .welcome h2{
      margin-top:4px;

      font-size:clamp(36px,4vw,64px);
      font-weight:700;
      line-height:1;

      color:var(--yellow);
    }

    .welcome-line{
      width:75px;
      height:4px;

      margin:24px auto 18px;

      border-radius:5px;
      background:var(--yellow);
    }

    .slogan{
      font-size:clamp(18px,1.65vw,27px);
      font-weight:600;
      letter-spacing:.2px;
    }

    .slogan span{
      color:var(--yellow);
    }

    .slogan-th{
      margin-top:5px;

      font-size:clamp(16px,1.45vw,23px);
      font-weight:400;
    }

    .slogan-th span{
      color:var(--yellow);
    }

    /* white wave */

    .white-wave{
      position:absolute;

      z-index:1;

      left:-10%;
      bottom:-10%;

      width:125%;
      height:67%;

      background:white;

      border-radius:
        52% 48% 0 0 /
        17% 20% 0 0;

      transform:rotate(-1.5deg);
    }

    .light-wave{
      position:absolute;

      z-index:2;

      left:-10%;
      bottom:0;

      width:125%;
      height:56%;

      background:
        linear-gradient(
          to bottom,
          rgba(215,237,255,.85),
          rgba(255,255,255,.2)
        );

      clip-path:polygon(
        0 14%,
        18% 6%,
        39% 12%,
        58% 4%,
        78% 10%,
        100% 1%,
        100% 100%,
        0 100%
      );
    }

    /* skyline */

    .skyline{
      position:absolute;

      z-index:3;

      left:0;
      bottom:12%;

      width:100%;
      height:23%;

      opacity:.45;

      background:
        linear-gradient(
          to top,
          #85bce7 0 5%,
          transparent 5%
        );
    }

    .skyline::before{
      content:"";

      position:absolute;
      left:0;
      right:0;
      bottom:0;

      height:100%;

      background:
        linear-gradient(
          90deg,

          transparent 0 5%,
          #8fc4ea 5% 7%,
          transparent 7% 10%,

          #8fc4ea 10% 12%,
          transparent 12% 16%,

          #8fc4ea 16% 19%,
          transparent 19% 23%,

          #8fc4ea 23% 25%,
          transparent 25% 31%,

          #8fc4ea 31% 34%,
          transparent 34% 39%,

          #8fc4ea 39% 42%,
          transparent 42% 48%,

          #8fc4ea 48% 51%,
          transparent 51% 57%,

          #8fc4ea 57% 60%,
          transparent 60% 68%,

          #8fc4ea 68% 71%,
          transparent 71% 76%,

          #8fc4ea 76% 79%,
          transparent 79% 86%,

          #8fc4ea 86% 89%,
          transparent 89%
        );
    }

    /* mascot */

    .mascot{
      position:absolute;

      z-index:6;

      width:min(53vw,650px);

      left:50%;
      bottom:-2%;

      transform:translateX(-50%);

      object-fit:contain;

      filter:
        drop-shadow(0 20px 20px rgba(0,35,70,.20));
    }

    /* bottom ribbon */

    .ribbon{
      position:absolute;

      z-index:5;

      left:-4%;
      bottom:-5%;

      width:110%;
      height:18%;

      background:var(--navy);

      border-radius:50% 50% 0 0 / 35% 35% 0 0;

      transform:rotate(2deg);
    }

    .ribbon::before{
      content:"";

      position:absolute;

      left:0;
      top:-14px;

      width:100%;
      height:13px;

      background:var(--yellow);

      border-radius:50%;
    }

    /* ==============================
       RIGHT SIDE
    ============================== */

    .login-side{
      position:relative;

      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:30px 7%;

      background:
        linear-gradient(
          135deg,
          #ffffff 0%,
          #f7fbff 100%
        );
    }

    .top-accent{
      position:absolute;

      right:0;
      top:0;

      width:34%;
      height:18px;

      background:var(--yellow);

      transform:skewX(-38deg);
      transform-origin:right;
    }

    .login-card{
      width:100%;
      max-width:620px;
    }

    /* language */

    .language{
      display:flex;
      justify-content:flex-end;

      margin-bottom:22px;
    }

    .language-box{
      padding:6px;

      border-radius:40px;

      background:#f0f4f8;

      display:flex;
      gap:5px;
    }

    .lang{
      border:0;
      background:transparent;

      padding:8px 16px;

      border-radius:25px;

      font-family:"Prompt",sans-serif;
      font-size:14px;

      cursor:pointer;

      color:var(--text);
    }

    .lang.active{
      background:var(--navy);
      color:white;
    }

    /* logo */

    .brand{
      text-align:center;
      margin-bottom:30px;
    }

    .brand-symbol{
      height:96px;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      margin-bottom:13px;
    }

    .brand-symbol span{
      display:block;

      width:24px;

      border-radius:30px;

      background:
        linear-gradient(
          to bottom,
          var(--yellow-light),
          var(--yellow)
        );
    }

    .brand-symbol span:nth-child(1){
      height:50px;
    }

    .brand-symbol span:nth-child(2){
      height:73px;
    }

    .brand-symbol span:nth-child(3){
      height:95px;
    }

    .brand-symbol span:nth-child(4){
      height:73px;
    }

    .brand-symbol span:nth-child(5){
      height:50px;
    }

    .brand h1{
      font-size:clamp(38px,3.4vw,57px);
      font-weight:700;

      letter-spacing:-1px;

      color:var(--navy);
    }

    .brand-line{
      width:130px;
      height:4px;

      margin:7px auto 11px;

      border-radius:10px;

      background:var(--yellow);
    }

    .brand .thai{
      font-size:20px;
      font-weight:600;
    }

    .brand .english{
      font-size:20px;
      font-weight:500;
      color:#53627b;
    }

    .admin-badge{
      display:inline-block;

      margin-top:9px;
      padding:4px 13px;

      border-radius:20px;

      background:#fff4c7;

      color:#745c00;

      font-size:12px;
      font-weight:500;
    }

    /* form */

    .form-group{
      margin-bottom:20px;
    }

    .form-group label{
      display:flex;
      align-items:center;
      gap:10px;

      margin-bottom:9px;

      font-size:17px;
      font-weight:600;
    }

    .field{
      position:relative;
    }

    .field input{
      width:100%;
      height:62px;

      padding:0 54px 0 20px;

      border:1.5px solid var(--border);

      border-radius:13px;

      outline:none;

      font-family:"Prompt",sans-serif;
      font-size:16px;

      color:var(--text);

      background:white;

      transition:.2s;
    }

    .field input:focus{
      border-color:#80acd4;

      box-shadow:
        0 0 0 4px rgba(0,91,160,.07);
    }

    .eye{
      position:absolute;

      right:18px;
      top:50%;

      transform:translateY(-50%);

      border:0;
      background:transparent;

      cursor:pointer;

      font-size:22px;
    }

    /* login button */

    .login-button{
      width:100%;
      height:67px;

      border:0;
      border-radius:14px;

      margin-top:5px;

      cursor:pointer;

      position:relative;

      font-family:"Prompt",sans-serif;
      font-size:21px;
      font-weight:600;

      color:var(--navy-dark);

      background:
        linear-gradient(
          90deg,
          #ffd31a,
          #ffc000
        );

      box-shadow:
        0 9px 25px rgba(255,193,0,.22);
    }

    .login-button:hover{
      filter:brightness(1.02);
    }

    .login-button:disabled{
      opacity:.65;
      cursor:not-allowed;
    }

    .arrow{
      position:absolute;

      right:11px;
      top:50%;

      transform:translateY(-50%);

      width:47px;
      height:47px;

      border-radius:50%;

      display:flex;
      align-items:center;
      justify-content:center;

      background:var(--navy);

      color:white;

      font-size:27px;
    }

    /* bottom */

    .admin-only{
      display:flex;
      align-items:center;
      gap:15px;

      margin:25px 0 18px;

      font-size:15px;
      font-weight:500;
    }

    .admin-only::before,
    .admin-only::after{
      content:"";
      flex:1;

      height:1px;

      background:#cbd8e5;
    }

    .home{
      text-align:center;
    }

    .home a{
      color:var(--navy);

      font-weight:600;
      font-size:16px;

      text-decoration:underline;
      text-underline-offset:4px;
    }

    .message{
      min-height:25px;

      margin-top:13px;

      text-align:center;

      font-size:14px;
      color:#d43838;
    }

    /* ==============================
       LAPTOP HEIGHT
    ============================== */

    @media(max-height:800px) and (min-width:901px){

      .welcome{
        top:4vh;
      }

      .welcome h1{
        font-size:42px;
      }

      .welcome h2{
        font-size:36px;
      }

      .welcome-line{
        margin:13px auto 10px;
      }

      .slogan{
        font-size:17px;
      }

      .slogan-th{
        font-size:14px;
      }

      .mascot{
        width:min(46vw,520px);
        bottom:-6%;
      }

      .login-side{
        padding-top:15px;
        padding-bottom:15px;
      }

      .language{
        margin-bottom:8px;
      }

      .brand{
        margin-bottom:14px;
      }

      .brand-symbol{
        height:58px;
        margin-bottom:6px;
      }

      .brand-symbol span{
        width:16px;
      }

      .brand-symbol span:nth-child(1){
        height:30px;
      }

      .brand-symbol span:nth-child(2){
        height:44px;
      }

      .brand-symbol span:nth-child(3){
        height:58px;
      }

      .brand-symbol span:nth-child(4){
        height:44px;
      }

      .brand-symbol span:nth-child(5){
        height:30px;
      }

      .brand h1{
        font-size:36px;
      }

      .brand .thai,
      .brand .english{
        font-size:15px;
      }

      .form-group{
        margin-bottom:11px;
      }

      .field input{
        height:49px;
      }

      .login-button{
        height:53px;
      }

      .arrow{
        width:38px;
        height:38px;
      }

      .admin-only{
        margin:13px 0 10px;
      }
    }

    /* ==============================
       TABLET / MOBILE
    ============================== */

    @media(max-width:900px){

      .page{
        display:block;
      }

      .visual{
        min-height:600px;
      }

      .login-side{
        min-height:auto;
        padding:45px 8% 60px;
      }

      .login-card{
        max-width:620px;
      }

      .mascot{
        width:min(90vw,550px);
      }
    }

    @media(max-width:600px){

      .visual{
        min-height:530px;
      }

      .welcome{
        top:45px;
      }

      .welcome h1{
        font-size:38px;
      }

      .welcome h2{
        font-size:34px;
      }

      .slogan{
        font-size:15px;
      }

      .slogan-th{
        font-size:13px;
      }

      .mascot{
        width:470px;
        max-width:100%;
      }

      .login-side{
        padding:35px 22px 50px;
      }

      .brand h1{
        font-size:36px;
      }

      .brand-symbol{
        transform:scale(.8);
      }
    }

  </style>
</head>

<body>

<div class="page">

  <!-- LEFT -->
  <section class="visual">

    <div class="welcome">

      <h1 id="welcomeTitle">
        ยินดีต้อนรับ
      </h1>

      <h2 id="welcomeEnglish">
        Welcome
      </h2>

      <div class="welcome-line"></div>

      <div class="slogan">
        TRUST IN SAFETY.
        <span>TRUST IN SANTE.</span>
      </div>

      <div class="slogan-th">
        เชื่อมั่นในความปลอดภัย
        &nbsp;&nbsp;
        <span>เชื่อมั่นในซานเต้</span>
      </div>

    </div>

    <div class="white-wave"></div>
    <div class="light-wave"></div>
    <div class="skyline"></div>

    <img
      src="sante-admin-artwork.png"
      alt="SANTE Safety Mascot"
      class="mascot"
    >

    <div class="ribbon"></div>

  </section>


  <!-- RIGHT -->
  <section class="login-side">

    <div class="top-accent"></div>

    <div class="login-card">

      <div class="language">

        <div class="language-box">

          <button
            class="lang active"
            id="thaiButton"
            type="button"
            onclick="setLanguage('th')"
          >
            🇹🇭 ไทย
          </button>

          <button
            class="lang"
            id="englishButton"
            type="button"
            onclick="setLanguage('en')"
          >
            🇬🇧 EN
          </button>

        </div>

      </div>


      <div class="brand">

        <div class="brand-symbol">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <h1>SANTE SYSTEM</h1>

        <div class="brand-line"></div>

        <div class="thai" id="systemThai">
          ระบบบริหารจัดการ
        </div>

        <div class="english">
          SANTE Consulting
        </div>

        <div class="admin-badge">
          ● ADMINISTRATOR
        </div>

      </div>


      <form id="loginForm">

        <div class="form-group">

          <label id="emailLabel">
            ✉️ อีเมล
          </label>

          <div class="field">

            <input
              id="email"
              type="email"
              autocomplete="username"
              placeholder="example@santeconsulting.co.th"
              required
            >

          </div>

        </div>


        <div class="form-group">

          <label id="passwordLabel">
            🔒 รหัสผ่าน
          </label>

          <div class="field">

            <input
              id="password"
              type="password"
              autocomplete="current-password"
              placeholder="กรุณากรอกรหัสผ่าน"
              required
            >

            <button
              class="eye"
              type="button"
              onclick="togglePassword()"
              aria-label="Show password"
            >
              👁
            </button>

          </div>

        </div>


        <button
          id="loginButton"
          class="login-button"
          type="submit"
        >

          <span id="loginText">
            เข้าสู่ระบบ
          </span>

          <span class="arrow">
            →
          </span>

        </button>

      </form>


      <div class="admin-only">

        <span id="adminOnlyText">
          🔒 เฉพาะผู้ดูแลระบบเท่านั้น
        </span>

      </div>


      <div class="home">

        <a
          href="index.html"
          id="homeText"
        >
          🏠 กลับหน้าหลัก
        </a>

      </div>

      <div
        id="message"
        class="message"
      ></div>

    </div>

  </section>

</div>


<script>

  /* ==============================
     SUPABASE
  ============================== */

  const SUPABASE_URL =
    "https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fcyegjwerxlxhczrfiurz.supabase.co%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7C0277730517a84db69a9408df2106a071%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265984509248307%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=sz7kGoSWUAgJglJxmdUTS8ID%2BT9uiXsW%2FsxsivcpYr0%3D&reserved=0";

  const SUPABASE_KEY =
    "sb_publishable_Hhr1LDrJqvzdEcHR4cScwA_YA9b9eYF";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==============================
     LANGUAGE
  ============================== */

  let currentLanguage = "th";

  function setLanguage(language){

    currentLanguage = language;

    const thaiButton =
      document.getElementById("thaiButton");

    const englishButton =
      document.getElementById("englishButton");

    thaiButton.classList.toggle(
      "active",
      language === "th"
    );

    englishButton.classList.toggle(
      "active",
      language === "en"
    );


    if(language === "th"){

      document.getElementById("welcomeTitle")

  /* ==============================
     PASSWORD
  ============================== */

  function togglePassword(){

    const password =
      document.getElementById("password");

    password.type =
      password.type === "password"
      ? "text"
      : "password";

  }


  /* ==============================
     LOGIN
  ============================== */

  document
    .getElementById("loginForm")
    .addEventListener(
      "submit",
      async function(event){

        event.preventDefault();

        const email =
          document
          .getElementById("email")
          .value
          .trim();

        const password =
          document
          .getElementById("password")
          .value;

        const message =
          document.getElementById("message");

        const button =
          document.getElementById("loginButton");

        const loginText =
          document.getElementById("loginText");


        message.textContent = "";

        button.disabled = true;

        loginText.textContent =
          currentLanguage === "th"
          ? "กำลังเข้าสู่ระบบ..."
          : "Signing in...";


        try{

          const {
            data,
            error
          } =
          await supabaseClient.auth
            .signInWithPassword({
              email,
              password
            });


          if(error){
            throw error;
          }


          /*
            ตรวจสอบสิทธิ์ STAFF / ADMIN
          */

          const {
            data: isStaff,
            error: staffError
          } =
          await supabaseClient.rpc(
            "is_staff"
          );


          if(staffError){
            throw staffError;
          }


          if(!isStaff){

            await supabaseClient.auth
              .signOut();

            message.textContent =
              currentLanguage === "th"
              ? "บัญชีนี้ไม่มีสิทธิ์เข้าสู่ระบบผู้ดูแล"
              : "This account does not have administrator access.";

            return;
          }


          /*
            Login สำเร็จ
          */

          window.location.href =
            "admin-dashboard.html";


        }catch(error){

          console.error(error);

          message.textContent =
            currentLanguage === "th"
            ? "อีเมลหรือรหัสผ่านไม่ถูกต้อง หรือไม่สามารถเข้าสู่ระบบได้"
            : "Invalid email or password, or unable to sign in.";

        }finally{

          button.disabled = false;

          loginText.textContent =
            currentLanguage === "th"
            ? "เข้าสู่ระบบ"
            : "Sign In";

        }

      }
    );

</script>
