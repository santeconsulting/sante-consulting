<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SANTE SYSTEM | Admin Login</title>

  <link rel="preconnect" href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Ffonts.googleapis.com%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7C165a509e77384e8aa8a808df2107c548%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265989417469991%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=6DTIt6yQz0GdklCI%2BnEkIx3GddyiAEHpjw3gXUM6wxI%3D&reserved=0">
  <link rel="preconnect" href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Ffonts.gstatic.com%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7C165a509e77384e8aa8a808df2107c548%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265989417490520%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=Sx0i8xhLMZq6IFr0zY5yjf2RB8l7yIoNXl8dWMyUjQg%3D&reserved=0" crossorigin>
  <link href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Ffonts.googleapis.com%2Fcss2%3Ffamily%3DPrompt%3Awght%40300%3B400%3B500%3B600%3B700%26display%3Dswap&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7C165a509e77384e8aa8a808df2107c548%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265989417503341%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=jB49nkB8JpSUrmkEFSyOrMIkbMqikeCIcGlk0UVShws%3D&reserved=0" rel="stylesheet">

  <script src="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fcdn.jsdelivr.net%2Fnpm%2F%40supabase%2Fsupabase-js%402&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7C165a509e77384e8aa8a808df2107c548%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265989417516067%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=cwiMFXw1I9XvwlBWRcIfbOCKFevJgvWCu0lwl5tR9Uo%3D&reserved=0"></script>

  <style>

    :root{
      --navy:#021f46;
      --navy-2:#03366f;
      --navy-3:#075a96;

      --yellow:#ffbf00;
      --yellow-light:#ffd43b;

      --white:#ffffff;

      --text:#052e60;
      --muted:#66758a;
      --border:#d6e0ec;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html,
    body{
      width:100%;
      min-height:100%;
    }

    body{
      font-family:"Prompt",sans-serif;
      background:#f5f8fc;
      color:var(--text);
    }

    button,
    input{
      font-family:"Prompt",sans-serif;
    }


    /* =====================================================
       MAIN PAGE
    ===================================================== */

    .page{
      width:100%;
      min-height:100vh;

      display:grid;
      grid-template-columns:52% 48%;

      overflow:hidden;
    }


    /* =====================================================
       LEFT VISUAL
    ===================================================== */

    .visual{
      position:relative;

      min-height:100vh;

      overflow:hidden;

      background:
        linear-gradient(
          145deg,
          var(--navy) 0%,
          var(--navy-2) 48%,
          var(--navy-3) 100%
        );
    }


    /* subtle decoration */

    .visual::before{
      content:"";

      position:absolute;

      width:520px;
      height:520px;

      border-radius:50%;

      left:-310px;
      top:-270px;

      background:
        rgba(255,255,255,.035);
    }

    .visual::after{
      content:"";

      position:absolute;

      width:700px;
      height:700px;

      border-radius:50%;

      right:-420px;
      top:-420px;

      background:
        rgba(255,255,255,.035);
    }


    /* =====================================================
       WELCOME
    ===================================================== */

    .welcome{
      position:absolute;

      z-index:10;

      top:6vh;
      left:0;

      width:100%;

      padding:0 30px;

      text-align:center;

      color:white;
    }

    .welcome h1{
      font-size:
        clamp(42px,4.3vw,70px);

      font-weight:700;

      line-height:1;

      letter-spacing:-1px;
    }

    .welcome h2{
      margin-top:5px;

      font-size:
        clamp(36px,3.8vw,60px);

      font-weight:700;

      line-height:1;

      color:var(--yellow);
    }

    .welcome-line{
      width:74px;
      height:4px;

      margin:
        22px auto
        17px;

      border-radius:10px;

      background:
        var(--yellow);
    }

    .slogan{
      font-size:
        clamp(18px,1.55vw,26px);

      font-weight:600;

      line-height:1.3;

      letter-spacing:.2px;
    }

    .slogan span{
      color:var(--yellow);
    }

    .slogan-th{
      margin-top:6px;

      font-size:
        clamp(15px,1.35vw,22px);

      font-weight:400;

      line-height:1.4;
    }

    .slogan-th span{
      color:var(--yellow);
    }


    /* =====================================================
       WHITE WAVE
    ===================================================== */

    .white-wave{
      position:absolute;

      z-index:1;

      left:-10%;
      bottom:-10%;

      width:125%;
      height:66%;

      background:white;

      border-radius:
        52% 48% 0 0 /
        17% 20% 0 0;

      transform:
        rotate(-1.5deg);
    }


    /* =====================================================
       LIGHT BLUE WAVE
    ===================================================== */

    .light-wave{
      position:absolute;

      z-index:2;

      left:-10%;
      bottom:0;

      width:125%;
      height:55%;

      background:
        linear-gradient(
          to bottom,
          rgba(215,237,255,.86),
          rgba(255,255,255,.2)
        );

      clip-path:
        polygon(
          0 14%,
          18% 6%,
          39% 12%,
          58% 4%,
          78% 10%,
          100% 1%,
          100% 100%,
          0 100%
        );
    }


    /* =====================================================
       INDUSTRIAL SKYLINE
    ===================================================== */

    .skyline{
      position:absolute;

      z-index:3;

      left:0;
      bottom:11%;

      width:100%;
      height:23%;

      opacity:.42;
    }

    .skyline::before{
      content:"";

      position:absolute;

      left:0;
      right:0;
      bottom:0;

      height:100%;

      background:
        linear-gradient(
          90deg,

          transparent 0 5%,

          #8fc4ea 5% 7%,

          transparent 7% 10%,

          #8fc4ea 10% 12%,

          transparent 12% 16%,

          #8fc4ea 16% 19%,

          transparent 19% 23%,

          #8fc4ea 23% 25%,

          transparent 25% 31%,

          #8fc4ea 31% 34%,

          transparent 34% 39%,

          #8fc4ea 39% 42%,

          transparent 42% 48%,

          #8fc4ea 48% 51%,

          transparent 51% 57%,

          #8fc4ea 57% 60%,

          transparent 60% 68%,

          #8fc4ea 68% 71%,

          transparent 71% 76%,

          #8fc4ea 76% 79%,

          transparent 79% 86%,

          #8fc4ea 86% 89%,

          transparent 89%
        );
    }


    /* =====================================================
       MASCOT
    ===================================================== */

    .mascot{
      position:absolute;

      z-index:7;

      width:
        min(51vw,620px);

      max-height:62vh;

      left:49%;
      bottom:-2%;

      transform:
        translateX(-50%);

      object-fit:contain;

      filter:
        drop-shadow(
          0 18px 18px
          rgba(0,30,65,.18)
        );
    }


    /* =====================================================
       BOTTOM NAVY RIBBON
    ===================================================== */

    .ribbon{
      position:absolute;

      z-index:5;

      left:-4%;
      bottom:-6%;

      width:110%;
      height:18%;

      background:
        var(--navy);

      border-radius:
        50% 50% 0 0 /
        35% 35% 0 0;

      transform:
        rotate(2deg);
    }

    .ribbon::before{
      content:"";

      position:absolute;

      left:0;
      top:-12px;

      width:100%;
      height:12px;

      border-radius:50%;

      background:
        var(--yellow);
    }


    /* =====================================================
       RIGHT LOGIN SIDE
    ===================================================== */

    .login-side{
      position:relative;

      min-height:100vh;

      display:flex;

      align-items:center;
      justify-content:center;

      padding:
        30px 7%;

      background:
        linear-gradient(
          135deg,
          #ffffff 0%,
          #f7fbff 100%
        );
    }


    /* yellow top decoration */

    .top-accent{
      position:absolute;

      right:0;
      top:0;

      width:34%;
      height:17px;

      background:
        var(--yellow);

      transform:
        skewX(-38deg);

      transform-origin:right;
    }


    .login-card{
      width:100%;

      max-width:600px;
    }


    /* =====================================================
       LANGUAGE
    ===================================================== */

    .language{
      display:flex;

      justify-content:flex-end;

      margin-bottom:18px;
    }

    .language-box{
      padding:5px;

      border-radius:40px;

      background:#f0f4f8;

      display:flex;

      gap:5px;
    }

    .lang{
      border:0;

      background:transparent;

      padding:
        8px 16px;

      border-radius:25px;

      font-size:14px;

      cursor:pointer;

      color:var(--text);

      transition:.2s;
    }

    .lang.active{
      background:
        var(--navy);

      color:white;
    }


    /* =====================================================
       SANTE BRAND
    ===================================================== */

    .brand{
      text-align:center;

      margin-bottom:26px;
    }

    .brand-symbol{
      height:90px;

      display:flex;

      align-items:center;
      justify-content:center;

      gap:9px;

      margin-bottom:12px;
    }

    .brand-symbol span{
      display:block;

      width:23px;

      border-radius:30px;

      background:
        linear-gradient(
          to bottom,
          var(--yellow-light),
          var(--yellow)
        );
    }

    .brand-symbol span:nth-child(1){
      height:47px;
    }

    .brand-symbol span:nth-child(2){
      height:68px;
    }

    .brand-symbol span:nth-child(3){
      height:90px;
    }

    .brand-symbol span:nth-child(4){
      height:68px;
    }

    .brand-symbol span:nth-child(5){
      height:47px;
    }

    .brand h1{
      font-size:
        clamp(38px,3.3vw,55px);

      font-weight:700;

      line-height:1.05;

      letter-spacing:-1px;

      color:
        var(--navy);
    }

    .brand-line{
      width:120px;
      height:4px;

      margin:
        8px auto
        10px;

      border-radius:10px;

      background:
        var(--yellow);
    }

    .brand .thai{
      font-size:19px;

      font-weight:600;

      color:
        var(--navy);
    }

    .brand .english{
      font-size:19px;

      font-weight:500;

      color:#53627b;
    }

    .admin-badge{
      display:inline-block;

      margin-top:8px;

      padding:
        4px 13px;

      border-radius:20px;

      background:#fff4c7;

      color:#745c00;

      font-size:12px;

      font-weight:500;
    }


    /* =====================================================
       FORM
    ===================================================== */

    .form-group{
      margin-bottom:18px;
    }

    .form-group label{
      display:flex;

      align-items:center;

      gap:9px;

      margin-bottom:8px;

      font-size:16px;

      font-weight:600;
    }

    .field{
      position:relative;
    }

    .field input{
      width:100%;

      height:60px;

      padding:
        0 54px
        0 20px;

      border:
        1.5px solid
        var(--border);

      border-radius:13px;

      outline:none;

      font-size:16px;

      color:
        var(--text);

      background:white;

      transition:.2s;
    }

    .field input:focus{
      border-color:#80acd4;

      box-shadow:
        0 0 0 4px
        rgba(0,91,160,.07);
    }

    .eye{
      position:absolute;

      right:18px;
      top:50%;

      transform:
        translateY(-50%);

      border:0;

      background:transparent;

      cursor:pointer;

      font-size:21px;
    }


    /* =====================================================
       LOGIN BUTTON
    ===================================================== */

    .login-button{
      width:100%;

      height:64px;

      border:0;

      border-radius:14px;

      margin-top:4px;

      cursor:pointer;

      position:relative;

      font-size:20px;

      font-weight:600;

      color:
        var(--navy);

      background:
        linear-gradient(
          90deg,
          #ffd31a,
          var(--yellow)
        );

      box-shadow:
        0 9px 25px
        rgba(255,193,0,.20);

      transition:.2s;
    }

    .login-button:hover{
      filter:
        brightness(1.025);
    }

    .login-button:disabled{
      opacity:.65;

      cursor:not-allowed;
    }

    .arrow{
      position:absolute;

      right:10px;
      top:50%;

      transform:
        translateY(-50%);

      width:45px;
      height:45px;

      border-radius:50%;

      display:flex;

      align-items:center;
      justify-content:center;

      background:
        var(--navy);

      color:white;

      font-size:26px;
    }


    /* =====================================================
       ADMIN ONLY / HOME
    ===================================================== */

    .admin-only{
      display:flex;

      align-items:center;

      gap:14px;

      margin:
        22px 0
        16px;

      font-size:14px;

      font-weight:500;
    }

    .admin-only::before,
    .admin-only::after{
      content:"";

      flex:1;

      height:1px;

      background:#cbd8e5;
    }

    .home{
      text-align:center;
    }

    .home a{
      color:
        var(--navy);

      font-weight:600;

      font-size:15px;

      text-decoration:underline;

      text-underline-offset:4px;
    }

    .message{
      min-height:22px;

      margin-top:10px;

      text-align:center;

      font-size:13px;

      color:#d43838;
    }


    /* =====================================================
       LAPTOP / DESKTOP 100% FIX
       1366x768 / 1366x768-like screens
    ===================================================== */

    @media
    (min-width:901px)
    and
    (max-height:850px){

      html,
      body{
        width:100%;
        height:100%;

        overflow:hidden;
      }

      .page{
        width:100vw;
        height:100vh;

        min-height:0;

        grid-template-columns:
          52% 48%;

        overflow:hidden;
      }


      /* LEFT */

      .visual{
        height:100vh;

        min-height:0;
      }

      .welcome{
        top:3.8vh;

        padding:
          0 24px;
      }

      .welcome h1{
        font-size:
          clamp(32px,3vw,46px);
      }

      .welcome h2{
        margin-top:3px;

        font-size:
          clamp(28px,2.7vw,40px);
      }

      .welcome-line{
        width:62px;

        height:3px;

        margin:
          11px auto
          9px;
      }

      .slogan{
        font-size:
          clamp(14px,1.3vw,19px);
      }

      .slogan-th{
        margin-top:3px;

        font-size:
          clamp(12px,1.1vw,16px);
      }

      .white-wave{
        bottom:-14%;

        height:65%;
      }

      .light-wave{
        bottom:-2%;

        height:54%;
      }

      .skyline{
        bottom:9%;

        height:21%;

        opacity:.38;
      }

      .mascot{
        width:
          min(40vw,490px);

        max-height:59vh;

        left:48%;

        bottom:-4%;
      }

      .ribbon{
        bottom:-8%;

        height:17%;
      }

      .ribbon::before{
        top:-10px;

        height:10px;
      }


      /* RIGHT */

      .login-side{
        height:100vh;

        min-height:0;

        padding:
          10px
          clamp(35px,5vw,70px);

        overflow:hidden;
      }

      .top-accent{
        height:11px;
      }

      .login-card{
        max-width:510px;
      }


      /* language */

      .language{
        margin-bottom:4px;
      }

      .language-box{
        padding:3px;
      }

      .lang{
        padding:
          5px 12px;

        font-size:11px;
      }


      /* brand */

      .brand{
        margin-bottom:9px;
      }

      .brand-symbol{
        height:48px;

        gap:6px;

        margin-bottom:4px;
      }

      .brand-symbol span{
        width:13px;
      }

      .brand-symbol span:nth-child(1){
        height:25px;
      }

      .brand-symbol span:nth-child(2){
        height:37px;
      }

      .brand-symbol span:nth-child(3){
        height:48px;
      }

      .brand-symbol span:nth-child(4){
        height:37px;
      }

      .brand-symbol span:nth-child(5){
        height:25px;
      }

      .brand h1{
        font-size:32px;
      }

      .brand-line{
        width:85px;

        height:3px;

        margin:
          4px auto
          5px;
      }

      .brand .thai{
        font-size:13px;
      }

      .brand .english{
        font-size:13px;
      }

      .admin-badge{
        margin-top:4px;

        padding:
          2px 9px;

        font-size:9px;
      }


      /* FORM */

      .form-group{
        margin-bottom:8px;
      }

      .form-group label{
        gap:6px;

        margin-bottom:4px;

        font-size:13px;
      }

      .field input{
        height:42px;

        padding:
          0 45px
          0 15px;

        border-radius:10px;

        font-size:13px;
      }

      .eye{
        right:14px;

        font-size:17px;
      }


      /* LOGIN */

      .login-button{
        height:46px;

        margin-top:1px;

        border-radius:10px;

        font-size:16px;
      }

      .arrow{
        right:6px;

        width:34px;
        height:34px;

        font-size:20px;
      }


      /* FOOTER */

      .admin-only{
        gap:9px;

        margin:
          8px 0
          6px;

        font-size:11px;
      }

      .home a{
        font-size:12px;
      }

      .message{
        min-height:14px;

        margin-top:4px;

        font-size:10px;
      }

    }


    /* =====================================================
       TABLET
    ===================================================== */

    @media(max-width:900px){

      html,
      body{
        overflow:auto;
      }

      .page{
        display:block;

        min-height:100vh;
      }

      .visual{
        min-height:600px;
      }

      .login-side{
        min-height:auto;

        padding:
          45px 8%
          60px;
      }

      .login-card{
        max-width:620px;
      }

      .mascot{
        width:
          min(90vw,550px);

        max-height:390px;
      }

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media(max-width:600px){

      .visual{
        min-height:530px;
      }

      .welcome{
        top:38px;

        padding:
          0 16px;
      }

      .welcome h1{
        font-size:36px;
      }

      .welcome h2{
        font-size:31px;
      }

      .welcome-line{
        margin:
          13px auto
          10px;
      }

      .slogan{
        font-size:14px;
      }

      .slogan-th{
        font-size:12px;
      }

      .mascot{
        width:450px;

        max-width:100%;

        bottom:-1%;
      }

      .login-side{
        padding:
          30px 22px
          45px;
      }

      .language{
        margin-bottom:15px;
      }

      .brand h1{
        font-size:34px;
      }

      .brand-symbol{
        transform:
          scale(.8);

        margin-bottom:5px;
      }

      .field input{
        height:55px;
      }

      .login-button{
        height:58px;
      }

    }

  </style>
</head>


<body>


<div class="page">


  <!-- ===================================================
       LEFT
  ==================================================== -->

  <section class="visual">


    <div class="welcome">

      <h1 id="welcomeTitle">
        ยินดีต้อนรับ
      </h1>

      <h2 id="welcomeEnglish">
        Welcome
      </h2>


      <div class="welcome-line"></div>


      <div class="slogan">

        TRUST IN SAFETY.

        <span>
          TRUST IN SANTE.
        </span>

      </div>


      <div class="slogan-th">

        เชื่อมั่นในความปลอดภัย

        &nbsp;&nbsp;

        <span>
          เชื่อมั่นในซานเต้
        </span>

      </div>

    </div>


    <div class="white-wave"></div>

    <div class="light-wave"></div>

    <div class="skyline"></div>


    <img
      src="sante-admin-artwork.png"
      alt="SANTE Safety Mascot"
      class="mascot"
    >


    <div class="ribbon"></div>


  </section>



  <!-- ===================================================
       RIGHT

      <!-- LOGIN FORM -->

      <form id="loginForm">


        <div class="form-group">


          <label id="emailLabel">

          <div class="field">


            <input
              id="email"
              type="email"
              autocomplete="username"

        <div class="form-group">


          <label id="passwordLabel">

          </label>


          <div class="field">


            <input
              id="password"

              autocomplete="current-password"
              placeholder="กรุณากรอกรหัสผ่าน"

            >


            <button

              type="button"
              onclick="togglePassword()"
              aria-label="Show password"

              👁

          </div>

        </div>



        <button
          id="loginButton"

</div>



<script>


  /* =====================================================
     SUPABASE
  ===================================================== */


  const SUPABASE_URL =
    "https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fcyegjwerxlxhczrfiurz.supabase.co%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7C165a509e77384e8aa8a808df2107c548%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265989417528654%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=bLLD5IOOjeDj5HPZn%2BBZ1ywztKLZi3HJNdHAUNJPblk%3D&reserved=0";


  const SUPABASE_KEY =
    "sb_publishable_Hhr1LDrJqvzdEcHR4cScwA_YA9b9eYF";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );



  /* =====================================================
     LANGUAGE
  ===================================================== */


  let currentLanguage = "th";


  function setLanguage(language){


    currentLanguage =
      language;


    const thaiButton =
      document.getElementById(
        "thaiButton"
      );


    const englishButton =
      document.getElementById(
        "englishButton"
      );


    thaiButton.classList.toggle(
      "active",
      language === "th"
    );


    englishButton.classList.toggle(
      "active",
      language === "en"
    );



    if(language === "th"){


      document
        .getElementById(
          "welcomeTitle"
        )
        .textContent =
        "ยินดีต้อนรับ";


      document
        .getElementById(
          "welcomeEnglish"
        )
        .textContent =
        "Welcome";


      document
        .getElementById(
          "systemThai"
        )
        .textContent =
        "ระบบบริหารจัดการ";


      document
        .getElementById(
          "emailLabel"
        )
        .textContent =
        "✉️ อีเมล";


      document
        .getElementById(
          "passwordLabel"
        )
        .textContent =
        "🔒 รหัสผ่าน";


      document
        .getElementById(
          "password"
        )
        .placeholder =
        "กรุณากรอกรหัสผ่าน";


      document
        .getElementById(
          "loginText"
        )
        .textContent =
        "เข้าสู่ระบบ";


      document
        .getElementById(
          "adminOnlyText"
        )
        .textContent =
        "🔒 เฉพาะผู้ดูแลระบบเท่านั้น";


      document
        .getElementById(
          "homeText"
        )
        .textContent =
        "🏠 กลับหน้าหลัก";


    }else{


      document
        .getElementById(
          "welcomeTitle"
        )
        .textContent =
        "Welcome";


      document
        .getElementById(
          "welcomeEnglish"
        )
        .textContent =
        "SANTE";


      document
        .getElementById(
          "systemThai"
        )
        .textContent =
        "Management System";


      document
        .getElementById(
          "emailLabel"
        )
        .textContent =
        "✉️ Email";


      document
        .getElementById(
          "passwordLabel"
        )
        .textContent =
        "🔒 Password";


      document
        .getElementById(
          "password"
        )
        .placeholder =
        "Enter your password";


      document
        .getElementById(
          "loginText"
        )
        .textContent =
        "Sign In";


      document
        .getElementById(
          "adminOnlyText"
        )
        .textContent =
        "🔒 Administrators only";


      document
        .getElementById(
          "homeText"
        )
        .textContent =
        "🏠 Back to Home";


    }

  }



  /* =====================================================
     PASSWORD SHOW / HIDE
  ===================================================== */


  function togglePassword(){


    const password =
      document.getElementById(
        "password"
      );


    password.type =
      password.type === "password"
      ? "text"
      : "password";

  }



  /* =====================================================
     LOGIN
  ===================================================== */


  document
    .getElementById(
      "loginForm"
    )
    .addEventListener(
      "submit",
      async function(event){


        event.preventDefault();


        const email =
          document
            .getElementById(
              "email"
            )
            .value
            .trim();


        const password =
          document
            .getElementById(
              "password"
            )
            .value;


        const message =
          document.getElementById(
            "message"
          );


        const button =
          document.getElementById(
            "loginButton"
          );


        const loginText =
          document.getElementById(
            "loginText"
          );


        message.textContent =
          "";


        button.disabled =
          true;


        loginText.textContent =
          currentLanguage === "th"
          ? "กำลังเข้าสู่ระบบ..."
          : "Signing in...";


        try{


          const {
            data,
            error
          } =
          await supabaseClient.auth
            .signInWithPassword({

              email,
              password

            });


          if(error){

            throw error;

          }



          /* =============================================
             CHECK STAFF / ADMIN PERMISSION
          ============================================= */


          const {
            data: isStaff,
            error: staffError
          } =
          await supabaseClient.rpc(
            "is_staff"
          );


          if(staffError){

            throw staffError;

          }



          if(!isStaff){


            await supabaseClient.auth
              .signOut();


            message.textContent =
              currentLanguage === "th"
              ? "บัญชีนี้ไม่มีสิทธิ์เข้าสู่ระบบผู้ดูแล"
              : "This account does not have administrator access.";


            return;

          }



          /* =============================================
             LOGIN SUCCESS
          ============================================= */


          window.location.href =
            "admin-dashboard.html";


        }catch(error){


          console.error(error);


          message.textContent =
            currentLanguage === "th"
            ? "อีเมลหรือรหัสผ่านไม่ถูกต้อง หรือไม่สามารถเข้าสู่ระบบได้"
            : "Invalid email or password, or unable to sign in.";


        }finally{


          button.disabled =
            false;


          loginText.textContent =
            currentLanguage === "th"
            ? "เข้าสู่ระบบ"
            : "Sign In";


        }

      }
    );


</script>
