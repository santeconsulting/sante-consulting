<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SANTE SYSTEM | Admin Login</title>

  <!-- Prompt Font -->
  <link rel="preconnect" href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Ffonts.googleapis.com%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7Cc9f7a75f025c4f43b70b08df21018a2c%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265962641196352%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=JKb7UflNmTtIRxZwQ44ZSNsnmxUOP%2BsV1Z2omI%2Bo7Hs%3D&reserved=0">
  <link rel="preconnect" href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Ffonts.gstatic.com%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7Cc9f7a75f025c4f43b70b08df21018a2c%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265962641217154%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=NTGvhpWwxhRoXn31f%2F1rBUf7yQhHl5M430wxYeJ2nas%3D&reserved=0" crossorigin>
  <link href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Ffonts.googleapis.com%2Fcss2%3Ffamily%3DPrompt%3Awght%40300%3B400%3B500%3B600%3B700%3B800%26display%3Dswap&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7Cc9f7a75f025c4f43b70b08df21018a2c%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265962641229957%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=Jz%2FzA4H0jLVpulm0FHdhOTr5KUlh19I%2BU5wVOOAViNk%3D&reserved=0" rel="stylesheet">

  <!-- Supabase -->
  <script src="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fcdn.jsdelivr.net%2Fnpm%2F%40supabase%2Fsupabase-js%402&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7Cc9f7a75f025c4f43b70b08df21018a2c%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265962641242702%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=1Ir5zP4qTboma8pU5Log9gU7dBPj78fhBCeypb2JLYM%3D&reserved=0"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #07376f;
      --navy-dark: #032857;
      --navy-deep: #021d42;
      --yellow: #ffc400;
      --yellow-light: #ffd83d;
      --white: #ffffff;
      --text: #0b376b;
      --muted: #6e7d92;
      --border: #d9e2ee;
    }

    body {
      font-family: "Prompt", sans-serif;
      min-height: 100vh;
      background: #f3f7fb;
      color: var(--text);
    }

    button,
    input {
      font-family: "Prompt", sans-serif;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.03fr 1fr;
    }

    /* ==============================
       LEFT SIDE
    ============================== */

    .brand-panel {
      position: relative;
      min-height: 100vh;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 25% 25%,
          rgba(32, 105, 176, 0.7),
          transparent 36%
        ),
        linear-gradient(
          145deg,
          #0b4d8c 0%,
          #063a73 42%,
          #032858 72%,
          #021d42 100%
        );

      display: flex;
      flex-direction: column;
      padding: 54px 60px 28px;
    }

    .brand-panel::before {
      content: "";
      position: absolute;
      width: 720px;
      height: 720px;
      border-radius: 50%;
      background: rgba(255,255,255,0.035);
      left: -370px;
      top: -400px;
    }

    .brand-panel::after {
      content: "";
      position: absolute;
      width: 650px;
      height: 650px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 50%;
      left: -350px;
      bottom: -430px;
    }

    .brand-content {
      position: relative;
      z-index: 4;
      text-align: center;
    }

    .logo-symbol {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      height: 88px;
      margin-bottom: 14px;
    }

    .logo-symbol span {
      display: block;
      width: 23px;
      border-radius: 20px;
      background: linear-gradient(
        180deg,
        #ffd739,
        #ffbd00
      );
      box-shadow: 0 3px 12px rgba(255, 196, 0, .18);
    }

    .logo-symbol span:nth-child(1) {
      height: 47px;
    }

    .logo-symbol span:nth-child(2) {
      height: 69px;
    }

    .logo-symbol span:nth-child(3) {
      height: 88px;
    }

    .logo-symbol span:nth-child(4) {
      height: 69px;
    }

    .logo-symbol span:nth-child(5) {
      height: 47px;
    }

    .company-th {
      color: var(--yellow);
      font-size: clamp(20px, 1.8vw, 28px);
      font-weight: 700;
      line-height: 1.4;
    }

    .company-en {
      color: var(--yellow);
      font-size: clamp(19px, 1.65vw, 27px);
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: .3px;
    }

    .company-description {
      color: white;
      font-size: clamp(16px, 1.45vw, 23px);
      font-weight: 400;
      line-height: 1.65;
      margin-top: 14px;
    }

    .short-line {
      width: 82px;
      height: 4px;
      border-radius: 20px;
      background: var(--yellow);
      margin: 13px auto 0;
    }

    /* Artwork */

    .artwork-wrap {
      position: absolute;
      z-index: 3;

      left: 0;
      right: 0;
      bottom: 0;

      height: 67%;

      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .artwork {
      display: block;
      width: 94%;
      max-width: 820px;
      max-height: 100%;
      object-fit: contain;
      object-position: center bottom;
      position: relative;
      z-index: 3;
    }

    /* Decorative curves */

    .curve-white {
      position: absolute;
      z-index: 1;
      left: -12%;
      right: -12%;
      bottom: 7%;
      height: 36%;
      background: #f9fcff;
      border-radius: 50% 50% 0 0 / 35% 35% 0 0;
      transform: rotate(-2deg);
      opacity: .97;
    }

    .curve-yellow {
      position: absolute;
      z-index: 2;
      left: -10%;
      right: -20%;
      bottom: 4%;
      height: 18px;
      background: var(--yellow);
      border-radius: 50%;
      transform: rotate(5deg);
    }

    .curve-navy {
      position: absolute;
      z-index: 1;
      left: -12%;
      width: 120%;
      bottom: -13%;
      height: 29%;
      background: #05376e;
      border-radius: 50% 50% 0 0;
      transform: rotate(4deg);
    }

    /* ==============================
       RIGHT SIDE
    ============================== */

    .login-panel {
      position: relative;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 42px;

      background:
        radial-gradient(
          circle at 95% 10%,
          rgba(43, 112, 190, .12),
          transparent 27%
        ),
        linear-gradient(
          145deg,
          #f8fbff,
          #ffffff 52%,
          #eef5fd
        );

      overflow: hidden;
    }

    .login-panel::before {
      content: "";
      position: absolute;
      width: 460px;
      height: 35px;
      background: var(--yellow);
      top: -5px;
      right: -100px;
      transform: rotate(-40deg);
    }

    .login-panel::after {
      content: "";
      position: absolute;
      width: 520px;
      height: 45px;
      background: var(--navy);
      top: 17px;
      right: -150px;
      transform: rotate(-40deg);
    }

    .login-card {
      position: relative;
      z-index: 5;

      width: min(100%, 620px);

      background: rgba(255,255,255,.97);

      border-radius: 32px;

      padding: 28px 48px 36px;

      box-shadow:
        0 24px 70px rgba(5, 47, 95, .13),
        0 4px 16px rgba(5, 47, 95, .05);

      border: 1px solid rgba(255,255,255,.85);
    }

    /* Language */

    .language-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 5px;
    }

    .language-switch {
      display: inline-flex;
      align-items: center;
      background: #f0f3f8;
      padding: 4px;
      border-radius: 30px;
      gap: 2px;
    }

    .lang-btn {
      border: 0;
      background: transparent;
      padding: 9px 16px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 15px;
      color: #526176;
      transition: .2s;
    }

    .lang-btn.active {
      color: white;
      background: var(--navy);
      box-shadow: 0 4px 12px rgba(5,55,111,.2);
    }

    /* Card Logo */

    .card-logo {
      text-align: center;
      margin-top: 3px;
    }

    .mini-symbol {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      height: 100px;
      margin-bottom: 10px;
    }

    .mini-symbol span {
      width: 20px;
      display: block;
      border-radius: 20px;
      background: linear-gradient(
        180deg,
        #ffd63c,
        #ffc000
      );
    }

    .mini-symbol span:nth-child(1),
    .mini-symbol span:nth-child(5) {
      height: 48px;
    }

    .mini-symbol span:nth-child(2),
    .mini-symbol span:nth-child(4) {
      height: 70px;
    }

    .mini-symbol span:nth-child(3) {
      height: 98px;
    }

    .system-title {
      font-size: clamp(34px, 3vw, 49px);
      line-height: 1.05;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: .5px;
    }

    .system-subtitle {
      margin-top: 14px;
      color: var(--navy);
      font-size: 19px;
      font-weight: 600;
      line-height: 1.5;
    }

    .system-subtitle-en {
      color: #53647b;
      font-size: 18px;
      font-weight: 500;
    }

    /* Form */

    .login-form {
      margin-top: 26px;
    }

    .field {
      margin-bottom: 19px;
    }

    .field-label {
      display: flex;
      align-items: center;
      gap: 10px;

      color: var(--navy);
      font-weight: 600;
      font-size: 17px;

      margin-bottom: 9px;
    }

    .field-icon {
      width: 27px;
      height: 27px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .field-icon svg {
      width: 25px;
      height: 25px;
      stroke: var(--navy);
      stroke-width: 2;
      fill: none;
    }

    .input-wrap {
      position: relative;
    }

    .form-input {
      width: 100%;
      height: 62px;

      border: 1.5px solid #cad6e5;
      border-radius: 12px;

      padding: 0 18px;

      outline: none;

      color: #173b68;
      background: white;

      font-size: 16px;

      transition: .2s;
    }

    .form-input::placeholder {
      color: #9aa6b7;
    }

    .form-input:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 4px rgba(5, 55, 111, .08);
    }

    .password-input {
      padding-right: 60px;
    }

    .toggle-password {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);

      width: 42px;
      height: 42px;

      border: 0;
      background: transparent;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-password svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: #62738b;
      stroke-width: 2;
    }

    /* Login button */

    .login-btn {
      width: 100%;
      height: 65px;

      border: 0;
      border-radius: 13px;

      margin-top: 5px;

      cursor: pointer;

      background: linear-gradient(
        90deg,
        #ffd018,
        #ffbd00
      );

      color: var(--navy-dark);

      font-size: 21px;
      font-weight: 700;

      box-shadow: 0 10px 24px rgba(255, 190, 0, .22);

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;

      transition: .2s;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 13px 28px rgba(255, 190, 0, .28);
    }

    .login-btn:disabled {
      opacity: .7;
      cursor: not-allowed;
      transform: none;
    }

    .login-arrow {
      position: absolute;
      right: 14px;

      width: 46px;
      height: 46px;

      border-radius: 50%;

      background: var(--navy);

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 27px;
      font-weight: 300;
    }

    /* Messages */

    .message {
      display: none;
      margin-top: 15px;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 14px;
      text-align: center;
    }

    .message.error {
      display: block;
      color: #a22626;
      background: #fff0f0;
      border: 1px solid #ffd1d1;
    }

    .message.success {
      display: block;
      color: #176438;
      background: #effbf3;
      border: 1px solid #c9efd6;
    }

    /* Admin only */

    .admin-only {
      margin-top: 22px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      color: #314c70;

      font-size: 15px;
      font-weight: 500;
    }

    .admin-only::before,
    .admin-only::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #c8d4e3;
    }

    .lock-small {
      font-size: 18px;
    }

    /* Home */

    .home-link {
      margin-top: 17px;
      text-align: center;
    }

    .home-link a {
      color: var(--navy);
      text-decoration: underline;
      font-weight: 600;
      font-size: 16px;
    }

    .home-icon {
      text-decoration: none;
      margin-right: 6px;
    }

    .copyright {
      text-align: center;
      color: #9aa6b4;
      font-size: 11px;
      line-height: 1.5;
      margin-top: 23px;
    }

    /* ==============================
       TABLET
    ============================== */

    @media (max-width: 1050px) {

      .page {
        grid-template-columns: .9fr 1.1fr;
      }

      .brand-panel {
        padding: 45px 28px;
      }

      .login-panel {
        padding: 30px;
      }

      .login-card {
        padding: 25px 32px 32px;
      }

      .company-th {
        font-size: 19px;
      }

      .company-en {
        font-size: 18px;
      }

      .company-description {
        font-size: 15px;
      }
    }

    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 760px) {

      .page {
        display: block;
      }

      .brand-panel {
        min-height: 390px;
        padding: 27px 20px 0;
      }

      .logo-symbol {
        height: 55px;
        gap: 6px;
        margin-bottom: 8px;
      }

      .logo-symbol span {
        width: 15px;
      }

      .logo-symbol span:nth-child(1),
      .logo-symbol span:nth-child(5) {
        height: 30px;
      }

      .logo-symbol span:nth-child(2),
      .logo-symbol span:nth-child(4) {
        height: 43px;
      }

      .logo-symbol span:nth-child(3) {
        height: 55px;
      }

      .company-th {
        font-size: 17px;
      }

      .company-en {
        font-size: 15px;
      }

      .company-description {
        font-size: 13px;
        margin-top: 7px;
      }

      .short-line {
        width: 55px;
        height: 3px;
        margin-top: 8px;
      }

      .artwork-wrap {
        height: 58%;
      }

      .artwork {
        width: 76%;
      }

      .login-panel {
        min-height: auto;
        padding: 25px 14px 35px;
        align-items: flex-start;
      }

      .login-panel::before,
      .login-panel::after {
        display: none;
      }

      .login-card {
        width: 100%;
        border-radius: 24px;
        padding: 21px 19px 27px;
      }

      .language-row {
        margin-bottom: 5px;
      }

      .lang-btn {
        padding: 7px 12px;
        font-size: 13px;
      }

      .mini-symbol {
        height: 70px;
        gap: 5px;
      }

      .mini-symbol span {
        width: 14px;
      }

      .mini-symbol span:nth-child(1),
      .mini-symbol span:nth-child(5) {
        height: 34px;
      }

      .mini-symbol span:nth-child(2),
      .mini-symbol span:nth-child(4) {
        height: 49px;
      }

      .mini-symbol span:nth-child(3) {
        height: 68px;
      }

      .system-title {
        font-size: 32px;
      }

      .system-subtitle {
        font-size: 16px;
        margin-top: 10px;
      }

      .system-subtitle-en {
        font-size: 15px;
      }

      .login-form {
        margin-top: 23px;
      }

      .form-input {
        height: 56px;
      }

      .login-btn {
        height: 59px;
        font-size: 18px;
      }

      .login-arrow {
        width: 41px;
        height: 41px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- =================================
       LEFT BRAND AREA
  ================================== -->

  <section class="brand-panel">

    <div class="brand-content">

      <div class="logo-symbol">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div
        class="company-th"
        data-th="บริษัท ซานเต้ คอนซัลติ้ง จำกัด"
        data-en="SANTE CONSULTING CO., LTD."
      >
        บริษัท ซานเต้ คอนซัลติ้ง จำกัด
      </div>

      <div class="company-en">
        SANTE CONSULTING CO., LTD.
      </div>

      <div
        class="company-description"
        data-th="ผู้เชี่ยวชาญด้านความปลอดภัย อาชีวอนามัย<br>และสิ่งแวดล้อม"
        data-en="Specialists in Safety, Occupational Health<br>and Environment"
      >
        ผู้เชี่ยวชาญด้านความปลอดภัย อาชีวอนามัย<br>
        และสิ่งแวดล้อม
      </div>

      <div class="short-line"></div>

    </div>

    <div class="curve-white"></div>
    <div class="curve-yellow"></div>
    <div class="curve-navy"></div>

    <div class="artwork-wrap">
      <img
        src="sante-admin-artwork.png"
        alt="SANTE Consulting"
        class="artwork"
      >
    </div>

  </section>


  <!-- =================================
       LOGIN AREA
  ================================== -->

  <main class="login-panel">

    <div class="login-card">

      <div class="language-row">

        <div class="language-switch">

          <button
            type="button"
            class="lang-btn active"
            id="thaiButton"
            onclick="setLanguage('th')"
          >
            🇹🇭 ไทย
          </button>

          <button
            type="button"
            class="lang-btn"
            id="englishButton"
            onclick="setLanguage('en')"
          >
            🇬🇧 EN
          </button>

        </div>

      </div>


      <div class="card-logo">

        <div class="mini-symbol">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <h1 class="system-title">
          SANTE SYSTEM
        </h1>

        <div
          class="system-subtitle"
          data-th="ระบบบริหารจัดการ"
          data-en="Management System"
        >
          ระบบบริหารจัดการ
        </div>

        <div class="system-subtitle-en">
          SANTE Consulting
        </div>

      </div>


      <!-- LOGIN FORM -->

      <form class="login-form" id="loginForm">

        <div class="field">

          <label class="field-label" for="email">

            <span class="field-icon">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                <path d="M3 7l9 6 9-6"></path>
              </svg>
            </span>

            <span
              data-th="อีเมล"
              data-en="Email"
            >
              อีเมล
            </span>

          </label>

          <input
            id="email"
            class="form-input"
            type="email"
            autocomplete="email"
            placeholder="example@santeconsulting.co.th"
            required
          >

        </div>


        <div class="field">

          <label class="field-label" for="password">

            <span class="field-icon">
              <svg viewBox="0 0 24 24">
                <rect x="5" y="10" width="14" height="11" rx="2"></rect>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
              </svg>
            </span>

            <span
              data-th="รหัสผ่าน"
              data-en="Password"
            >
              รหัสผ่าน
            </span>

          </label>

          <div class="input-wrap">

            <input
              id="password"
              class="form-input password-input"
              type="password"
              autocomplete="current-password"
              placeholder="กรุณากรอกรหัสผ่าน"
              required
            >

            <button
              class="toggle-password"
              type="button"
              onclick="togglePassword()"
              aria-label="Show password"
            >

              <svg viewBox="0 0 24 24">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>

            </button>

          </div>

        </div>


        <button
          class="login-btn"
          type="submit"
          id="loginButton"
        >

          <span
            id="loginButtonText"
            data-th="เข้าสู่ระบบ"
            data-en="Sign In"
          >
            เข้าสู่ระบบ
          </span>

          <span class="login-arrow">
            →
          </span>

        </button>


        <div
          id="message"
          class="message"
        ></div>

      </form>


      <div class="admin-only">

        <span class="lock-small">🔒</span>

        <span
          data-th="เฉพาะผู้ดูแลระบบเท่านั้น"
          data-en="Administrators only"
        >
          เฉพาะผู้ดูแลระบบเท่านั้น
        </span>

      </div>


      <div class="home-link">

        <a href="index.html">

          <span class="home-icon">⌂</span>

          <span
            data-th="กลับหน้าหลัก"
            data-en="Back to Home"
          >
            กลับหน้าหลัก
          </span>

        </a>

      </div>


      <div class="copyright">
        © 2026 SANTE CONSULTING CO., LTD.<br>
        All rights reserved.
      </div>

    </div>

  </main>

</div>


<script>

  /* ======================================
     SUPABASE
  ====================================== */

  const SUPABASE_URL =
    "https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fcyegjwerxlxhczrfiurz.supabase.co%2F&data=05%7C02%7Cwaleephon.hannaphachewin%40basf.com%7Cc9f7a75f025c4f43b70b08df21018a2c%7Cecaa386bc8df4ce0ad01740cbdb5ba55%7C0%7C0%7C639265962641255259%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=t8QwuETKlxuyt7GBBAN74QI45KpzgVXD%2FUHS5vSVVZY%3D&reserved=0";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Hhr1LDrJqvzdEcHR4cScwA_YA9b9eYF";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* ======================================
     LANGUAGE
  ====================================== */

  let currentLanguage = "th";

  function setLanguage(language) {

    currentLanguage = language;

    const thaiButton =
      document.getElementById("thaiButton");

    const englishButton =
      document.getElementById("englishButton");

    thaiButton.classList.toggle(
      "active",
      language === "th"
    );

    englishButton.classList.toggle(
      "active",
      language === "en"
    );


    document
      .querySelectorAll("[data-th]")
      .forEach(element => {

        element.innerHTML =
          element.getAttribute(
            language === "th"
              ? "data-th"
              : "data-en"
          );

      });


    const password =
      document.getElementById("password");

    password.placeholder =
      language === "th"
        ? "กรุณากรอกรหัสผ่าน"
        : "Enter your password";

  }


  /* ======================================
     PASSWORD VISIBILITY
  ====================================== */

  function togglePassword() {

    const password =
      document.getElementById("password");

    password.type =
      password.type === "password"
        ? "text"
        : "password";

  }


  /* ======================================
     MESSAGE
  ====================================== */

  function showMessage(text, type) {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.className =
      "message " + type;

  }


  function clearMessage() {

    const message =
      document.getElementById("message");

    message.textContent = "";
    message.className = "message";

  }


  /* ======================================
     ADMIN LOGIN
  ====================================== */

  const loginForm =
    document.getElementById("loginForm");

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      clearMessage();

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      const loginButton =
        document.getElementById(
          "loginButton"
        );

      const loginButtonText =
        document.getElementById(
          "loginButtonText"
        );


      loginButton.disabled = true;

      loginButtonText.textContent =
        currentLanguage === "th"
          ? "กำลังเข้าสู่ระบบ..."
          : "Signing in...";


      try {

        /* STEP 1 — Supabase Authentication */

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .signInWithPassword({
              email,
              password
            });


        if (error) {
          throw error;
        }


        if (!data.user) {
          throw new Error(
            "USER_NOT_FOUND"
          );
        }


        /* STEP 2 — Verify staff permission */

        const {
          data: staffAccess,
          error: staffError
        } =
          await supabaseClient.rpc(
            "is_staff"
          );


        if (staffError) {

          await supabaseClient.auth
            .signOut();

          throw staffError;

        }


        if (staffAccess !== true) {

          await supabaseClient.auth
            .signOut();

          showMessage(
            currentLanguage === "th"
              ? "บัญชีนี้ไม่มีสิทธิ์เข้าถึงระบบผู้ดูแล"
              : "This account does not have administrator access.",
            "error"
          );

          return;

        }


        /* STEP 3 — Success */

        showMessage(
          currentLanguage === "th"
            ? "เข้าสู่ระบบสำเร็จ"
            : "Login successful",
          "success"
        );


        setTimeout(
          function() {

            window.location.href =
              "admin.html";

          },
          500
        );


      }

      catch (error) {

        console.error(error);

        let errorMessage;

        if (
          error.message &&
          error.message
            .toLowerCase()
            .includes("invalid login")
        ) {

          errorMessage =
            currentLanguage === "th"
              ? "อีเมลหรือรหัสผ่านไม่ถูกต้อง"
              : "Invalid email or password";

        }

        else {

          errorMessage =
            currentLanguage === "th"
              ? "ไม่สามารถเข้าสู่ระบบได้ กรุณาลองใหม่อีกครั้ง"
              : "Unable to sign in. Please try again.";

        }


        showMessage(
          errorMessage,
          "error"
        );

      }

      finally {

        loginButton.disabled = false;

        loginButtonText.textContent =
          currentLanguage === "th"
            ? "เข้าสู่ระบบ"
            : "Sign In";

      }

    }
  );


  /* ======================================
     ALREADY LOGGED IN
  ====================================== */

  async function checkExistingSession() {

    const {
      data
    } =
      await supabaseClient.auth
        .getSession();


    if (
      data &&
      data.session
    ) {

      const {
        data: staffAccess
      } =
        await supabaseClient.rpc(
          "is_staff"
        );


      if (staffAccess === true) {

        window.location.href =
          "admin.html";

      }

    }

  }


  checkExistingSession();

</script>

</body>
</html>
