<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SANTE Member | ใบเสนอราคาของฉัน</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Prompt,sans-serif;color:#082d69;background:linear-gradient(180deg,#fff,#f2f8fc)}a{color:inherit;text-decoration:none}button{font-family:Prompt,sans-serif}
.topbar{height:82px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 max(28px,calc((100vw - 1480px)/2));background:#fffffff7;border-bottom:1px solid #e7eef6}.brand-logo{width:220px;height:68px;object-fit:contain;object-position:left}.member-area{display:flex;align-items:center;gap:16px}.member-copy{text-align:right}.member-name{font-size:16px;font-weight:600}.member-email{font-size:13px;color:#7184a3}.logout{height:44px;border:1px solid #d5e1ef;border-radius:11px;background:#fff;color:#082d69;padding:0 16px;font-weight:600}
.hero{width:min(1480px,calc(100% - 48px));margin:22px auto 0;overflow:hidden;border-radius:28px;box-shadow:0 10px 30px rgba(11,45,103,.07)}.hero img{display:block;width:100%;height:auto}
.page{width:min(1320px,calc(100% - 40px));margin:auto;padding:26px 0 60px}.crumbs{font-size:13px;color:#6f82a0;margin-bottom:12px}h1{font-size:34px;margin:0}.sub{font-size:15px;color:#6f82a0;margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.stat{background:#fff;border:1px solid #dce7f2;border-radius:18px;padding:18px}.stat span{font-size:13px;color:#7184a3}.stat strong{display:block;font-size:28px;margin-top:5px}
.list{display:grid;gap:12px}.card{display:grid;grid-template-columns:1.3fr .75fr .75fr auto;gap:18px;align-items:center;background:#fff;border:1px solid #dce7f2;border-radius:18px;padding:18px}.no{font-size:13px;color:#7184a3}.title{font-size:18px;font-weight:700;margin-top:3px}.meta{font-size:13px;color:#7184a3;margin-top:4px}.badge{display:inline-flex;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:600;background:#eef5fb;color:#0b568e}.sent{background:#fff5d8;color:#986900}.approved{background:#e8f8ed;color:#237447}.rejected{background:#fff0f0;color:#a52d2d}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 15px;border-radius:11px;background:#ffbf19;color:#082d69;font-size:13px;font-weight:700}.empty{background:#fff;border:1px solid #dce7f2;border-radius:18px;padding:50px;text-align:center;color:#7184a3}.loading{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#fff}
@media(max-width:850px){.topbar{height:64px;padding:6px 12px}.brand-logo{width:120px;height:48px}.member-copy{display:none}.hero{width:calc(100% - 24px);margin-top:10px;border-radius:18px}.page{width:100%;padding:16px 12px 40px}h1{font-size:26px}.sub{font-size:13px}.stats{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:14px}.stat strong{font-size:23px}.card{grid-template-columns:1fr;gap:9px}}
</style></head><body><div id="loading" class="loading">กำลังโหลดใบเสนอราคาของคุณ...</div>
<header class="topbar"><a href="member-home.html"><img class="brand-logo" src="sante%20(en)-logo.png"></a><div class="member-area"><div class="member-copy"><div id="memberName" class="member-name">สมาชิก SANTE</div><div id="memberEmail" class="member-email"></div></div><button id="logout" class="logout">ออกจากระบบ</button></div></header>
<section class="hero"><img src="sante-member-hero.png"></section>
<main class="page"><div class="crumbs"><a href="member-home.html">หน้าหลักสมาชิก</a> › ใบเสนอราคาของฉัน</div><h1>ใบเสนอราคาของฉัน</h1><div class="sub">ดูจำนวนใบเสนอราคาทั้งหมด สถานะ และเปิดรายละเอียดเพื่ออนุมัติราคา</div>
<section class="stats"><div class="stat"><span>ทั้งหมด</span><strong id="allCount">0</strong></div><div class="stat"><span>รอพิจารณา</span><strong id="sentCount">0</strong></div><div class="stat"><span>อนุมัติแล้ว</span><strong id="approvedCount">0</strong></div><div class="stat"><span>อื่น ๆ</span><strong id="otherCount">0</strong></div></section>
<div id="list" class="list"></div></main>
<script>
const db=window.supabase.createClient("https://cyegjwerxlxhczrfiurz.supabase.co","sb_publishable_Hhr1LDrJqvzdEcHR4cScwA_YA9b9eYF",{auth:{storageKey:"sante-member-auth",persistSession:true,autoRefreshToken:true}});
const labels={DRAFT:"ร่าง",SENT:"เสนอราคาแล้ว / รออนุมัติ",APPROVED:"อนุมัติราคาแล้ว",REJECTED:"ไม่อนุมัติ",EXPIRED:"หมดอายุ"};
const cls={SENT:"sent",APPROVED:"approved",REJECTED:"rejected",EXPIRED:"rejected"};
const money=v=>Number(v||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function init(){
 const s=await db.auth.getSession(),u=s.data.session?.user;if(!u){location="member-login.html";return}memberEmail.textContent=u.email||"";
 const p=await db.from("profiles").select("*").eq("id",u.id).maybeSingle();const x=p.data||{};memberName.textContent=[x.title_th,x.firstname_th,x.lastname_th].filter(Boolean).join(" ")||"สมาชิก SANTE";
 const r=await db.from("quotations").select("id,quotation_no,status,organization_name,customer_name,issue_date,valid_until,grand_total,net_receivable,revision_no,service_request_id").eq("member_id",u.id).order("created_at",{ascending:false});
 if(r.error){list.innerHTML='<div class="empty">ไม่สามารถโหลดใบเสนอราคาได้: '+esc(r.error.message)+'</div>';loading.style.display="none";return}
 const q=r.data||[];allCount.textContent=q.length;sentCount.textContent=q.filter(x=>x.status==="SENT").length;approvedCount.textContent=q.filter(x=>x.status==="APPROVED").length;otherCount.textContent=q.filter(x=>!["SENT","APPROVED"].includes(x.status)).length;
 list.innerHTML=q.map(x=>`<article class="card"><div><div class="no">${esc(x.quotation_no||"-")} · Rev.${x.revision_no||0}</div><div class="title">${esc(x.organization_name||x.customer_name||"ลูกค้า")}</div><div class="meta">วันที่ออก ${x.issue_date||"-"} · ใช้ได้ถึง ${x.valid_until||"-"}</div></div><div><span class="badge ${cls[x.status]||""}">${labels[x.status]||esc(x.status||"-")}</span></div><div><div class="meta">ยอดรวม</div><strong>${money(x.grand_total)} บาท</strong></div><div><a class="btn" href="member-quotation.html?id=${x.id}">เปิดใบเสนอราคา</a></div></article>`).join("")||'<div class="empty">ยังไม่มีใบเสนอราคา เมื่อ SANTE ส่งใบเสนอราคาแล้ว รายการจะปรากฏที่นี่</div>';
 loading.style.display="none";
}
logout.onclick=async()=>{await db.auth.signOut();location="member-login.html"};init();
</script></body></html>
